<!-- ======================================================================
  FIREBASE (real, shared, cross-device database).
  This app now stores its data in Firestore instead of the browser, so a
  phone, a laptop, and a different person all see the SAME data.

  TO ACTIVATE (one-time, ~5 minutes, free):
   1. Go to https://console.firebase.google.com → "Add project" (any name).
   2. In the project, open Build → Firestore Database → "Create database"
      → choose "Start in test mode" (you can lock it down later).
   3. Open Project settings (gear icon) → General → "Your apps" → click
      the web icon (</>) → register an app (any nickname, no hosting needed).
   4. Firebase shows you a firebaseConfig object. Copy it and paste it
      below, replacing the placeholder values.
   5. Save this file and reload — the yellow "not connected" banner will
      disappear once it's working.
  Until you do this, the app runs in DEMO MODE (data stays only on this
  device) so you can still click through everything.
======================================================================= -->
<!-- firebase-storage-compat.js intentionally NOT loaded: photos are stored inline in
     Firestore as compressed base64 (see uploadPhotoToStorage), so Storage is unused —
     loading it was pure dead weight on every page load.
     jsPDF, html2canvas and mammoth (.docx import) are loaded lazily on first use
     instead of blocking every page load — see loadPdfLibs()/loadMammothLib() below. -->

<style>
:root{
  --navy:#0A2A4A; --blue:#1D4E89; --blue-light:#E9F1FA; --gold:#C9A227;
  --ink:#132436; --paper:#FFFFFF; --muted:#5A7189; --danger:#B23A3A; --good:#1E7A46;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--blue-light);color:var(--ink);}
h1,h2,h3,.display{font-family:Georgia,'Playfair Display',serif;}
button{font-family:inherit;cursor:pointer;}
.btn{background:var(--blue);color:#fff;border:none;padding:10px 18px;border-radius:6px;font-weight:700;font-size:14px;}
.btn:hover{background:var(--navy);}
.btn-outline{background:#fff;color:var(--blue);border:2px solid var(--blue);padding:9px 16px;border-radius:6px;font-weight:700;}
.btn-danger{background:var(--danger);color:#fff;border:none;padding:8px 14px;border-radius:6px;font-weight:600;}
.btn-gold{background:var(--gold);color:#3a2c00;border:none;padding:10px 18px;border-radius:6px;font-weight:800;}
input,select,textarea{padding:9px 10px;border:1px solid #b9c9da;border-radius:5px;font-size:16px;width:100%;font-family:inherit;}
input.missing-mark::placeholder{color:var(--danger);font-weight:800;opacity:.85;}
label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.03em;}
.card{background:#fff;border-radius:10px;padding:22px;box-shadow:0 2px 10px rgba(10,42,74,.08);margin-bottom:18px;}
.topbar{background:var(--navy);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.topbar .brand{font-family:Georgia,serif;font-weight:800;font-size:22px;letter-spacing:.02em;}
.topbar .brand span{color:var(--gold);}
.layout{display:flex;min-height:calc(100vh - 60px);flex-wrap:wrap;}
.sidebar{width:230px;background:var(--navy);color:#dce8f5;padding:16px 0;}
.sidebar a{display:block;padding:12px 22px;color:#dce8f5;text-decoration:none;font-size:14px;font-weight:600;border-left:4px solid transparent;}
.sidebar a.active,.sidebar a:hover{background:rgba(255,255,255,.08);border-left:4px solid var(--gold);}
.main{flex:1;min-width:280px;padding:26px;max-width:1150px;}
table{border-collapse:collapse;width:100%;background:#fff;}
table.report-table, table.data-table{border:2px solid var(--blue);}
table.report-table th, table.report-table td, table.data-table th, table.data-table td{border:1px solid var(--blue);padding:7px 9px;font-size:13px;text-align:center;}
table.report-table th, table.data-table th{background:var(--blue);color:#fff;font-weight:900;text-transform:uppercase;font-size:11px;letter-spacing:.03em;}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--navy),var(--blue));padding:20px;}
/* Watermark: CT-E SOLUTIONS crest shown faint behind the sign-in card (and every other
   screen sharing .auth-box — teacher/parent sign-up, founder login, password recovery,
   register-a-school). It's a ::before layer positioned behind .auth-box's own content
   (z-index:0 vs 1), so the brand name, contact line, form fields, and every link on top
   stay fully legible — only the crest itself is faded (7% opacity). */

.auth-box>*{position:relative;z-index:1;}
.auth-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.auth-tabs button{flex:1;min-width:90px;padding:9px;border:2px solid var(--blue);background:#fff;color:var(--blue);border-radius:6px;font-weight:700;font-size:13px;}
.auth-tabs button.active{background:var(--blue);color:#fff;}
.role-icons{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;}
.role-icon-btn{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:none;cursor:pointer;padding:4px;}
.role-icon-circle{width:56px;height:56px;border-radius:50%;border:2px solid var(--blue);display:flex;align-items:center;justify-content:center;font-size:24px;background:#fff;color:var(--blue);transition:background .15s,color .15s;}
.role-icon-btn.active .role-icon-circle{background:var(--blue);color:#fff;}
.role-icon-label{font-size:12px;font-weight:700;color:var(--muted);}
.role-icon-btn.active .role-icon-label{color:var(--blue);}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:var(--blue-light);color:var(--blue);}
.note{background:#FFF7E0;border:1px solid var(--gold);padding:12px 14px;border-radius:8px;font-size:13px;color:#5a4a00;}
.warn-banner{background:#7a1f1f;color:#fff;text-align:center;padding:8px 14px;font-size:13px;font-weight:600;}
.warn-banner a{color:#ffe9b0;}
.ok-banner{background:#0f5c33;color:#fff;text-align:center;padding:6px 14px;font-size:12px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.school-name-big{font-size:28px;font-weight:800;font-family:Georgia,serif;color:var(--navy);}
.photo-thumb{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--blue);}
.small{font-size:12px;color:var(--muted);}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.badge-role{background:var(--gold);color:#3a2c00;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:800;text-transform:uppercase;}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--blue-light);color:var(--blue);border-radius:14px;padding:3px 10px;font-size:12px;margin:2px;}

/* ---- Dashboard icon tiles: tap-to-open feature grid, sized to fit a phone screen ---- */
.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;margin:6px 0 22px;}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#fff;
  border:1px solid #cfd9e3;border-radius:12px;padding:14px 6px;box-shadow:0 1px 4px rgba(10,42,74,.06);
  text-align:center;font-family:inherit;transition:box-shadow .12s ease,border-color .12s ease,transform .12s ease;}
.tile:hover, .tile:active{border-color:var(--blue);box-shadow:0 3px 12px rgba(10,42,74,.14);transform:translateY(-1px);}
.tile-icon{font-size:26px;line-height:1;}
.tile-label{font-size:11.5px;font-weight:700;color:var(--navy);line-height:1.25;}

/* ---- Delivered-command toast: brief confirmation that a Submit tap went through ---- */
#deliveredToast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--good);color:#fff;
  padding:10px 20px;border-radius:24px;font-weight:700;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);
  display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:9999;}
#deliveredToast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#deliveredToast .tick{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.25);font-size:12px;line-height:1;}

/* ---- Score sync status: persistent (not auto-dismissing) confirmation that a
   mark-sheet submit has actually reached and been saved on the server, shown
   right on the mark-entry card next to the Submit button. ---- */
.sync-status{margin-top:10px;padding:8px 12px;border-radius:8px;font-size:12.5px;font-weight:600;}
.sync-status.sync-saving{background:#eef4fb;color:var(--blue);border:1px solid var(--blue-light);}
.sync-status.sync-saved{background:#e8f7ee;color:#0f5c33;border:1px solid #b6e6c9;}
.sync-status.sync-error{background:#fdeaea;color:#7a1f1f;border:1px solid #f3b9b9;}

/* ---- Report card (Sample School official layout) ---- */
.rc-card{background:#fff;padding:26px 30px 22px;border:1px solid #cfd9e3;width:100%;max-width:800px;margin:0 auto;font-family:Georgia,'Times New Roman',serif;color:var(--ink);position:relative;overflow:hidden;}
/* Faint background watermark of the school logo — purely decorative, sits behind every
   other element on the card via z-index. Centered and oversized (60% of the card width)
   at very low opacity so it never competes with the actual text/tables for legibility,
   and never printed/exported darker than intended since opacity is baked into the image
   itself via CSS (not something a printer driver can "brighten" back to full strength).
   pointer-events:none so it never intercepts clicks/taps on the editable score cells
   above it. This is separate from — and does not change — the sharp, full-opacity logo
   already shown in the header block (.rc-title-block .rc-logo below). */
.rc-watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:60%;max-width:480px;opacity:.06;z-index:0;pointer-events:none;user-select:none;}
.rc-content{position:relative;z-index:1;}
.rc-topline{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);margin-bottom:8px;font-family:monospace;letter-spacing:.02em;}
.rc-title-block{display:flex;align-items:stretch;gap:12px;text-align:center;border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:14px;}
/* Logo is sized to match the header text block's own height (via align-items:stretch
   + height:100% + aspect-ratio) instead of a fixed px value, so it always looks
   proportionate to the school name/subtitle/meta stack next to it. This is a
   display-only change — the underlying base64 image data is untouched, so it adds
   no extra network request and no re-encoding cost, meaning resolution and
   download/render speed are unaffected. object-fit:cover still crops any source
   image cleanly into that box. */
.rc-title-block .rc-logo{height:100%;width:auto;aspect-ratio:1/1;max-width:90px;object-fit:cover;border-radius:6px;flex-shrink:0;}
.rc-title-block .rc-header-text{flex:1;min-width:0;}
/* School name is the single boldest text on the report card. CSS font-weight tops out
   at 900 (the same weight now used by subject names, table titles, and column titles
   below), so a hairline text-stroke is layered on top of font-weight:900 here to push
   the school name visibly heavier than everything else without reducing their weight. */
.rc-title-block .school{font-size:26px;font-weight:900;-webkit-text-stroke:0.4px currentColor;text-transform:uppercase;letter-spacing:.03em;color:var(--navy);line-height:1.15;margin:2px 0;}
.rc-title-block .subtitle{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-top:3px;}
.rc-title-block .meta{font-size:11px;font-style:italic;color:var(--muted);margin-top:4px;font-weight:700;}

/* The bio photo now lives INSIDE rc-info-table (as a rowspan cell) instead of
   sitting beside it in a flex row — that old layout shrank the table's own
   width by the photo's width+gap, so its right edge fell short of every other
   table on the card. As a plain cell in the same full-width table, the photo
   no longer affects the table's outer edges, so all tables now line up on
   identical left/right edges. */
.rc-bio-photo{width:64px;height:64px;object-fit:cover;border:1px solid var(--blue);border-radius:4px;}
table.rc-info-table{width:100%;border-collapse:collapse;margin-bottom:16px;}
table.rc-info-table td{border:1.4px solid var(--blue);padding:6px 10px;font-size:12px;}
table.rc-info-table td.lbl{background:var(--blue-light);font-weight:900;text-transform:uppercase;font-size:10px;letter-spacing:.03em;color:var(--navy);}
table.rc-info-table td.val{font-weight:700;}
table.rc-info-table td.photo-cell{width:74px;padding:5px;text-align:center;vertical-align:middle;background:#fff;}

.rc-section-title{font-size:12.5px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;color:var(--navy);border-bottom:2px solid var(--navy);padding-bottom:4px;margin:16px 0 8px;}

table.rc-perf{width:100%;border-collapse:collapse;margin-bottom:6px;}
table.rc-perf th{background:var(--blue-light);color:var(--navy);border:1.4px solid var(--blue);padding:6px 8px;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.02em;}
table.rc-perf td{border:1.4px solid var(--blue);padding:6px 8px;font-size:12px;text-align:center;}
table.rc-perf td:first-child{text-align:left;font-weight:900;}
table.rc-perf tbody tr:nth-child(even){background:#F7FAFD;}
table.rc-perf tr.total td{font-weight:800;background:var(--blue-light);border-top:2.4px solid var(--blue);}
table.rc-perf tr.subrow td{font-size:11px;color:var(--muted);background:#FBFDFF;}
table.rc-perf tr.subrow td:first-child{font-weight:400;font-style:italic;padding-left:22px;}
/* Used only in the offscreen copy of the card that html2canvas screenshots for PDF
   export (see mergedTd() in reportCardHTML): a subject-level value (Final Average,
   Grade, Points, Descriptor, Subject name) that spans more than one paper row is
   rendered as two plain, un-rowspanned cells instead — real <td rowspan> across rows
   of unequal height is what triggers html2canvas's text-doubling bug. Removing the
   border between them and forcing a matching plain background recreates the same
   "one merged cell" look without ever asking html2canvas to paint one cell's text
   across two physical table rows. */
table.rc-perf td.mrg-top{border-bottom:none;background:#fff;}
table.rc-perf td.mrg-bot{border-top:none;background:#fff;}

table.rc-summary-table{width:100%;border-collapse:collapse;margin:14px 0;}
table.rc-summary-table td{border:1.4px solid var(--blue);padding:8px 10px;font-size:12px;text-align:center;}
table.rc-summary-table td.lbl{background:var(--blue-light);font-weight:900;text-transform:uppercase;font-size:10px;letter-spacing:.02em;color:var(--navy);}
table.rc-summary-table td.val{font-weight:800;}

table.rc-comments-table{width:100%;border-collapse:collapse;margin-bottom:16px;}
table.rc-comments-table th{background:var(--blue-light);border:1.4px solid var(--blue);padding:6px 10px;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.02em;color:var(--navy);text-align:left;}
table.rc-comments-table td{border:1.4px solid var(--blue);padding:9px 10px;font-size:11.5px;vertical-align:top;width:50%;}

.rc-sign-row{display:flex;justify-content:space-between;font-size:11px;margin:18px 0 10px;flex-wrap:wrap;gap:14px 10px;font-weight:700;}
.rc-sign-row span{border-bottom:1px solid var(--ink);padding-bottom:3px;min-width:120px;display:inline-block;}

.rc-termdates{text-align:center;font-size:11.5px;font-weight:700;margin:4px 0 10px;}
.rc-motto{text-align:center;font-style:italic;font-size:12.5px;color:var(--navy);margin-top:8px;}

.legend-strip{display:flex;gap:9px;flex-wrap:wrap;font-size:9.5px;margin-top:10px;color:var(--muted);align-items:center;justify-content:center;}
.legend-strip b{color:var(--ink);}
.rc-scoring-note{text-align:center;font-size:9px;color:var(--muted);margin-top:4px;font-style:italic;}

/* ---- Master Mark Sheet / Class Analysis: organized single "page" layout.
   Presents the wide table inside a bordered, letterhead-style page (school
   name+logo, sheet title, class/term/year meta line, footer) instead of a
   bare table floating in a plain card — reads like one clean official
   document whether viewed on screen, printed, or exported to PDF. The table
   itself still scrolls horizontally on narrow screens (.mm-tablewrap), but
   everything around it now frames it as a single organized page. */
.mm-page{background:#fff;border:1px solid #cfd9e3;padding:22px 26px 20px;width:100%;max-width:1500px;margin:0 auto;box-shadow:0 2px 10px rgba(10,42,74,.08);}
.mm-header{text-align:center;border-bottom:2px solid var(--navy);padding-bottom:12px;margin-bottom:14px;}
.mm-header .mm-logo{width:50px;height:50px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-right:10px;}
.mm-header .mm-school{font-family:Georgia,'Times New Roman',serif;font-size:22px;font-weight:900;text-transform:uppercase;letter-spacing:.03em;color:var(--navy);vertical-align:middle;}
.mm-header .mm-title{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin-top:5px;}
.mm-header .mm-meta{font-size:12px;color:var(--muted);margin-top:4px;}
.mm-tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--blue);border-radius:6px;}
table.mm-table{border-collapse:collapse;width:100%;min-width:100%;}
table.mm-table th, table.mm-table td{border:1px solid var(--blue);padding:6px 8px;font-size:11px;text-align:center;white-space:nowrap;}
table.mm-table thead th{background:var(--blue);color:#fff;font-weight:900;text-transform:uppercase;font-size:10px;letter-spacing:.02em;position:sticky;top:0;z-index:2;}
table.mm-table tbody tr:nth-child(even){background:#F7FAFD;}
table.mm-table tbody tr:hover{background:var(--blue-light);}
table.mm-table td:nth-child(3){text-align:left;font-weight:700;white-space:normal;min-width:130px;}
.mm-footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 16px;margin-top:14px;padding-top:10px;border-top:1px solid #cfd9e3;font-size:10.5px;color:var(--muted);}
@media print{
  .mm-page{box-shadow:none;border:none;max-width:none;}
  table.mm-table thead th{position:static;}
}
@media (max-width:760px){
  .mm-page{padding:14px 12px;}
  .mm-header .mm-school{font-size:17px;}
}

@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{position:absolute;top:0;left:0;width:100%;}
  table{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  @page{ size:A4; margin:10mm; }
}
@media (max-width:760px){
  .layout{flex-direction:column;}
  .sidebar{width:100%;display:flex;overflow-x:auto;padding:6px;}
  .sidebar a{white-space:nowrap;border-left:none;border-bottom:3px solid transparent;}
  .sidebar a.active{border-bottom:3px solid var(--gold);}
  .grid2,.grid3{grid-template-columns:1fr;}
  .main{padding:14px;}
  table.data-table, table.report-table, table.rc-info-table, table.rc-summary-table, table.rc-comments-table{
    display:block; overflow-x:auto; -webkit-overflow-scrolling:touch;
    white-space:nowrap; border:1px solid var(--blue);
  }
  table.data-table thead, table.data-table tbody, table.data-table tr,
  table.report-table thead, table.report-table tbody, table.report-table tr{ display:table; width:100%; table-layout:auto; }
  /* rc-perf (Academic Performance Analysis) uses rowspan/colspan to merge cells across
     a subject's paper rows and Course Work test columns — forcing its rows to
     display:table (like the other tables above) would break that merging, so instead
     it keeps native table layout and scrolls horizontally via its wrapper div (see
     .rc-perf-wrap) with a minimum width so columns don't get squeezed unreadably. */
  .rc-perf-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--blue); }
  table.rc-perf{ min-width:640px; border:none; }
  .card{padding:16px;}
  .auth-box{padding:26px;}
}
/* Boot splash — shown only until the very first render() call replaces #app's
   contents, so it never needs to be manually hidden or torn down. */
.boot-splash{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:var(--navy);
}
.boot-splash-icon{
  width:84px;height:84px;border-radius:20px;box-shadow:0 6px 24px rgba(0,0,0,.35);
  animation:boot-spin 1.1s cubic-bezier(.5,0,.5,1) infinite;
}
@keyframes boot-spin{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}
.boot-splash-brand{font-family:Georgia,'Playfair Display',serif;font-size:22px;font-weight:800;color:#fff;letter-spacing:.02em;}
.boot-splash-brand span{color:var(--gold);}
.boot-splash-sub{font-size:13px;color:#cfe0f2;letter-spacing:.04em;}
</style>
</head>
<body>

/* ============================================================
   1B. PER-SCHOOL AUTH IDENTITY
   ------------------------------------------------------------
   The anonymous sign-in above only exists so Firestore's security rules see
   request.auth != null before we know which school (if any) this device
   belongs to — it has nothing to do with the app's own username/password
   accounts, which are unaffected by any of this.
   Once a school is known (right after a successful login, or right after a
   school finishes registering), the device switches from that throwaway
   anonymous identity to ONE stable Firebase Auth identity shared by every
   device/teacher/admin at that school, built from the school's own
   registered email. That collapses "one new anonymous user per device,
   forever" down to "one identity per school, reused". It carries no
   access-control meaning by itself — who can see/do what is still entirely
   governed by the app's own username/password/role system.
============================================================ */
function schoolAuthPassword(schoolId){
  // Deterministic (not secret) — every device for a school needs to be able
  // to derive the same password to sign in to that school's shared identity.
  let h = 0;
  const s = 'cte-school-auth::' + schoolId;
  for(let i=0;i<s.length;i++){ h = ((h<<5)-h + s.charCodeAt(i))|0; }
  const base = Math.abs(h).toString(36) + Math.abs((h*2654435761)|0).toString(36) + Math.abs((h^0x5bd1e995)|0).toString(36);
  return ('Aa1!' + base).slice(0, 24); // comfortably meets Firebase's 6-char minimum
}
function normalizeSchoolEmail(email){ return (email||'').trim().toLowerCase(); }
function isValidEmailFormat(email){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email||''); }
function isSchoolEmailTaken(email, excludeSchoolId){
  const e = normalizeSchoolEmail(email);
  if(!e) return false;
  return REGISTRY.some(r=>r.id!==excludeSchoolId && normalizeSchoolEmail(r.email)===e);
}
// Creates (if needed) and switches this device's Firestore session to a school's
// shared auth identity. Safe to call repeatedly. Silently leaves the device on
// its existing (anonymous) session if the school has no email on file yet, or
// if anything here fails — a school's own username/password login must never
// be blocked by this.
async function switchToSchoolAuthIdentity(schoolId, email){
  if(DEMO_MODE || !FIREBASE_READY) return;
  const e = normalizeSchoolEmail(email);
  if(!e || !isValidEmailFormat(e)) return;
  // Already this school's identity (typical case after the first login on a
  // device, thanks to Firebase persisting it across reloads) — nothing to do,
  // no network round trip at all.
  const cur = firebase.auth().currentUser;
  if(cur && !cur.isAnonymous && cur.email && normalizeSchoolEmail(cur.email)===e) return;
  const pw = schoolAuthPassword(schoolId);
  try{
    await firebase.auth().signInWithEmailAndPassword(e, pw);
  }catch(err){
    if(err && (err.code==='auth/user-not-found')){
      try{ await firebase.auth().createUserWithEmailAndPassword(e, pw); }
      catch(err2){ console.error('Could not create school auth identity:', err2); }
    } else {
      console.error('Could not switch to school auth identity:', err);
    }
  }
}
async function ensureSchoolAuthIdentity(schoolId, email){
  if(DEMO_MODE || !FIREBASE_READY) return;
  const e = normalizeSchoolEmail(email);
  if(!e || !isValidEmailFormat(e)) return;
  const pw = schoolAuthPassword(schoolId);
  try{ await firebase.auth().createUserWithEmailAndPassword(e, pw); }
  catch(err){
    if(err && err.code==='auth/email-already-in-use'){
      // Identity already exists (e.g. retry after a partial failure) — just switch to it.
      try{ await firebase.auth().signInWithEmailAndPassword(e, pw); }catch(err2){ console.error(err2); }
    } else { console.error('Could not create school auth identity:', err); }
  }
}

/* ============================================================
   1A. AUTOMATIC SNAPSHOTS
   ============================================================
   Separate from the manual "Download full backup" feature (which relies on
   someone remembering to click a button), the app also takes its own backup
   copies in the background — no download, no action required. Every time a
   school's data loads and it's been at least AUTO_SNAPSHOT_MIN_GAP_DAYS
   since the last one, a full snapshot of that school's data is written into
   Firestore itself, under its own keys (never overwriting live data). The
   last AUTO_SNAPSHOT_KEEP snapshots are kept; older ones are deleted
   automatically so storage doesn't grow forever. An Admin can restore any
   of these from the "Backup & Restore" card, the same way they'd restore
   from a downloaded file.
   ============================================================ */

   1B. BACKUP SCHEMA VERSIONING & MIGRATION
   ============================================================
   Every backup file carries a schemaVersion number. migrateBackupData()
   normalizes ANY backup — old or new, from this version of the app or a
   future one — into the shape the CURRENTLY RUNNING code expects, filling in
   sensible defaults for fields that didn't exist yet when the backup was
   made. This is what lets a backup be restored correctly no matter how many
   updates/upgrades have happened to the app in between: as long as this
   function is updated whenever a new field is added elsewhere (a one-line
   addition), every past backup keeps working forever. Unknown fields (e.g.
   from a NEWER backup being restored into older code) are preserved via the
   initial spread rather than silently dropped, so nothing is lost on a
   later re-restore either.
   ============================================================ */

function migrateBackupData(raw){

  info.pExtraSubjects = Array.isArray(info.pExtraSubjects) ? info.pExtraSubjects : [];

  // deliberately left untouched if absent — their respective helper functions already
  // treat "not present" as "use the syllabus defaults".
  return {
    ...d, // keep any fields this version of the code doesn't know about yet
    schemaVersion: BACKUP_SCHEMA_VERSION,

    accounts: Array.isArray(d.accounts) ? d.accounts : [],

}

function subjectsForLevel(level){

// Teachers relevant to a given level, for the same "Assign Subjects" dropdown: any
// teacher already assigned to at least one class of this level, PLUS any teacher with
// no assignments at all yet (a brand-new teacher account has no level to match, so they
// must still be selectable the first time). A teacher who so far only teaches other
// levels is hidden, since assigning them here would almost always be a mistake.
function teachersForLevel(level){
  const allTeachers = DB.accounts.filter(a=>a.role==='teacher');
  return allTeachers.filter(t=>{
    const myAssigns = DB.assignments.filter(a=>a.teacherUsername===t.username);
    if(!myAssigns.length) return true;
    return myAssigns.some(a=>{ const c = DB.classes.find(x=>x.id===a.classId); return c && c.level===level; });
  });
}

  if(cls.level==='A') return COMPULSORY.includes(subject) || aCompulsoryExtra().includes(subject);
  if(cls.level==='P') return pCompulsoryList().includes(subject);
  return oCompulsoryFor(cls.form).includes(subject);
}

/* ---------- Admission number generation & alphabetical sorting ---------- */
// Builds the school's initials for use inside an admission number, from the school's
// registered name — stripping out generic institution-type wording ("Secondary
// School", "Primary School", "S.S", "P.S", a lone "School") first so those words never
// contribute a letter. E.g. "Kitante Hill Secondary School" -> "KH".
function schoolInitials(){
  const raw = ((DB.info && DB.info.schoolName) || '').trim();
  if(!raw) return 'SCH';
  let cleaned = raw
    .replace(/\bsecondary\s+school\b/gi, ' ')
    .replace(/\bprimary\s+school\b/gi, ' ')
    .replace(/\bs\.?\s*s\.?\b/gi, ' ')
    .replace(/\bp\.?\s*s\.?\b/gi, ' ')
    .replace(/\bschool\b/gi, ' ')
    .trim();
  if(!cleaned) cleaned = raw; // nothing was left over — fall back to the full name
  const initials = cleaned.split(/\s+/).filter(Boolean).map(w=>w[0]).join('').toUpperCase();
  return initials || 'SCH';
}
// Look-back year-of-admission calculator. Each level is its own closed chain that
// resets at its own entry point — Primary resets at P.1, O-Level resets at S.1, and
// A-Level resets at S.5 (an A-Level intake is very often students joining from a
// different school entirely, so it never assumes continuity back through O-Level or
// Primary). Given the level+form a class is being created for RIGHT NOW, this works
// out what year a student in that form would have started at that level's entry
// point — e.g. creating an S.3 class in 2026 looks back 2 steps to 2024 (S.1 in
// 2024, S.2 in 2025, S.3 in 2026). This only ever PRE-FILLS the admission-year field
// — the admin can still type over it for genuine edge cases (a repeated class, a
// student who joined mid-level, etc.), and it never touches a class's year after the
// class already exists (see the 'change' listener below — it only fires while the
// admin is actively picking a level/form, not on page load).
const FORM_SEQUENCE_BY_LEVEL = {
  P: PRIMARY_FORMS,                 // P.1 .. P.7
  O: ['S.1','S.2','S.3','S.4'],
  A: ['S.5','S.6']
};
// Best-effort auto-detection of a class's Form from its NAME, used only to backfill
// classes left over from before this school's classes captured a Form value at all
// (see migrateAdmissionSystem below) — never overrides a Form that's already set.
// Recognizes the digit written plainly ("S.6", "S6"), spelled out ("Senior Six",
// "Primary Four"), or as "Form 6" / "Form Six" (common alternate naming for
// secondary forms). Returns null, leaving the class for the admin to fix by hand via
// the "Form not set" warning on the Classes list, if nothing in the name matches any
// form valid for that class's level.
const NUMBER_WORDS = ['ZERO','ONE','TWO','THREE','FOUR','FIVE','SIX','SEVEN'];
function inferFormFromClassName(name, level){
  const forms = FORM_SEQUENCE_BY_LEVEL[level] || [];
  const cleaned = ' ' + String(name||'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim() + ' ';
  for(const form of forms){
    const digit = form.slice(-1);
    const word = NUMBER_WORDS[Number(digit)];
    const shortPrefix = level==='P' ? 'P' : 'S';
    const longPrefix = level==='P' ? 'PRIMARY' : 'SENIOR';
    const patterns = [
      new RegExp(`[^A-Z0-9]${shortPrefix}\\s?${digit}[^A-Z0-9]`),
      new RegExp(`[^A-Z0-9]${longPrefix}\\s+${word}[^A-Z0-9]`)
    ];
    if(level!=='P'){
      patterns.push(new RegExp(`[^A-Z0-9]FORM\\s+${digit}[^A-Z0-9]`));
      patterns.push(new RegExp(`[^A-Z0-9]FORM\\s+${word}[^A-Z0-9]`));
    }
    if(patterns.some(re=>re.test(cleaned))) return form;
  }
  return null;
}
function computeLookbackAdmissionYear(level, form){
  const refYear = (DB.info && DB.info.currentYear) || new Date().getFullYear();
  const norm = v => String(v||'').trim().toUpperCase().replace(/\s+/g,'');
  const normForm = norm(form);
  // Look the form up against EVERY level's own chain, not only the chain for the
  // class's stored 'level' field. Each form value (P.1..P.7, S.1..S.4, S.5..S.6) is
  // unique to exactly one chain, so this always finds the right offset — including
  // for a class whose 'level' field is stale, blank, or was set before A-Level was
  // split out as its own level. This is what makes S.6 correctly look back one year
  // (to 2025 when the school's current year is 2026) even on an older class record
  // where 'level' might not reliably say "A".
  for(const lvl of Object.keys(FORM_SEQUENCE_BY_LEVEL)){
    const idx = FORM_SEQUENCE_BY_LEVEL[lvl].map(norm).indexOf(normForm);
    if(idx !== -1) return refYear - idx;
  }
  // Form isn't recognized at all (blank, custom text, etc.) — fall back to the
  // passed level's own chain so behavior is at least predictable, even though this
  // path should be rare.
  const seq = FORM_SEQUENCE_BY_LEVEL[level] || [];
  const offset = Math.max(0, seq.map(norm).indexOf(normForm));
  return refYear - offset;
}
// Full admission number format: SCHOOLINITIALS/YEAR-OF-ADMISSION/LEVEL/3-DIGIT-No
// e.g. KH/2024/O/007. The year is worked out FRESH, every single time a student is
// added — from that class's level+form and the school's CURRENT year — never read
// from a value stored on the class itself. This matters because a class ("S.3 East")
// is a reusable slot, not a one-off cohort: it keeps existing term after term, year
// after year, hosting a different set of students each time as they get promoted in
// and out. A student added into that same S.3 slot in 2026 is a different cohort
// from one added in 2024, so their look-back year must differ too, even though
// they're going into the class with the exact same name. The 3-digit number is a
// per-class running sequence starting at 001 that never resets or gets reassigned —
// every student keeps the same admission number for as long as they remain at the
// school, even if they're later promoted to a new class.
function nextAdmissionNumber(cls){
  const year = computeLookbackAdmissionYear(cls.level, cls.form);
  cls.nextAdmSeq = (cls.nextAdmSeq||0) + 1;
  const seq = String(cls.nextAdmSeq).padStart(3,'0');
  return `${schoolInitials()}/${year}/${cls.level||'O'}/${seq}`;
}
// Same format as nextAdmissionNumber but read-only — used to show the admin a live
// preview of what a new student's admission number WILL be, without actually
// consuming the next sequence number until the form is really submitted.
function peekNextAdmissionNumber(cls){
  if(!cls) return '';
  const year = computeLookbackAdmissionYear(cls.level, cls.form);
  const seq = String((cls.nextAdmSeq||0)+1).padStart(3,'0');
  return `${schoolInitials()}/${year}/${cls.level||'O'}/${seq}`;
}
// Alphabetical (A-Z) sort by student name, used everywhere a class roster or student
// list is displayed, so admins/teachers always see students in the same, predictable
// order regardless of the order they were admitted or bulk-uploaded in.
function sortByName(arr){
  return (arr||[]).slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'', undefined, {sensitivity:'base', numeric:true}));
}
// Aggregate (sum of grade-points) of the 4 PLE-core subjects → Division, the Ugandan
// primary equivalent of an O/A-Level overall grade.
function primaryDivisionFor(aggregate){
  if(aggregate===null) return null;
  for(const d of PLE_DIVISIONS) if(aggregate>=d.min && aggregate<=d.max) return d.name;
  return 'Division U';
}
function primaryRemark(division, who){
  const map = {
    'Division 1': who==='class' ? 'Excellent performance this term. Keep up the excellent work!' : 'An excellent result — well done.',
    'Division 2': who==='class' ? 'Very good performance. Keep working hard.' : 'A very good result this term.',
    'Division 3': who==='class' ? 'Good performance, but there is clear room for improvement.' : 'A fair result — more effort next term will help.',
    'Division 4': who==='class' ? 'Fair performance. More effort and attention is needed.' : 'This result calls for renewed effort next term.',
    'Division U': who==='class' ? 'Below average performance. Needs serious improvement and support.' : 'This result is a serious concern and needs urgent action.'
  };
  return map[division] || (who==='class' ? 'Performance on record. Keep working hard.' : 'Result on record.');
}

let SCHOOL_ID = null;
let REGISTRY = [];
let SYSTEM_OWNER = null;

// Tracks, per mark-entry column (assignment+paper+kind+label), which students were

// Populated right after a "saveScores" submit so the mark sheet can flag them with an
// X — but only after a submit has actually happened, never while a box is simply empty

let MISSING_MARKERS = {};
function missingMarkersKey(assignId, paper, kind, label){ return `${assignId}|${paper}|${kind}|${label||''}`; }
// Tracks, per mark-entry column, whether the teacher's last submit for that
// column has actually reached the server yet: 'saving' the instant Submit is
// pressed (scores are already visible on-screen at this point — see
// upsertScores — but not yet confirmed durable), 'saved' once the background

// failed. Read by scoresEntryView to render a persistent status line (not
// just the brief toast) so a teacher can see, and trust, that their marks
// have actually gone through before navigating away — since a saved score is
// what makes it show up on that student's report card.
let SCORE_SYNC_STATUS = {};
function scoreSyncKey(assignId, paper, kind, label){ return `${assignId}|${paper}|${kind}|${label||''}`; }
function syncStatusBanner(key){
  const s = SCORE_SYNC_STATUS[key];
  if(!s) return '';
  if(s.state==='saving') return `<div class="sync-status sync-saving" id="syncStatus_${esc(key)}">⏳ Saving &amp; sending your marks…</div>`;
  if(s.state==='error') return `<div class="sync-status sync-error" id="syncStatus_${esc(key)}">⚠ Not saved — check your connection and hit Submit again. Nothing on the report card has changed yet.</div>`;
  if(s.state==='saved') return `<div class="sync-status sync-saved" id="syncStatus_${esc(key)}">✓ Sent &amp; saved${s.at?` at ${fmtDateTime(s.at)}`:''} — these marks are already showing on the report card.</div>`;
  return '';
}

/* ============================================================
   4. STORAGE LAYER
   "Shared" data → Firestore (real, cross-device, shared by everyone).
   "Personal" data → localStorage (only the current device's login session —
   that one SHOULD stay local, so each device can be logged in separately).
   ============================================================ */
async function getShared(key, fallback){
  if(DEMO_MODE){ try{ const raw = localStorage.getItem('cte_demo_'+key); return raw!==null? JSON.parse(raw): fallback; }catch(e){ return fallback; } }
  try{
    if(AUTH_READY) await AUTH_READY;
    const snap = await db.collection(COLLECTION).doc(key).get();
    return snap.exists ? snap.data().value : fallback;
  }catch(e){
    console.error(e);
    DATA_LOAD_FAILED = true;
    showFatal(dbErrorMessage(e, 'load data'));
    return fallback;
  }
}
async function deleteShared(key){
  if(DEMO_MODE){ try{ localStorage.removeItem('cte_demo_'+key); }catch(e){ console.error(e); } return; }
  try{
    if(AUTH_READY) await AUTH_READY;
    await db.collection(COLLECTION).doc(key).delete();
  }catch(e){
    console.error(e);
    showFatal(dbErrorMessage(e, 'delete some data'));
  }
}
async function setShared(key, val){
  if(DEMO_MODE){ try{ localStorage.setItem('cte_demo_'+key, JSON.stringify(val)); }catch(e){ console.error(e); } return; }
  try{
    if(AUTH_READY) await AUTH_READY;
    await db.collection(COLLECTION).doc(key).set({ value: val, updatedAt: Date.now() });
  }catch(e){
    console.error(e);
    showFatal(dbErrorMessage(e, 'save your change'));
  }
}

/* ------------------------------------------------------------
   SCORES ARE SHARDED, one small document per term+year, instead of one
   ever-growing document for a school's whole history. Firestore hard-caps
   every document at 1MiB; a single school's scores (every test, every
   subject, every term, forever) would eventually blow past that. Splitting
   by term+year keeps each document small no matter how many years of data
   pile up, while the app still reads/writes DB.scores as one in-memory
   array everywhere else — only the load/save layer changed.
------------------------------------------------------------- */
function scoreShardKey(term, year){ return `${year}_${term}`; }
// Converts a term/year into a single increasing number so "how far back is this
// term" is a simple subtraction — Term 1 2025 < Term 2 2025 < Term 1 2026, etc.
function termIndex(term, year){
  const n = {'Term 1':1,'Term 2':2,'Term 3':3}[term] || 0;
  return (Number(year)||0)*3 + n;
}
// Admins can look back at most this many terms from the school's current term —
// results/report cards for the current term plus the MAX_TERMS_BEHIND terms
// before it stay available; anything older is pruned to keep storage minimal.
const MAX_TERMS_BEHIND = 5;
function termsBehindCurrent(term, year){ return termIndex(DB.info.currentTerm, DB.info.currentYear) - termIndex(term, year); }
// Deletes any score shard older than the MAX_TERMS_BEHIND retention window. Called
// whenever the school's current term/year is advanced (see the "setTerm" form),
// which is the natural point at which older terms roll out of the window.
async function pruneOldScores(){
  if(!SCHOOL_ID || !DB.info) return;
  const keep = [], dropKeys = new Set();
  DB.scores.forEach(r=>{
    const dist = termsBehindCurrent(r.term, r.year);
    if(dist>=0 && dist<=MAX_TERMS_BEHIND) keep.push(r); else dropKeys.add(scoreShardKey(r.term, r.year));
  });
  if(!dropKeys.size) return;
  DB.scores = keep;
  await Promise.all([...dropKeys].map(k=>setShared(`sch_${SCHOOL_ID}_scores_${k}`, [])));
  const known = KNOWN_SCORE_SHARDS[SCHOOL_ID] || new Set();
  dropKeys.forEach(k=>known.delete(k));
  KNOWN_SCORE_SHARDS[SCHOOL_ID] = known;
}
// Automatic migration that brings an existing school onto the admission-number
// scheme with look-back admission years: every class gets a nextAdmSeq counter, and
// every existing student is regenerated a fresh, correctly-formatted admission
// number — numbered 001-upwards per class in their existing (roughly enrollment)
// order, with the year worked out per-student from that class's level+form (see
// computeLookbackAdmissionYear) — e.g. an S.3 student looks back to 2024, an S.6
// student looks back to 2025, a P.4 student looks back accordingly — never one flat
// year for everyone.
//
// Guarded by a VERSION NUMBER (ADM_SCHEMA_VERSION), not a one-time boolean. This
// makes it fully automatic and self-healing: it quietly re-applies itself, on its
// own, the next time each school loads, whenever this constant is bumped — which
// covers a school that already ran an earlier version of this migration and would
// otherwise be permanently stuck on the old format. Once a school is caught up to
// the current version it's a no-op again until the version next changes, and
// brand-new students always get their number from nextAdmissionNumber() directly.
const ADM_SCHEMA_VERSION = 5;
async function migrateAdmissionSystem(){
  if(!DB.info || (DB.info.admSchemaVersion||0) >= ADM_SCHEMA_VERSION) return;
  // Backfill any class left with no Form value at all (see inferFormFromClassName)
  // BEFORE generating admission numbers below, so a class like "SENIOR SIX (A-Level)"
  // gets its Form auto-detected as S.6 and every student in it is numbered with the
  // correct look-back year in the very same pass — never overrides a Form that's
  // already set, and never guesses across levels (only matches against the forms
  // valid for that class's own level).
  DB.classes.forEach(cls=>{
    if(!cls.form){
      const inferred = inferFormFromClassName(cls.name, cls.level);
      if(inferred) cls.form = inferred;
    }
  });
  DB.classes.forEach(cls=>{ cls.nextAdmSeq = 0; });
  DB.classes.forEach(cls=>{
    DB.students.filter(s=>s.classId===cls.id).forEach(s=>{
      s.admSeq = (cls.nextAdmSeq = (cls.nextAdmSeq||0) + 1);
      s.admNo = nextAdmissionNumberFromSeq(cls, s.admSeq);
      if(!s.status) s.status = 'active';
    });
  });
  DB.info.admSchemaVersion = ADM_SCHEMA_VERSION;
  DB.info.admSchemaMigrated = true; // kept for backward compatibility with older reads of this flag
  await Promise.all([saveInfo(), saveClasses(), saveStudents()]);
}
// Pure formatter shared by the migration above (which already knows the sequence
// number for each student) so the format logic lives in exactly one place.
function nextAdmissionNumberFromSeq(cls, seq){
  const year = computeLookbackAdmissionYear(cls.level, cls.form);
  return `${schoolInitials()}/${year}/${cls.level||'O'}/${String(seq).padStart(3,'0')}`;
}
// "Old Students" retention: a student marked as left/completed is kept, fully
// visible under Old Students, for two terms after the term they left in — then
// their record (profile, photo, scores, and any parent-account link) is purged
// completely. Called at the same point pruneOldScores() is — whenever the
// school's current term/year is advanced — since that's the natural moment for
// the two-term window to roll forward.
const OLD_STUDENT_RETENTION_TERMS = 2;
async function pruneOldStudents(){
  if(!SCHOOL_ID || !DB.info) return;
  const toPurge = DB.students.filter(s=> s.status==='left' && termsBehindCurrent(s.leftTerm, s.leftYear) >= OLD_STUDENT_RETENTION_TERMS);
  if(!toPurge.length) return;
  const purgeIds = new Set(toPurge.map(s=>s.id));
  DB.students = DB.students.filter(s=>!purgeIds.has(s.id));
  DB.scores = DB.scores.filter(sc=>!purgeIds.has(sc.studentId));
  // A parent account linked to a purged student is unlinked rather than deleted
  // outright, so the admin can still see and manage the account itself afterwards.
  DB.accounts.forEach(a=>{ if(a.role==='parent' && purgeIds.has(a.studentId)) a.studentId = null; });
  await Promise.all([saveStudents(), saveScores(), saveAccounts()]);
  toPurge.forEach(s=>{ if(s.photo) deletePhotoFromStorage(s.photo); });
}
async function loadAllScores(schoolId){
  const prefix = `sch_${schoolId}_scores_`;
  let rows = [];
  const shardKeys = new Set();
  if(DEMO_MODE){
    const localPrefix = 'cte_demo_'+prefix;
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(localPrefix)===0){
        shardKeys.add(k.slice(localPrefix.length));
        try{ rows = rows.concat(JSON.parse(localStorage.getItem(k))||[]); }catch(e){}
      }
    }
  } else {
    try{
      if(AUTH_READY) await AUTH_READY;
      const end = prefix + '\uf8ff';
      const snap = await db.collection(COLLECTION)
        .where(firebase.firestore.FieldPath.documentId(), '>=', prefix)
        .where(firebase.firestore.FieldPath.documentId(), '<=', end)
        .get();
      snap.forEach(doc=>{
        shardKeys.add(doc.id.slice(prefix.length));
        rows = rows.concat((doc.data().value)||[]);
      });
    }catch(e){
      console.error(e);
      DATA_LOAD_FAILED = true;
      showFatal('Could not reach the database. Check your internet connection and Firestore setup.');
    }
  }
  KNOWN_SCORE_SHARDS[schoolId] = shardKeys;
  // One-time migration: scores created before sharding all lived in one
  // sch_{id}_scores document. Fold any of those in, then saveScores() will
  // write them out into proper shards and this legacy doc gets cleaned up.
  const legacy = await getShared(`sch_${schoolId}_scores`, null);
  if(legacy && legacy.length){
    const seen = new Set(rows.map(r=>r.id));
    legacy.forEach(r=>{ if(!seen.has(r.id)) rows.push(r); });
  }
  return rows;
}
async function purgeScoreShards(schoolId){
  const prefix = `sch_${schoolId}_scores_`;
  if(DEMO_MODE){
    const localPrefix = 'cte_demo_'+prefix;
    const toRemove = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(localPrefix)===0) toRemove.push(k);
    }
    toRemove.forEach(k=>localStorage.removeItem(k));
    return;
  }
  try{
    if(AUTH_READY) await AUTH_READY;
    const end = prefix + '\uf8ff';
    const snap = await db.collection(COLLECTION)
      .where(firebase.firestore.FieldPath.documentId(), '>=', prefix)
      .where(firebase.firestore.FieldPath.documentId(), '<=', end)
      .get();
    await Promise.all(snap.docs.map(d=>d.ref.delete()));
  }catch(e){ console.error(e); }
}
async function saveScoresShardedFor(schoolId, scores){
  const groups = {};
  (scores||[]).forEach(r=>{ const k=scoreShardKey(r.term, r.year); (groups[k]=groups[k]||[]).push(r); });
  const keys = new Set(Object.keys(groups));
  const known = KNOWN_SCORE_SHARDS[schoolId] || new Set();
  const writes = [];
  keys.forEach(k=> writes.push(setShared(`sch_${schoolId}_scores_${k}`, groups[k])) );
  // A term/year that used to have scores but has none now (e.g. last row for
  // that term was deleted) — clear its shard instead of leaving stale data.
  known.forEach(k=>{ if(!keys.has(k)) writes.push(setShared(`sch_${schoolId}_scores_${k}`, [])); });
  await Promise.all(writes);
  await deleteShared(`sch_${schoolId}_scores`); // one-time cleanup of the old single-doc format
  KNOWN_SCORE_SHARDS[schoolId] = keys;
}

/* ------------------------------------------------------------
   CONCURRENT-SAFE, NO-WAIT SCORE WRITES.
   Two things matter when several teachers save marks at the same moment:
   (1) no teacher should ever sit and wait for the network just to see their
       own mark reflected, no matter how many others are saving right then,
       and (2) every mark any of them submits must end up permanently stored
       and visible on report cards — none silently dropped.

   INSTANT (no delay): upsertScores()/deleteScores() merge the change into
   the in-memory DB.scores array synchronously, before any network request
   even starts. Callers can render the updated screen immediately after
   calling them — the on-screen data is already correct by the time the
   function call returns, regardless of how long the actual save takes.

   GUARANTEED PERSISTENCE (no lost writes): the real save happens inside a
   Firestore transaction (mergeScoreShard below), not a plain "read, then
   write". A transaction reads the shard's current server state and writes
   the merged result back atomically; if a second teacher's transaction
   touched the same shard in between, Firestore detects that conflict itself
   and automatically re-runs the transaction against the new state — so two,
   ten, or fifty teachers saving marks in the exact same instant can never
   overwrite one another. Every submitted mark is retried until it's safely
   stored, entirely transparently, with no extra waiting on the teacher's end.

   Rows are matched by natural key (student+subject+paper+kind+label+term+
   year) as well as by id, so that if two tabs each generate a fresh id for
   what turns out to be the same logical mark, the merge still lands as one
   corrected value instead of two duplicate rows.
------------------------------------------------------------- */
function scoreNaturalKey(r){ return [r.studentId,r.subject,r.paper,r.kind,r.label||'',r.term,r.year].join('|'); }
function mergeRowIntoShard(fresh, row){
  let idx = fresh.findIndex(x=>x.id===row.id);
  if(idx<0){
    idx = fresh.findIndex(x=>scoreNaturalKey(x)===scoreNaturalKey(row));
    // Same logical mark already exists under a different id (a race between
    // two tabs creating it at once) — keep the existing id so we correct
    // that one row instead of adding a duplicate.
    if(idx>=0) row = Object.assign({}, row, {id: fresh[idx].id});
  }
  if(idx>=0) fresh[idx]=row; else fresh.push(row);
  return fresh;
}
async function mergeScoreShard(schoolId, term, year, mutate){
  const shardSuffix = scoreShardKey(term, year);
  const shardKey = `sch_${schoolId}_scores_${shardSuffix}`;
  let merged;
  if(DEMO_MODE){
    // Single device — no real concurrent writers, so a plain read-merge-write
    // (via localStorage) is safe and there's no transaction API to use here.
    const fresh = await getShared(shardKey, []);
    merged = mutate(fresh.slice());
    await setShared(shardKey, merged);
  } else {
    if(AUTH_READY) await AUTH_READY;
    merged = await db.runTransaction(async tx=>{
      const ref = db.collection(COLLECTION).doc(shardKey);
      const snap = await tx.get(ref);
      const fresh = snap.exists ? (snap.data().value||[]) : [];
      const result = mutate(fresh.slice());
      tx.set(ref, { value: result, updatedAt: Date.now() });
      return result;
    });
  }
  const known = KNOWN_SCORE_SHARDS[schoolId] = KNOWN_SCORE_SHARDS[schoolId] || new Set();
  known.add(shardSuffix);
  if(schoolId===SCHOOL_ID){
    // Reconcile with the authoritative, transaction-merged server truth —
    // this folds in anything another teacher saved to this same shard in
    // the meantime too, not just this tab's own change.
    DB.scores = DB.scores.filter(r=>scoreShardKey(r.term,r.year)!==shardSuffix).concat(merged);
  }
  return merged;
}
// Upsert one or more score rows. Updates DB.scores immediately (synchronously,
// before the returned promise's network write even begins) so the caller can
// render right away; the promise resolves once the change is safely and
// permanently persisted (or rejects if it ultimately couldn't be saved, e.g.
// no connection — callers should surface that to the teacher rather than
// assume success).
function upsertScores(rows){
  rows = Array.isArray(rows) ? rows : [rows];
  if(!rows.length) return Promise.resolve();
  rows.forEach(row=>{ mergeRowIntoShard(DB.scores, row); }); // optimistic local update
  const byShard = {};
  rows.forEach(r=>{
    const k = scoreShardKey(r.term, r.year);
    (byShard[k] = byShard[k] || {term:r.term, year:r.year, rows:[]}).rows.push(r);
  });
  return Promise.all(Object.values(byShard).map(({term,year,rows})=>
    mergeScoreShard(SCHOOL_ID, term, year, fresh=>{
      rows.forEach(row=>{ mergeRowIntoShard(fresh, row); });
      return fresh;
    })
  ));
}
// Delete one or more score rows. Pass the full row (not just an id) so the
// row's term/year is known and the right shard gets merged. Same instant
// local update + guaranteed-persistence pattern as upsertScores.
function deleteScores(rows){
  rows = Array.isArray(rows) ? rows : [rows];
  if(!rows.length) return Promise.resolve();
  const idsToRemove = new Set(rows.map(r=>r.id));
  DB.scores = DB.scores.filter(x=>!idsToRemove.has(x.id)); // optimistic local update
  const byShard = {};
  rows.forEach(r=>{
    const k = scoreShardKey(r.term, r.year);
    (byShard[k] = byShard[k] || {term:r.term, year:r.year, ids:new Set()}).ids.add(r.id);
  });
  return Promise.all(Object.values(byShard).map(({term,year,ids})=>
    mergeScoreShard(SCHOOL_ID, term, year, fresh=>fresh.filter(x=>!ids.has(x.id)))
  ));
}

async function loadSchoolData(id){
  // These 9 reads are all independent documents — awaiting them one at a time
  // (the old code) meant paying a full network round trip for each, back to
  // back, which is what made logging in and loading a school feel slow.
  // Firing them together and waiting on the whole batch cuts load time down
  // to roughly the time of the single slowest read instead of the sum of all
  // of them.
  const [info, accounts, classes, students, assignments, scores, bands, obands, pbands, autoSnapshots, legacyScores] = await Promise.all([
    getShared(`sch_${id}_info`, null),
    getShared(`sch_${id}_accounts`, []),
    getShared(`sch_${id}_classes`, []),
    getShared(`sch_${id}_students`, []),
    getShared(`sch_${id}_assignments`, []),
    loadAllScores(id),
    getShared(`sch_${id}_bands`, DEFAULT_A_BANDS),
    getShared(`sch_${id}_obands`, DEFAULT_O_BANDS),
    getShared(`sch_${id}_pbands`, DEFAULT_P_BANDS),
    getShared(`sch_${id}_autosnaps_index`, []),
    // One-time migration for scores created before sharding (see loadAllScores):
    // this used to run as its own extra network round trip AFTER the score
    // shards finished loading. Now it's fired at the same time as everything
    // else, so it costs nothing extra once a school has been migrated (which
    // is every school that has ever saved a score since sharding shipped).
    getShared(`sch_${id}_scores`, null),
  ]);
  DB.info = info; DB.accounts = accounts; DB.classes = classes; DB.students = students;
  DB.assignments = assignments; DB.scores = scores; DB.bands = bands; DB.obands = obands;
  DB.pbands = pbands; DB.autoSnapshots = autoSnapshots;
  if(legacyScores && legacyScores.length){
    const seen = new Set(DB.scores.map(r=>r.id));
    legacyScores.forEach(r=>{ if(!seen.has(r.id)) DB.scores.push(r); });
  }
}
/* ---- Global credential uniqueness (no two accounts anywhere may share a
   username, and no two accounts anywhere may share a password) ---- */
async function collectAllCredentials(){
  // Every school's accounts doc is independent — fetch them all together
  // instead of one school at a time (this ran on every signup/account-create,
  // so on a platform with many schools the old sequential loop was one of the
  // slower things a user could trigger).
  const perSchool = await Promise.all(REGISTRY.map(reg=>getShared(`sch_${reg.id}_accounts`, [])));
  const all = [];
  REGISTRY.forEach((reg,i)=>{
    perSchool[i].forEach(a=> all.push({username:a.username, password:a.password, schoolId:reg.id}));
  });
  if(SYSTEM_OWNER) all.push({username:SYSTEM_OWNER.username, password:SYSTEM_OWNER.password, schoolId:null});
  return all;
}
// opts: {excludeSchoolId, excludeUsername} lets an account being edited skip colliding with itself
// A new account is blocked only if BOTH its username and its password
// exactly match an existing account elsewhere (that pair would be truly
// ambiguous at login). Having just one of the two in common with someone
// else's account is fine and does not block account creation.
async function checkCredentialUniqueness(username, password, opts){
  opts = opts||{};
  const all = await collectAllCredentials();
  let exactMatch=false;
  for(const a of all){
    const isSelf = opts.excludeSchoolId!==undefined && a.schoolId===opts.excludeSchoolId && a.username===opts.excludeUsername;
    if(isSelf) continue;
    if(username && password && a.username && a.username.toLowerCase()===username.toLowerCase() && a.password===password){
      exactMatch = true; break;
    }
  }
  return {exactMatch};
}
/* ---- Per-school username uniqueness ----
   Usernames only need to be unique *within one school*: no two accounts at the
   same school (owner/admin, teacher, or parent) may share a username, but two
   different schools are free to each hand their own staff the same username —
   they're separate logins that just happen to look alike, and passwords may
   repeat anywhere (even system-wide). Always pass just the ONE school's own
   accounts array here, never every school's accounts, and, when editing an
   existing account, its current username so it doesn't collide with itself. */
function isUsernameTakenInSchool(username, accounts, excludeUsername){
  const uLower = (username||'').trim().toLowerCase();
  if(!uLower) return false;
  return (accounts||[]).some(a=>{
    if(!a.username) return false;
    if(excludeUsername && a.username.toLowerCase()===excludeUsername.trim().toLowerCase()) return false;
    return a.username.toLowerCase()===uLower;
  });
}

const SCHOOL_DATA_KEYS = ['info','accounts','classes','students','assignments','scores','bands','obands','pbands'];
/* ---- Founder-only: approximate Firestore storage estimate ----
   The Firebase client SDK has no API for "how much of my project's quota is
   used" — that figure only exists in the GCP/Firebase Console or via
   server-side billing APIs that need admin credentials, which don't belong
   in a public-facing file. This is a heuristic stand-in: it sums the
   JSON-serialized size of every document this app itself writes, across
   every school, as a rough proxy for stored bytes. It will not exactly match
   Firestore's real internal accounting (per-document overhead, indexes, and
   metadata aren't included), so treat it as an early-warning signal, not a
   precise gauge — and it's deliberately founder-only.
   FIRESTORE_FREE_TIER_BYTES: the Spark (free) plan's total stored-data cap
   as of when this was written. If this school platform is on a paid (Blaze)
   plan instead, there's no hard storage cap — change this constant to
   whatever internal budget the founder wants to be warned about instead. */
const STORAGE_ESTIMATE_KEY = '_storage_estimate';
const FIRESTORE_FREE_TIER_BYTES = 1 * 1024 * 1024 * 1024; // 1 GiB
const STORAGE_WARN_RATIO = 0.8; // start warning once 80% of the budget above is estimated used
// Recomputes the estimate from scratch by reading every school's data (this
// is the expensive part — one read per document, per school) and caches the
// result in a small shared doc so future founder logins can show it for
// free. Only ever triggered explicitly by the founder, never automatically.
async function computeStorageEstimate(){
  const perSchool = await Promise.all(REGISTRY.map(async reg=>{
    const [info, accounts, classes, students, assignments, scores, bands, obands, pbands] = await Promise.all([
      getShared(`sch_${reg.id}_info`, null),
      getShared(`sch_${reg.id}_accounts`, []),
      getShared(`sch_${reg.id}_classes`, []),
      getShared(`sch_${reg.id}_students`, []),
      getShared(`sch_${reg.id}_assignments`, []),
      loadAllScores(reg.id),
      getShared(`sch_${reg.id}_bands`, null),
      getShared(`sch_${reg.id}_obands`, null),
      getShared(`sch_${reg.id}_pbands`, null),
    ]);
    const bytes = [info, accounts, classes, students, assignments, scores, bands, obands, pbands]
      .reduce((sum, obj)=> sum + (obj ? JSON.stringify(obj).length : 0), 0);
    return {schoolId: reg.id, name: reg.name, studentCount: (students||[]).length, bytes};
  }));
  const totalBytes = perSchool.reduce((s,x)=>s+x.bytes, 0);
  const estimate = {totalBytes, perSchool, computedAt: new Date().toISOString()};
  await setShared(STORAGE_ESTIMATE_KEY, estimate);
  STORAGE_ESTIMATE = estimate;
  return estimate;
}
// Founder-only: permanently remove a school and every piece of data that
// belongs to it. This cannot be undone.
async function purgeSchool(schoolId){
  for(const suffix of SCHOOL_DATA_KEYS){
    await deleteShared(`sch_${schoolId}_${suffix}`);
  }
  await purgeScoreShards(schoolId);
  delete KNOWN_SCORE_SHARDS[schoolId];
  const snapIndex = await getShared(`sch_${schoolId}_autosnaps_index`, []);
  await Promise.all(snapIndex.map(s=>deleteShared(`sch_${schoolId}_autosnap_${s.ts}`)));
  await deleteShared(`sch_${schoolId}_autosnaps_index`);
  await removeSchoolFromUsernameIndex(schoolId);
  REGISTRY = REGISTRY.filter(x=>x.id!==schoolId);
  await saveRegistry();
}
/* ---- Global username -> school index ----
   Login used to fetch EVERY active school's accounts doc and scan them all
   for a match — one read per school, every single sign-in, getting slower
   as more schools joined the platform. This index is one small shared doc
   mapping each username (lowercased) to the list of {schoolId, role} pairs
   that currently use it, so login/recovery can jump straight to the one or
   two schools that could possibly match instead of reading all of them.
   It only narrows down *which* school to check next — the actual
   username+password match still happens against that school's own accounts
   doc, so no password ever needs to live in this index.
   Kept in sync every time a school's accounts array is written: call
   syncUsernameIndexForSchool(schoolId, accounts) right after that write. */
const USERNAME_INDEX_KEY = '_username_index';
async function loadUsernameIndex(){ return await getShared(USERNAME_INDEX_KEY, {}); }
async function syncUsernameIndexForSchool(schoolId, accounts){
  const idx = await loadUsernameIndex();
  // Drop every existing entry that pointed at this school first, then
  // re-add one per current account. Doing a full drop-and-rebuild (rather
  // than trying to diff old vs new) makes this correct no matter whether an
  // account was added, renamed, had its role changed, or removed.
  for(const key of Object.keys(idx)){
    idx[key] = (idx[key]||[]).filter(e=>e.schoolId!==schoolId);
    if(idx[key].length===0) delete idx[key];
  }
  (accounts||[]).forEach(a=>{
    if(!a.username || !a.role) return;
    const key = a.username.trim().toLowerCase();
    if(!key) return;
    if(!idx[key]) idx[key]=[];
    idx[key].push({schoolId, role:a.role});
  });
  await setShared(USERNAME_INDEX_KEY, idx);
}
// Founder-only: strip every entry for a school out of the index when the
// whole school is purged, so deleted schools can never surface as a login
// candidate again.
async function removeSchoolFromUsernameIndex(schoolId){
  const idx = await loadUsernameIndex();
  let changed=false;
  for(const key of Object.keys(idx)){
    const before = idx[key].length;
    idx[key] = idx[key].filter(e=>e.schoolId!==schoolId);
    if(idx[key].length!==before) changed=true;
    if(idx[key].length===0) delete idx[key];
  }
  if(changed) await setShared(USERNAME_INDEX_KEY, idx);
}
