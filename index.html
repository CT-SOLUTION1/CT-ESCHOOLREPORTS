    const level = opt ? opt.dataset.level : null;
    const isPrimary = level==='P';
    const wrap = document.getElementById('papersWrap');
    const input = document.getElementById('papersInput');
    if(wrap) wrap.style.display = isPrimary ? 'none' : 'block';
    if(input){
      input.required = !isPrimary;
      if(isPrimary) input.value = '1';
    }
    // Narrow the Subject (and, on "Assign Subjects to Teachers", Teacher) dropdowns to
    // match the newly selected class's level, instead of leaving every subject/teacher
    // from every level listed regardless of what's actually relevant here.
    if(level){
      const form = e.target.closest('form');
      const subjSel = form ? form.querySelector('#assignSubjectSel') : null;
      if(subjSel){
        const prevSubj = subjSel.value;
        const subs = subjectsForLevel(level);
        subjSel.innerHTML = subs.map(s=>`<option value="${s}">${s}</option>`).join('');
        if(subs.includes(prevSubj)) subjSel.value = prevSubj;
      }
      const teachSel = form ? form.querySelector('#assignTeacherSel') : null;
      if(teachSel){
        const prevTeacher = teachSel.value;
        const teachers = teachersForLevel(level);
        teachSel.innerHTML = teachers.map(t=>`<option value="${t.username}">${esc(t.name)}</option>`).join('') || '<option value="">-- no matching teacher yet --</option>';
        if(teachers.some(t=>t.username===prevTeacher)) teachSel.value = prevTeacher;
      }
    }
  }
  if(e.target.id==='bulkWordFile'){
    loadStudentListFromWord(e.target);
  }
  if(e.target.id==='kindSel'){
    const wrap = document.getElementById('labelWrap');
    if(wrap) wrap.style.display = e.target.value==='AOI' ? 'block':'none';
    // Compulsory field — never pre-filled or suggested, even from a named test's known
    // max. The teacher must type it in themselves every time before they can submit.
    const maxInput = document.getElementById('maxScoreInput');
    if(maxInput){ maxInput.readOnly = false; maxInput.value = ''; }
  }
  if(e.target.id==='cwTestSel'){
    // Same as above — switching which named test is selected does NOT pre-fill the
    // maximum-mark field; it stays empty and compulsory.
    const maxInput = document.getElementById('maxScoreInput');
    if(maxInput) maxInput.value = '';
  }
  if(e.target.name==='assignId'){
    const form = e.target.closest('form');
    const mine = CUR.role==='admin' ? DB.assignments : DB.assignments.filter(a=>a.teacherUsername===CUR.username);
    const a = mine.find(x=>x.id===e.target.value);
    const paperSel = form.querySelector('#paperSelect');
    if(a && paperSel){ paperSel.innerHTML = a.papers.map(p=>`<option value="${p}">Paper ${p}</option>`).join(''); }
    // Primary has no concept of papers (always a single implicit paper), so the Paper
    // field is hidden entirely on the score-entry form once a Primary class/subject
    // assignment is chosen — nothing for the teacher to pick.
    const assignedCls = a ? DB.classes.find(c=>c.id===a.classId) : null;
    const isPrimaryAssign = !!(assignedCls && assignedCls.level==='P');
    const paperFieldWrap = form.querySelector('#paperFieldWrap');
    if(paperFieldWrap) paperFieldWrap.style.display = isPrimaryAssign ? 'none' : 'block';
    // The chosen class may have its own custom assessment type (Settings → Grading
    // Setup → per-class override), so refresh the AOI/EOT labels, the Course Work
    // test picker, and the suggested max score to match THIS class the moment it's
    // picked — instead of leaving the school-wide defaults showing.
    refreshAssessmentTypeUI(form, a ? a.classId : null);
  }
  if(e.target.name==='role' && e.target.id==='roleSel'){
    document.getElementById('parentLinkWrap').style.display = e.target.value==='parent'?'block':'none';
    const trw = document.getElementById('teacherRecoveryWrap'); if(trw) trw.style.display = e.target.value==='teacher'?'block':'none';
  }
  // "Select all students" shortcut — only offered to teachers of compulsory subjects.
  // Ticking it checks every student box in the roster form at once; unticking it clears
  // them all. Optional-subject teachers never see this control and keep ticking one by one.
  if(e.target.dataset && e.target.dataset.selectAllStudents){
    const form = e.target.closest('form');
    if(form) form.querySelectorAll('input[name="students"]').forEach(cb=>{ cb.checked = e.target.checked; });
  }
  // Keep the "Select all" box in sync if the teacher ticks/unticks students individually.
  if(e.target.name==='students'){
    const form = e.target.closest('form');
    const selectAll = form && form.querySelector('[data-select-all-students]');
    if(selectAll){
      const boxes = form.querySelectorAll('input[name="students"]');
      selectAll.checked = boxes.length>0 && Array.from(boxes).every(cb=>cb.checked);
    }
  }
});

      VIEW={name:VIEW.name, params:{assignId:fd.get('assignId'), paper:fd.get('paper'), kind:fd.get('kind'), label:fd.get('label')||'', maxScore}}; render();
    }
    else if(type==='saveRoster'){
      const assignId = form.dataset.assign;
      const a = DB.assignments.find(x=>x.id===assignId);
      if(a){ a.studentIds = fd.getAll('students'); await saveAssignments(); }
      VIEW = {name:VIEW.name, params:{assignId, paper:form.dataset.paper, kind:form.dataset.kind, label:form.dataset.label||'', maxScore:Number(form.dataset.max)||100, editRoster:false}};
      render();
    }
    else if(type==='quickAddStudent'){
      const assignId = form.dataset.assign;
      const a = DB.assignments.find(x=>x.id===assignId);
      if(!a){ alert('Assignment not found.'); return; }
      const cls = DB.classes.find(c=>c.id===a.classId);
      if(!cls){ alert('Class not found.'); return; }
      const name = (fd.get('name')||'').trim(), admNo = (fd.get('admNo')||'').trim();
      if(!name || !admNo){ alert('Please fill in the student\'s name and admission number.'); return; }
      if(DB.students.some(s=>s.admNo===admNo)){ alert('That admission number is already used by another student.'); return; }
      // Registration only ever records bio-data — name, admission number, sex, class.
      // Subjects are never set here; ticking this student straight into the current
      // roster below is what makes them count as taking this subject.
      const newStudent = {id:uid('std'), name, admNo, classId:cls.id, photo:null, gender:fd.get('gender')||null, feesBalance:null, nextTermFees:null};
      DB.students.push(newStudent);
      a.studentIds = Array.isArray(a.studentIds) ? [...new Set([...a.studentIds, newStudent.id])] : [newStudent.id];
      await Promise.all([saveStudents(), saveAssignments()]);
      alert(`${name} was added to ${cls.name} and included in your marking list for ${a.subject}. Other subject teachers will need to tick them into their own lists too.`);
      VIEW = {name:VIEW.name, params:{assignId, paper:form.dataset.paper, kind:form.dataset.kind, label:form.dataset.label||'', maxScore:Number(form.dataset.max)||100, editRoster:true}};
      render();
    }
    else if(type==='uploadMarksheet'){
      const assignId = form.dataset.assign, paper=form.dataset.paper, subject=form.dataset.subject, kind=form.dataset.kind, label=form.dataset.label||'';
      const max = Math.max(1, Number(form.dataset.max)||100);
      const a = DB.assignments.find(x=>x.id===assignId);
      if(!a){ alert('Assignment not found.'); return; }
      // Same deadline rule as typing marks in directly (saveScores below) — without this
      // check a teacher could bypass a locked score deadline simply by using the CSV
      // upload form instead of the on-screen boxes, which defeats the whole point of
      // deadlines. Admins are still never blocked.
      if(CUR.role!=='admin' && teacherLockedByDeadline(CUR.username, kind)){
        alert(`The score submission deadline (${fmtDateTime(scoreDeadlineFor(kind).deadline)}) has passed, so this can't be imported. Ask your admin to reopen score entry for you if you need to submit or correct marks.`);
        return;
      }
      const file = fd.get('marksheetFile');
      if(!file || file.size===0){ alert('Please choose a CSV file first.'); return; }
      const text = await file.text();
      const lines = text.split(/\r?\n/).filter(l=>l.trim()!=='');
      if(!lines.length){ alert('That file appears to be empty.'); return; }
      const rosterIds = Array.isArray(a.studentIds) ? a.studentIds : DB.students.filter(s=>s.classId===a.classId).map(s=>s.id);
      const byAdmNo = new Map(DB.students.filter(s=>rosterIds.includes(s.id)).map(s=>[s.admNo, s]));
      let imported=0, skipped=0, outOfRange=0;
      const importRows = [];
      for(const line of lines){
        const parts = parseCsvLine(line);
        const admNo = (parts[0]||'').trim();
        if(!admNo || admNo.toLowerCase()==='admission no') continue; // header or blank line
        const marksRaw = parts.length>=3 ? parts[2] : parts[1];
        const st = byAdmNo.get(admNo);
        const marks = Number(marksRaw);
        if(!st || marksRaw===undefined || marksRaw==='' || !isFinite(marks)){ skipped++; continue; }
        // Same 0–max range rule as saveScores — a mark that's negative or above this
        // paper's maximum is rejected rather than silently saved, exactly like it would
        // be if typed straight into the on-screen mark sheet.
        if(marks<0 || marks>max){ outOfRange++; continue; }
        if(kind==='EOT'){
          const idx = DB.scores.findIndex(sc=>sc.studentId===st.id && sc.subject===subject && sc.paper==paper && sc.kind==='EOT' && sc.term===DB.info.currentTerm && sc.year===DB.info.currentYear);
          importRows.push({id: idx>=0?DB.scores[idx].id:uid('sc'), studentId:st.id, subject, paper, kind:'EOT', label:'', term:DB.info.currentTerm, year:DB.info.currentYear, marks, max, teacher:CUR.username});
        } else {
          const idx = DB.scores.findIndex(sc=>sc.studentId===st.id && sc.subject===subject && sc.paper==paper && sc.kind==='AOI' && sc.label===label && sc.term===DB.info.currentTerm && sc.year===DB.info.currentYear);
          importRows.push({id: idx>=0?DB.scores[idx].id:uid('sc'), studentId:st.id, subject, paper, kind:'AOI', label, term:DB.info.currentTerm, year:DB.info.currentYear, marks, max, teacher:CUR.username});
        }
        imported++;
      }
      await upsertScores(importRows); form.reset();
      const skipMsgParts = [];
      if(skipped) skipMsgParts.push(`${skipped} row(s) skipped (blank marks or admission number not on your list)`);
      if(outOfRange) skipMsgParts.push(`${outOfRange} row(s) rejected (mark outside 0–${max})`);
      alert(`Mark sheet imported: ${imported} score(s) saved${skipMsgParts.length?`, ${skipMsgParts.join(', ')}`:''}.`);
      render();
    }
    else if(type==='saveScores'){
      const assignId=form.dataset.assign, paper=form.dataset.paper, subject=form.dataset.subject, kind=form.dataset.kind, label=form.dataset.label;
      if(CUR.role!=='admin' && teacherLockedByDeadline(CUR.username, kind)){
        alert(`The score submission deadline (${fmtDateTime(scoreDeadlineFor(kind).deadline)}) has passed, so this can't be saved. Ask your admin to reopen score entry for you if you need to submit or correct marks.`);
        return;
      }
      const max = Math.max(1, Number(form.dataset.max)||100);
      // Validate every filled-in box before saving anything. Blank boxes (absent/
      // missing students) are fine and simply skipped below — but a mark that's
      // negative, not a number, or above the paper's maximum blocks the whole
      // submission so it can't slip through.
      const badEntries = [];
      for(const [key,val] of fd.entries()){
        if(!key.startsWith('m_')) continue;
        if(val==='') continue; // left blank on purpose — skip, don't validate
        const num = Number(val);
        if(!isFinite(num) || num<0 || num>max){
          const input = form.querySelector(`[name="${CSS.escape(key)}"]`);
          badEntries.push((input && input.dataset.student) || key);
        }
      }
      if(badEntries.length){
        alert(`Can't save: the mark for ${badEntries.join(', ')} is out of range. Marks must be between 0 and ${max}. Please fix ${badEntries.length>1?'these':'this'} before submitting — other students' marks were not affected.`);
        return;
      }
      // Figure out who was left blank on THIS submit and still has no saved score for
      // this column — that's who gets flagged with an X on the mark sheet right after
      // this submit goes through.
      const missKeyNow = missingMarkersKey(assignId, paper, kind, label||'');
      const missSetNow = new Set();
      for(const [key,val] of fd.entries()){
        if(!key.startsWith('m_')) continue;
        if(val!=='') continue;
        const studentId = key.slice(2);
        let existingRow;
        if(kind==='EOT'){
          existingRow = DB.scores.find(sc=>sc.studentId===studentId && sc.subject===subject && sc.paper==paper && sc.kind==='EOT' && sc.term===DB.info.currentTerm && sc.year===DB.info.currentYear);
        } else {
          existingRow = DB.scores.find(sc=>sc.studentId===studentId && sc.subject===subject && sc.paper==paper && sc.kind==='AOI' && sc.label===label && sc.term===DB.info.currentTerm && sc.year===DB.info.currentYear);
        }
        if(!existingRow) missSetNow.add(studentId);
      }
      MISSING_MARKERS[missKeyNow] = missSetNow;
      // If this column is a subsidiary (Maths or Computer), any student who's been
      // ticked into BOTH subsidiary rosters by mistake (see hasSubsidiaryConflict) has
      // no single correct subject to save their mark under — nothing is auto-picked for
      // them (see studentSubjects). Rather than silently saving it somewhere that then
      // never shows on the report card, that one student's mark is left out of this
      // submit entirely and the teacher is warned by name, while everyone else's marks
      // save and reach the report card completely normally.
      const a = DB.assignments.find(x=>x.id===assignId);
      const cls = a ? DB.classes.find(c=>c.id===a.classId) : null;
      const conflictExcluded = [];
      const submitRows = [];
      for(const [key,val] of fd.entries()){
        if(!key.startsWith('m_')) continue;
        if(val==='') continue; // absent/missing — leave this student's record untouched
        const studentId = key.slice(2);
        if(SUBSIDIARIES.includes(subject) && cls){
          const st = DB.students.find(x=>x.id===studentId);
          if(st && hasSubsidiaryConflict(st, cls)){
            conflictExcluded.push(st.name);
            continue; // left out — see warning below, not saved this submit
          }
        }
        if(kind==='EOT'){
          const idx = DB.scores.findIndex(sc=>sc.studentId===studentId && sc.subject===subject && sc.paper==paper && sc.kind==='EOT' && sc.term===DB.info.currentTerm && sc.year===DB.info.currentYear);
          submitRows.push({id: idx>=0?DB.scores[idx].id:uid('sc'), studentId, subject, paper, kind:'EOT', label:'', term:DB.info.currentTerm, year:DB.info.currentYear, marks:Number(val), max, teacher:CUR.username});
        } else {
          const idx = DB.scores.findIndex(sc=>sc.studentId===studentId && sc.subject===subject && sc.paper==paper && sc.kind==='AOI' && sc.label===label && sc.term===DB.info.currentTerm && sc.year===DB.info.currentYear);
          submitRows.push({id: idx>=0?DB.scores[idx].id:uid('sc'), studentId, subject, paper, kind:'AOI', label, term:DB.info.currentTerm, year:DB.info.currentYear, marks:Number(val), max, teacher:CUR.username});
        }
      }
      if(conflictExcluded.length){
        const names = conflictExcluded.join(', ');
        const plural = conflictExcluded.length>1;
        alert(`⚠ ${names} ${plural?'are':'is'} ticked into BOTH Subsidiary Mathematics and Subsidiary Computer rosters, so ${plural?'their':'their'} mark${plural?'s':''} for ${subject} ${plural?'were':'was'} NOT saved this submit. Remove ${plural?'them':'them'} from whichever roster is wrong, then resubmit ${plural?'their':'their'} mark${plural?'s':''}. Everyone else's marks below were saved normally.`);
      }
      // upsertScores updates DB.scores synchronously before its network write
      // even starts, so the mark sheet can be re-rendered — showing this
      // teacher's own marks as saved — immediately, with no wait, no matter
      // how many other teachers are submitting marks at the same moment.
      // The write is then persisted safely in the background via an atomic
      // transaction (see mergeScoreShard) that's guaranteed not to lose this
      // teacher's marks even if others save to the same term at the exact
      // same instant; we only need to speak up if it ultimately fails.
      const syncKey = scoreSyncKey(assignId, paper, kind, label||'');
      SCORE_SYNC_STATUS[syncKey] = {state:'saving'};
      const saveScoresPromise = upsertScores(submitRows);
      render();
      // Patch the status line directly rather than triggering a second full
      // render() once the background save confirms/fails — a full render()
      // here could yank focus away from a box the teacher has since moved on
      // to editing.
      saveScoresPromise.then(()=>{
        SCORE_SYNC_STATUS[syncKey] = {state:'saved', at:Date.now()};
        const el = document.getElementById(`syncStatus_${syncKey}`);
        if(el) el.outerHTML = syncStatusBanner(syncKey);
      }).catch(err=>{
        console.error(err);
        SCORE_SYNC_STATUS[syncKey] = {state:'error'};
        const el = document.getElementById(`syncStatus_${syncKey}`);
        if(el) el.outerHTML = syncStatusBanner(syncKey);
        alert('Some scores could not be saved — check your internet connection and try submitting again.');
      });
    }
  }catch(err){ console.error(err); alert('Something went wrong. Please try again.'); }
});

/* ---------- Lazy-loaded libraries ----------
   jsPDF, html2canvas (PDF export) and mammoth (.docx class-list import) are
   fairly heavy (~700KB combined) and only needed by a handful of admin
   actions. Rather than blocking every single page load — including the
   login screen, which every visitor sees whether or not they ever export a
   PDF — they're fetched on first use and cached, so most sessions never pay
   for them at all. */
const _libPromises = {};
function loadScriptOnce(key, src){
  if(_libPromises[key]) return _libPromises[key];
  _libPromises[key] = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => { delete _libPromises[key]; reject(new Error('A required file failed to load — check your internet connection and try again.')); };
    document.head.appendChild(s);
  });
  return _libPromises[key];
}
function loadPdfLibs(){
  if(window.jspdf && window.html2canvas) return Promise.resolve();
  return Promise.all([
    loadScriptOnce('jspdf', 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'),
    loadScriptOnce('html2canvas', 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js')
  ]);
}
// Delivers a finished jsPDF document to the user, on phone and computer, with a
// single tap.
//
// This used to call window.open(url,'_blank') so the PDF would appear in a new
// tab. That works fine for a *quick* export, but report card PDFs (especially a
// whole-class bulk export) can take several seconds to render — one html2canvas
// pass per student — and by the time we get here the browser's "this came from a
// direct tap" permission has usually expired. Most mobile browsers then silently
// block window.open() (it can return neither an error nor a usable window), so
// the download just... didn't happen, with no indication why.
//
// A real <a download> element clicked programmatically is NOT treated as a
// popup by any current browser — there's no fresh-gesture requirement — so it
// reliably fires even after long async work. target="_blank" is kept so that on
// desktop / Android it still opens as a normal new-tab preview when the browser
// chooses to display rather than download it; on iOS Safari it opens the PDF in
// a new tab where Share ▸ Save to Files works. Either way, one tap is all it
// takes, and we surface our own confirmation via the toast instead of relying on
// "did a new tab visibly appear" as the signal.
function openOrSavePdf(pdf, filename){
  try{
    const blob = pdf.output('blob');
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.target = '_blank';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
    showDeliveredToast(`Ready — ${filename}`);
  }catch(e){
    try{ pdf.save(filename); showDeliveredToast(`Ready — ${filename}`); }
    catch(e2){ alert('Could not create the PDF file: ' + (e2.message||e2)); }
  }
}
function loadMammothLib(){
  if(window.mammoth) return Promise.resolve();
  return loadScriptOnce('mammoth', 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
}
// Quietly fetches the PDF/Word libraries a couple of seconds after the app has
// finished its first render, so that by the time an admin actually clicks
// "PDF" or imports a .docx class list, the library is often already cached —
// no wait, no reliance on the connection being up at that exact click. This
// runs in the background and never surfaces an error: it's a speculative
// optimization the user didn't ask for, so a failure here (e.g. offline)
// should be invisible — the libraries simply get fetched for real, with a
// visible error if needed, the first time they're actually used.
function preloadHeavyLibsWhenIdle(){
  const start = () => {
    loadPdfLibs().catch(()=>{});
    loadMammothLib().catch(()=>{});
  };
  if('requestIdleCallback' in window) requestIdleCallback(start, {timeout:4000});
  else setTimeout(start, 2500);
}

/* ---------- Generic HTML-to-PDF export (mark sheets & performance analysis) ---------- */
// Forces the browser's native Print dialog (window.print()) into landscape for this one
// print job, regardless of what the rest of the app prints as (report cards etc. stay
// portrait). Works by temporarily injecting a stylesheet that overrides @page's size —
// the only way to control print orientation from CSS — then removing it again afterward
// so it doesn't leak into any later print of a different (portrait) page.
function printLandscape(){
  const st = document.createElement('style');
  st.id = 'landscapePrintOverride';
  st.textContent = '@page{ size: A4 landscape; margin:10mm; }';
  document.head.appendChild(st);
  window.print();
  setTimeout(()=>{ const e=document.getElementById('landscapePrintOverride'); if(e) e.remove(); }, 1000);
}
async function downloadElementAsPdf(elementId, filename, opts={}){
  const el = document.getElementById(elementId);
  if(!el){ alert('Nothing to export yet.'); return; }
  try{ await loadPdfLibs(); }catch(e){ alert(e.message); return; }
  const { jsPDF } = window.jspdf;

  // Master Mark Sheet / Class Analysis / Integrated Mark Sheet all wrap their table in a
  // .card with overflow:auto so it can be scrolled sideways on screen when it's wider
  // than the page. html2canvas only paints what's actually visible inside a scrollable
  // box though — it doesn't "unroll" the hidden, scrolled-off part — so without this,
  // every column past the visible edge was silently missing from the downloaded PDF.
  // Lifting overflow to visible (and clearing any width cap) on every such container
  // inside the export area lets the FULL table lay out before capture; everything is
  // put back exactly as it was immediately afterward either way.
  const restore = [];
  el.querySelectorAll('*').forEach(node=>{
    const cs = getComputedStyle(node);
    if(cs.overflowX==='auto' || cs.overflowX==='scroll' || cs.overflowY==='auto' || cs.overflowY==='scroll'){
      restore.push({node, overflow:node.style.overflow, overflowX:node.style.overflowX, overflowY:node.style.overflowY, maxWidth:node.style.maxWidth});
      node.style.overflow = 'visible'; node.style.maxWidth = 'none';
    }
  });

  const orientation = opts.orientation || 'landscape';
  const pdf = new jsPDF(orientation==='landscape'?'l':'p','pt','a4');
  const pageW = pdf.internal.pageSize.getWidth();
  const pageH = pdf.internal.pageSize.getHeight();

  // Mobile browsers — iOS Safari in particular — cap how large a single
  // <canvas> is allowed to be. Past that cap the browser doesn't throw an
  // error, it silently blanks out or truncates part of the image instead —
  // which is exactly what shows up as missing columns/rows in a downloaded
  // Master Mark Sheet on a phone, since a class with many subjects can lay
  // out to several thousand pixels wide. Rather than always capturing at a
  // fixed scale and hoping it fits, measure the element first and pick the
  // largest scale (up to the normal 2x) that keeps the resulting canvas
  // safely under every major mobile browser's limit. Ordinary sheets are
  // unaffected — this only backs off scale for genuinely large ones, and
  // even then the multi-page tiling below still lays every column/row out
  // legibly across as many pages as needed; nothing is dropped either way.
  //
  // FIX: the total-AREA budget above (MAX_CANVAS_PIXELS) isn't the only limit
  // that matters — browsers also cap the SINGLE LONGEST SIDE a canvas can be,
  // independent of area, and the old floor never let captureScale drop below
  // 1x. So a sheet whose natural, un-scaled width alone (many subjects x
  // multiple papers each) already exceeds that per-side cap was captured
  // truncated on the right no matter what, even though the area check passed.
  // That's the actual cause of subject columns silently vanishing on phones.
  // Now we also enforce a conservative per-side cap and allow captureScale to
  // go below 1x when needed to satisfy it — the sheet's final printed size on
  // the page is governed separately below (by `scale`, with its own floor),
  // so a lower capture resolution here only costs a little sharpness on
  // pathologically wide sheets, never a missing column.
  const MAX_CANVAS_PIXELS = 16 * 1024 * 1024; // ~16 megapixels — total-area budget
  const MAX_CANVAS_SIDE = 4000; // conservative per-side cap, safe across mobile browsers
  const naturalW = Math.max(el.scrollWidth, el.offsetWidth) || 1;
  const naturalH = Math.max(el.scrollHeight, el.offsetHeight) || 1;
  let captureScale = 2;
  while(captureScale > 0.1 && (
    naturalW*captureScale*naturalH*captureScale > MAX_CANVAS_PIXELS ||
    naturalW*captureScale > MAX_CANVAS_SIDE ||
    naturalH*captureScale > MAX_CANVAS_SIDE
  )){
    captureScale -= 0.1;
  }
  captureScale = Math.max(0.1, captureScale);

  let canvas;
  try{
    canvas = await html2canvas(el, {scale:captureScale, backgroundColor:'#ffffff', scrollX:0, scrollY:-window.scrollY});
  } finally {
    restore.forEach(r=>{ r.node.style.overflow=r.overflow; r.node.style.overflowX=r.overflowX; r.node.style.overflowY=r.overflowY; r.node.style.maxWidth=r.maxWidth; });
  }

  // Shrinking a very wide sheet down to a single page's width can make the text too
  // small to read once printed (a class with many subjects can easily need 2000px+ of
  // columns). Rather than either cutting content or shrinking it into illegibility,
  // cap how far it's shrunk and tile the sheet across as many pages left-to-right (and
  // top-to-bottom) as needed at that legible size — every column still ends up in the
  // PDF, it just spans more pages for very wide classes.
  const MIN_SCALE = 0.55;
  const naturalScale = pageW / canvas.width;
  const scale = Math.max(naturalScale, MIN_SCALE);
  const pxPerPageW = pageW / scale, pxPerPageH = pageH / scale;
  const cols = Math.max(1, Math.ceil(canvas.width / pxPerPageW));
  const rows = Math.max(1, Math.ceil(canvas.height / pxPerPageH));
  const multiPage = cols>1 || rows>1;

  let first = true;
  for(let r=0; r<rows; r++){
    for(let c=0; c<cols; c++){
      const sx = Math.floor(c*pxPerPageW), sy = Math.floor(r*pxPerPageH);
      const sw = Math.min(Math.ceil(pxPerPageW), canvas.width-sx);
      const sh = Math.min(Math.ceil(pxPerPageH), canvas.height-sy);
      if(sw<=0 || sh<=0) continue;
      const tile = document.createElement('canvas');
      tile.width = sw; tile.height = sh;
      tile.getContext('2d').drawImage(canvas, sx, sy, sw, sh, 0, 0, sw, sh);
      const img = tile.toDataURL('image/jpeg',0.95);
      if(!first) pdf.addPage();
      first = false;
      pdf.addImage(img,'JPEG',0,0, sw*scale, sh*scale);
      if(multiPage){
        pdf.setFontSize(7); pdf.setTextColor(150);
        pdf.text(`sheet section — row ${r+1}/${rows}, column ${c+1}/${cols}`, 6, pageH-4);
      }
    }
  }
  openOrSavePdf(pdf, filename);
}
/* ---------- Generic table-based PDF export core ----------
   Renders one or more table "sections" into a PDF where every column always fits the
   page width (never tiled/split sideways) and pages break only between whole rows —
   a learner's row is never cut in half — repeating the header row(s) on every page a
   section spans. This replaces the old canvas-tiling export for every sheet that's
   fundamentally "one row per learner, several columns": Class Analysis, the
   Integrated Mark Sheet, and the Master Mark Sheet all share this now, instead of
   each having its own bespoke, tiling-prone export.
   sections: [{ title, subtitle, headRows:[<tr> elements], bodyRows:[<tr> elements],
                footerHtml (optional, raw HTML shown after the LAST chunk of this
                section), emptyText (optional, shown if bodyRows is empty) }]
   opts: { orientation: 'landscape'|'portrait' (default landscape) } ---------- */
async function renderTableSectionsAsPdf(sections, filename, opts={}){
  setAppBusy(true); // guards this long-running export against an auto-update reload
  try{
  try{ await loadPdfLibs(); }catch(e){ alert(e.message); return; }
  const { jsPDF } = window.jspdf;
  const orientation = opts.orientation || 'landscape';
  const pdf = new jsPDF(orientation==='portrait'?'p':'l', 'pt', 'a4');
  const pageW = pdf.internal.pageSize.getWidth();
  const pageH = pdf.internal.pageSize.getHeight();
  const margin = 20;
  const usableW = pageW - margin*2;
  const usableH = pageH - margin*2;

  const holder = document.createElement('div');
  holder.style.position='fixed'; holder.style.left='-9999px'; holder.style.top='0';
  holder.style.background='#fff';
  document.body.appendChild(holder);

  const captureScale = 2;
  let firstPageOverall = true;

  for(const section of sections){
    const headRows = section.headRows.filter(Boolean);
    const bodyRows = section.bodyRows;

    // Measure this table at its natural (unscaled) size so we know the real width to
    // fit to the page, and the real height of the header block and each body row —
    // row-chunking below is based on actual rendered sizes, not guesses. A real
    // <thead> is used (not just a first <tr>) so multi-row headers — e.g. the Master
    // Mark Sheet's paper-number sub-header under each subject — measure and repeat
    // correctly as a whole unit.
    const measureTable = document.createElement('table');
    measureTable.className = 'data-table';
    const measureThead = document.createElement('thead');
    headRows.forEach(r=>measureThead.appendChild(r.cloneNode(true)));
    measureTable.appendChild(measureThead);
    const measureTbody = document.createElement('tbody');
    bodyRows.forEach(r=>measureTbody.appendChild(r.cloneNode(true)));
    measureTable.appendChild(measureTbody);
    holder.innerHTML = '';
    holder.appendChild(measureTable);
    const tableW = measureTable.scrollWidth || measureTable.offsetWidth || 1;
    const headerH = measureThead.offsetHeight || 0;
    const bodyTrs = [...measureTbody.rows];
    const rowHeights = bodyRows.map((_,i)=> bodyTrs[i] ? bodyTrs[i].offsetHeight : 22);

    // The scale that will map this table's full natural width onto the full usable
    // page width — every column always fits, since nothing is ever tiled sideways.
    const scale = usableW / tableW;
    const titleAllowancePx = (section.title || section.subtitle) ? 44 : 6;
    const footerAllowancePx = section.footerHtml ? 30 : 0;
    const maxBodyHeightPx = Math.max(headerH, (usableH/scale) - headerH - titleAllowancePx - footerAllowancePx);

    // Group body rows into page-sized chunks without ever splitting a row across two
    // chunks/pages.
    const chunks = [];
    let cur = [], curH = 0;
    rowHeights.forEach((h, i)=>{
      if(cur.length && curH + h > maxBodyHeightPx){ chunks.push(cur); cur = []; curH = 0; }
      cur.push(bodyRows[i]); curH += h;
    });
    chunks.push(cur); // always at least one chunk, even if empty (shows header only)

    for(let ci=0; ci<chunks.length; ci++){
      const pageTable = document.createElement('table');
      pageTable.className = 'data-table';
      pageTable.style.width = tableW+'px';
      const thead = document.createElement('thead');
      headRows.forEach(r=>thead.appendChild(r.cloneNode(true)));
      pageTable.appendChild(thead);
      const tbody = document.createElement('tbody');
      if(chunks[ci].length){
        chunks[ci].forEach(r=>tbody.appendChild(r.cloneNode(true)));
      } else if(section.emptyText){
        tbody.innerHTML = `<tr><td>${esc(section.emptyText)}</td></tr>`;
      }
      pageTable.appendChild(tbody);

      const pageWrap = document.createElement('div');
      pageWrap.style.width = tableW+'px';
      pageWrap.style.padding = '10px';
      pageWrap.style.fontFamily = 'Inter,sans-serif';
      pageWrap.style.background = '#fff';
      let headHtml = '';
      if(ci===0){
        if(section.title) headHtml += `<h3 style="margin:0 0 4px;">${esc(section.title)}</h3>`;
        if(section.subtitle) headHtml += `<p style="margin:0 0 10px;font-size:12px;color:#5A7189;">${esc(section.subtitle)}</p>`;
      } else if(section.title){
        headHtml += `<h3 style="margin:0 0 10px;">${esc(section.title)} (continued)</h3>`;
      }
      pageWrap.innerHTML = headHtml;
      pageWrap.appendChild(pageTable);
      if(section.footerHtml && ci===chunks.length-1){
        const foot = document.createElement('div');
        foot.style.marginTop = '8px';
        foot.innerHTML = section.footerHtml;
        pageWrap.appendChild(foot);
      }

      holder.innerHTML = '';
      holder.appendChild(pageWrap);

      const canvas = await html2canvas(pageWrap, {scale:captureScale, backgroundColor:'#ffffff'});
      const img = canvas.toDataURL('image/jpeg', 0.95);
      const w = usableW;
      const h = Math.min(canvas.height*usableW/canvas.width, usableH);
      if(!firstPageOverall) pdf.addPage();
      firstPageOverall = false;
      pdf.addImage(img, 'JPEG', margin, margin, w, h);
    }
  }

  document.body.removeChild(holder);
  openOrSavePdf(pdf, filename);
  } finally { setAppBusy(false); }
}
/* ---------- Class Analysis / Integrated Mark Sheet export: auto-detects each .card's
   table inside the export area and turns it into one section (see
   renderTableSectionsAsPdf above for the actual pagination logic). opts.title/
   opts.subtitle are used as a fallback caption for any table whose card has no its
   own <h3>/<p class="small"> (e.g. the Integrated Mark Sheet). ---------- */
async function downloadTablesAsPdf(elementId, filename, opts={}){
  const el = document.getElementById(elementId);
  if(!el){ alert('Nothing to export yet.'); return; }
  const sections = [...el.querySelectorAll('.card')].map(card=>{
    const table = card.querySelector('table');
    if(!table) return null;
    const titleEl = card.querySelector('h3');
    const descEl = card.querySelector('p.small');
    const thead = table.querySelector('thead');
    const headRows = thead ? [...thead.querySelectorAll('tr')] : [table.querySelector('tr')].filter(Boolean);
    const bodyRows = thead ? [...table.querySelectorAll('tbody tr')] : [...table.querySelectorAll('tr')].slice(1);
    return {
      title: (titleEl && titleEl.textContent) || opts.title || '',
      subtitle: (descEl && descEl.textContent) || opts.subtitle || '',
      headRows, bodyRows
    };
  }).filter(Boolean);
  if(!sections.length){ alert('Nothing to export yet.'); return; }
  await renderTableSectionsAsPdf(sections, filename, opts);
}
/* ---------- Master Mark Sheet export: its table isn't wrapped in a .card (it uses
   its own .mm-page/.mm-tablewrap layout) and its header spans TWO <tr> rows in
   "Real Scores" mode (subject name, then a sub-row of paper numbers underneath) — so
   it's pulled out as its own small adapter rather than trying to force it through the
   .card auto-detection above. The grading-scale legend and the generated-date/head-
   teacher footer are carried over as a footer shown under the table on its last
   page. ---------- */
async function downloadMasterMarkSheetPdf(elementId, filename){
  const el = document.getElementById(elementId);
  if(!el){ alert('Nothing to export yet.'); return; }
  const table = el.querySelector('table.mm-table') || el.querySelector('table');
  if(!table){ alert('Nothing to export yet.'); return; }
  const thead = table.querySelector('thead');
  const headRows = thead ? [...thead.querySelectorAll('tr')] : [table.querySelector('tr')].filter(Boolean);
  const bodyRows = [...table.querySelectorAll('tbody tr')];
  const schoolEl = el.querySelector('.mm-school');
  const titleEl = el.querySelector('.mm-title');
  const metaEl = el.querySelector('.mm-meta');
  const legendEl = el.querySelector('p.small');
  const footerEl = el.querySelector('.mm-footer');
  let footerHtml = '';
  if(legendEl) footerHtml += `<p style="font-size:10px;color:#5A7189;margin:0 0 4px;">${esc(legendEl.textContent)}</p>`;
  if(footerEl) footerHtml += `<p style="font-size:9px;color:#8a97a6;margin:0;">${esc(footerEl.textContent)}</p>`;
  await renderTableSectionsAsPdf([{
    title: [schoolEl&&schoolEl.textContent, titleEl&&titleEl.textContent].filter(Boolean).join(' — '),
    subtitle: metaEl ? metaEl.textContent : '',
    headRows, bodyRows, footerHtml,
    emptyText: 'No students in this class yet.'
  }], filename);
}
// Blank mark sheet, for printing/marking on paper (separate from the CSV version,
// which is a data-interchange file meant to be filled in and re-uploaded).
async function downloadMarksheetPDF(assignId, paper, kind, label, max){
  const a = DB.assignments.find(x=>x.id===assignId);
  if(!a){ alert('Assignment not found.'); return; }
  const cls = DB.classes.find(c=>c.id===a.classId);
  const students = sortByName(Array.isArray(a.studentIds)
    ? DB.students.filter(s=>a.studentIds.includes(s.id))
    : DB.students.filter(s=>s.classId===a.classId && studentSubjects(s,cls).includes(a.subject)));
  if(!students.length){ alert('No students on your list yet — select your students first.'); return; }
  const kindLbl = kind==='EOT' ? 'End of Term' : ('AOI'+(label?': '+label:''));
  // Built as real <tr> elements (not just an HTML string) so this can go through the
  // same row-paginating export core as the other mark sheets — previously this was
  // rendered as ONE tall, un-paginated image, so a large class simply ran off the
  // bottom of the single portrait page it was squeezed onto.
  const headRow = document.createElement('tr');
  headRow.innerHTML = ['Admission No','Name','Marks'].map(h=>`<th>${esc(h)}</th>`).join('');
  const bodyRows = students.map(s=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${esc(s.admNo)}</td><td style="text-align:left;">${esc(s.name)}</td><td style="height:22px;"></td>`;
    return tr;
  });
  const kindFile = kind==='EOT' ? 'EndOfTerm' : ('AOI_'+(label||'test')).replace(/\s+/g,'_');
  await renderTableSectionsAsPdf([{
    title: `${DB.info.schoolName||''}`,
    subtitle: `${cls?cls.name:''} — ${a.subject} — Paper ${paper} — ${kindLbl} — marked out of ${max}`,
    headRows: [headRow], bodyRows
  }], `${(cls?cls.name:'class').replace(/\s+/g,'_')}_${a.subject.replace(/\s+/g,'_')}_P${paper}_${kindFile}_marksheet.pdf`, {orientation:'portrait'});
}

/* ---------- Bulk PDF ---------- */
async function pdfForStudents(students, filename, opts={}){
  if(!students.length){ alert('No students to export.'); return; }
  setAppBusy(true); // guards this (potentially long, 100+ student) export against an auto-update reload
  try{
  try{ await loadPdfLibs(); }catch(e){ alert(e.message); return; }
  const { jsPDF } = window.jspdf;
  // compress:true turns on jsPDF's internal stream (Flate) compression for the
  // PDF's own text/vector overhead — free file-size savings, zero effect on the
  // embedded card image, safe to leave on for every export.
  const pdf = new jsPDF({orientation:'p', unit:'pt', format:'a4', compress:true});
  const pageW = pdf.internal.pageSize.getWidth();
  const pageH = pdf.internal.pageSize.getHeight();
  const holder = document.createElement('div');
  holder.style.position='fixed'; holder.style.left='-9999px'; holder.style.width='780px'; holder.style.background='#fff';
  document.body.appendChild(holder);
  // Render RESOLUTION (the scale factor) is what determines print sharpness.
  // Both single and bulk render at scale 3 and encode to JPEG — identical
  // resolution and print sharpness either way. Quality is now 0.95 for BOTH
  // paths too (bulk used to sit at 0.8, which visibly dulled colours and
  // softened table borders/text compared to a single download — the same
  // report card shouldn't look worse just because it was exported alongside
  // classmates). This only affects the JPEG *encoding* step, not the
  // in-memory canvas itself, so it doesn't reopen the old PNG memory problem —
  // each page still just comes out a little larger/crisper, not heavier to render.
  const scale = 3;
  const format = 'JPEG';
  const jpegQuality = 0.95;
  for(let i=0;i<students.length;i++){
    // html2canvas has a long-standing, well-documented bug (the CSS spec itself calls
    // border-collapse:collapse + rowspan/colspan "undefined" behaviour) where a merged
    // (rowspan) cell painted across rows of slightly different height comes out with its
    // text doubled/smeared — most visible on multi-paper subjects like Mathematics, whose
    // Final Average/Grade/Points/Descriptor cells span two paper rows. Switching those
    // tables to border-collapse:separate for this capture-only copy of the card sidesteps
    // the bug entirely (each cell's borders and text are then painted independently
    // instead of being merged/shared across the rowspan boundary) — the live on-screen
    // card and the browser Print dialog still use the normal collapsed borders, so this
    // override is scoped to just the offscreen holder html2canvas actually screenshots.
    holder.innerHTML = `<style>#pdfCaptureHolder table.rc-perf, #pdfCaptureHolder table.rc-info-table{border-collapse:separate;border-spacing:0;}</style>`+
      `<div id="pdfCaptureHolder" style="padding:14px;font-family:Inter,sans-serif;">${reportCardHTML(students[i].id, true)}</div>`;
    // NOTE: we deliberately do NOT call fitOnePage() here. fitOnePage scales the
    // card with a CSS transform, and a transform never changes an element's
    // layout box — only how it's painted. html2canvas captures the *layout* box,
    // so a card grown by transform (few-subject classes) painted past its own
    // box was getting silently clipped at the bottom, which is exactly why
    // headers/footers were being cut off in generated PDFs. Instead we capture
    // every card at its natural, un-transformed size and fit the resulting image
    // onto the page mathematically below — that can never crop anything, no
    // matter how long or short the card is.
    let canvas = await html2canvas(holder, {scale, backgroundColor:'#ffffff', letterRendering:true});
    let img = canvas.toDataURL('image/jpeg', jpegQuality);
    // Fit the whole, uncropped card onto one A4 page — and make sure it actually
    // fills that page, in both directions, rather than landing at natural size
    // and leaving the rest blank:
    //  - If the card is TALLER than one page at full width, shrink it (preserving
    //    its own aspect ratio, letterboxed/centered) so nothing is ever cropped
    //    or pushed onto a second page.
    //  - If the card is SHORTER than one page at full width (a light card — few
    //    subjects, common on Primary), stretch it to fill the remaining height
    //    too. Every pixel of the original, uncropped card is still fully there;
    //    it's just spread out a little further down the page instead of leaving
    //    blank space beneath it.
    let w = pageW, h = canvas.height*pageW/canvas.width, x = 0, y = 0;
    if(h > pageH){
      h = pageH;
      w = canvas.width*pageH/canvas.height;
      x = (pageW-w)/2;
    } else {
      w = pageW; h = pageH; x = 0; y = 0;
    }
    if(i>0) pdf.addPage();
    pdf.addImage(img,format,x,y,w,h);
    // Drop every reference to this student's rendered canvas/markup before
    // starting the next one, and yield a tick so the browser can actually run
    // garbage collection and repaint — without this, a long bulk run never gets
    // a chance to reclaim memory between students and visibly stalls.
    canvas.width = 0; canvas.height = 0; canvas = null; img = null;
    holder.innerHTML = '';
    if(opts.onProgress) opts.onProgress(i+1, students.length);
    await new Promise(r=>setTimeout(r, 0));
  }
  document.body.removeChild(holder);
  openOrSavePdf(pdf, filename);
  } finally { setAppBusy(false); }
}
// Classes at 100+ students used to come out as a single PDF holding 100+
// full-page images, assembled in one shot at the very end — that final
// assembly step is itself a heavy, memory-hungry operation on top of everything
// already rendered, and is the likely reason very large classes were still
// struggling even after the per-student fixes above. Past this size we instead
// split the export into several smaller PDFs ("part 1 of 3", etc.), each
// generated and downloaded in full before the next one starts — so nothing
// ever has to hold more than one batch's worth of pages in memory at a time.
// Bulk pages now render at scale 3 (matching single-card resolution) instead
// of scale 2, which is ~2.25x the raster memory per page. The batch size is
// trimmed accordingly so peak memory per batch stays roughly where it was
// before, even though each page is now sharper.
const BULK_BATCH_SIZE = 25;
async function bulkPdf(classId, onProgress){
  await refreshScores(); // make sure every teacher's latest marks are in this export
  const students = DB.students.filter(s=>!classId || s.classId===classId);
  const baseName = `${(DB.info.schoolName||'school').replace(/\s+/g,'_')}_reports`;
  if(students.length <= BULK_BATCH_SIZE){
    await pdfForStudents(students, `${baseName}.pdf`, {onProgress});
    return;
  }
  const batches = [];
  for(let i=0;i<students.length;i+=BULK_BATCH_SIZE) batches.push(students.slice(i,i+BULK_BATCH_SIZE));
  for(let b=0;b<batches.length;b++){
    await pdfForStudents(batches[b], `${baseName}_part${b+1}of${batches.length}.pdf`, {
      onProgress: onProgress ? (done,total)=>onProgress(b*BULK_BATCH_SIZE+done, students.length, b+1, batches.length) : null
    });
    // Small pause between files so each download has landed (and its memory
    // released) before the next batch's rendering starts.
    if(b<batches.length-1) await new Promise(r=>setTimeout(r, 400));
  }
}
async function singleStudentPdf(studentId){
  await refreshScores();
  const s = DB.students.find(x=>x.id===studentId);
  if(!s){ alert('Student not found.'); return; }
  await pdfForStudents([s], `${(s.name||'student').replace(/[^a-z0-9]+/gi,'_')}_report.pdf`);
}

/* ---------- Error visibility ----------
   Only the founder is told WHY a database call failed (quota exhausted,
   permission denied — which usually means billing/rules/project trouble —
   or an auth misconfiguration). Everyone else, including a visitor who
   hasn't signed in yet, only ever sees a generic network-style message.
   Reasons: (1) school staff can't act on infrastructure detail anyway, so
   showing it just causes alarm and duplicate support requests, and (2) that
   detail — e.g. "billing may be suspended" — isn't information a random
   teacher or parent account should be able to see about the platform. */
function classifyDbError(e){
  const code = (e && e.code) || '';
  if(code.indexOf('auth/')===0) return 'auth';
  if(code==='resource-exhausted') return 'quota';
  if(code==='permission-denied') return 'permission';
  if(code==='unavailable' || code==='deadline-exceeded' || code==='cancelled') return 'network';
  return 'unknown';
}
function dbErrorMessage(e, action){
  const generic = `Could not ${action||'reach the database'} right now. Please check your internet connection and try again in a moment.`;
  if(!CUR || CUR.role!=='founder') return generic;
  switch(classifyDbError(e)){
    case 'quota': return `Founder-only diagnosis: Firestore's daily read/write/delete quota appears to be exhausted (resource-exhausted). This affects every school on the platform until it resets, or until the project is upgraded off the Spark (free) plan to remove the daily cap.`;
    case 'permission': return `Founder-only diagnosis: access to Firestore was denied (permission-denied). This usually means billing is disabled/suspended, the project was closed or deleted, or the security rules changed. Check the Firebase console's Project Settings and Billing.`;
    case 'auth': return `Founder-only diagnosis: sign-in to the database failed. In the Firebase console, go to Build → Authentication → Sign-in method, and enable "Anonymous".`;
    case 'network': return `Founder-only diagnosis: the database looks unreachable right now (${e&&e.code?e.code:'network-level failure'}) — could be your connection, or Firestore/hosting having an outage.`;
    default: return `Founder-only diagnosis: could not ${action||'reach the database'}. Raw error code: ${e&&e.code?e.code:'unknown'}. Check the Firebase console for more detail.`;
  }
}
function showFatal(msg){
  let bar = document.getElementById('fatalBar');
  if(!bar){ bar=document.createElement('div'); bar.id='fatalBar';
    bar.style.cssText='position:fixed;top:0;left:0;right:0;background:#B23A3A;color:#fff;padding:12px 18px;font-family:Inter,sans-serif;font-size:14px;z-index:9999;box-shadow:0 2px 10px rgba(0,0,0,.3);';
    document.body.prepend(bar); }
  bar.innerHTML = '<b>Something went wrong:</b> ' + esc(String(msg)) + ' <span style="float:right;cursor:pointer;font-weight:800;" onclick="this.parentElement.remove()">✕</span>';
}
window.addEventListener('error', (e)=>{ showFatal(e.message); });
window.addEventListener('unhandledrejection', (e)=>{ showFatal(e.reason && e.reason.message ? e.reason.message : e.reason); });

/* ---------- PWA install support + auto-update ----------
   Two layers work together so a change you deploy reaches everyone, including
   people who already have the app open in a browser tab and never touch refresh:

   1. VERSION POLLING (works even without the service worker / PWA install).
      Every tab periodically re-fetches its OWN index.html straight from the network
      (cache:'no-store', bypassing the browser's HTTP cache) and reads the BUILD_ID
      baked into that fresh copy. If it doesn't match the BUILD_ID this tab is
      currently running, a new version has been deployed — the tab reloads itself.
      THIS IS WHAT YOU BUMP ON EVERY DEPLOY: change the BUILD_ID string below (any
      unique value — a timestamp is easiest) right before publishing. If it isn't
      changed, already-open tabs have nothing to detect and won't auto-update.

   2. SERVICE WORKER (only matters for people who installed this as an app / are
      using it offline-capable — see sw.js). skipWaiting()+clients.claim() there
      means a newly deployed service worker takes over immediately instead of
      waiting for every tab to be closed first, and we listen for controllerchange
      below to reload once it does.

   SAFETY: an update never reloads the page while it would be disruptive:
   - Not while a form field is focused, AND not immediately after tabbing between
     fields in the same form — it waits for a short quiet period with no field
     focused at all before reloading, so moving from one field to the next in a
     multi-field entry session (e.g. entering several students' marks) never gets
     interrupted mid-form.
   - Not while APP_BUSY is set — see setAppBusy() below, used to bracket long-running
     operations like bulk PDF export, so a 100-report bulk download can't be killed
     partway through by an update landing at the wrong moment.
------------------------------------------------------------------------------- */
const BUILD_ID = 'BUILD-2026-08-23-4'; // <-- change this to any new value on every deploy

// Set true for the duration of any operation an update-reload must never interrupt
// (bulk PDF export, CSV import, etc). Kept as a simple counter so nested/overlapping
// calls can't prematurely clear it.
let APP_BUSY = 0;
function setAppBusy(isBusy){ APP_BUSY = Math.max(0, APP_BUSY + (isBusy?1:-1)); }

// Tracks whether any on-screen form (e.g. a scores mark sheet) has been typed into
// since it was last rendered fresh or successfully submitted. isEditingNow() alone
// only protects the single field currently focused — it says nothing about the 30
// other mark boxes a teacher already filled in but hasn't hit Submit on yet. Without
// this, a reload landing during a pause between fields (nothing focused for >2.5s —
// e.g. the teacher stops to think, or checks a paper mark sheet) would silently wipe
// every unsubmitted mark. FORM_DIRTY closes that gap: any input/change inside a
// data-form form sets it, render() (called after every navigation AND after every
// successful save) clears it, so an update is held off for as long as there is
// genuinely unsaved on-screen data, regardless of which field currently has focus.
let FORM_DIRTY = false;
document.addEventListener('input', (e)=>{
  if(e.target && e.target.closest && e.target.closest('form[data-form]')) FORM_DIRTY = true;
}, true);
document.addEventListener('change', (e)=>{
  if(e.target && e.target.closest && e.target.closest('form[data-form]')) FORM_DIRTY = true;
}, true);

let updatePending = false;
let blurSettleTimer = null;
function isEditingNow(){
  const el = document.activeElement;
  return !!(el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
}
function hasUnsavedWork(){
  return isEditingNow() || FORM_DIRTY || APP_BUSY>0;
}
function showUpdateToast(msg){
  let t = document.getElementById('updateToast');
  if(!t){
    t = document.createElement('div'); t.id = 'updateToast';
    t.style.cssText = 'position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--navy,#0A2A4A);color:#fff;padding:9px 18px;border-radius:20px;font-weight:700;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:10000;font-family:Inter,sans-serif;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
}
function reloadForUpdate(){
  showUpdateToast('A newer version is available — reloading…');
  setTimeout(()=>location.reload(), 900);
}
// Only actually reloads once nothing is focused AND nothing is busy for a short,
// uninterrupted quiet period — tabbing straight from one field to the next re-arms
// the wait instead of triggering a reload between fields.
function tryReloadWhenQuiet(){
  if(blurSettleTimer) clearTimeout(blurSettleTimer);
  if(hasUnsavedWork()) return;
  blurSettleTimer = setTimeout(()=>{
    if(!hasUnsavedWork()) reloadForUpdate();
    else tryReloadWhenQuiet(); // still busy/editing/unsaved again — keep waiting
  }, 2500);
}
function requestUpdateWhenSafe(){
  if(updatePending) return;
  updatePending = true;
  if(hasUnsavedWork()){
    showUpdateToast('Update ready — will apply once your current entry is saved or submitted.');
    tryReloadWhenQuiet();
  } else {
    reloadForUpdate();
  }
}
document.addEventListener('blur', ()=>{ if(updatePending) tryReloadWhenQuiet(); }, true);
document.addEventListener('focus', ()=>{ if(updatePending && blurSettleTimer){ clearTimeout(blurSettleTimer); blurSettleTimer=null; } }, true);

// Belt-and-suspenders: also warn on a manual tab close/refresh while there's unsaved
// on-screen entry, not just our own auto-update reload. This is the same FORM_DIRTY
// flag, so it stays in sync with the update logic above for free.
window.addEventListener('beforeunload', (e)=>{
  if(FORM_DIRTY){ e.preventDefault(); e.returnValue = ''; }
});


async function checkForNewBuild(){
  try{
    const res = await fetch(location.pathname + location.search + (location.search?'&':'?') + '_v=' + Date.now(), {cache:'no-store'});
    if(!res.ok) return;
    const html = await res.text();
    const m = html.match(/BUILD_ID\s*=\s*['"]([^'"]+)['"]/);
    if(m && m[1] && m[1] !== BUILD_ID) requestUpdateWhenSafe();
  }catch(e){ /* offline or a network blip — just try again next interval */ }
}
function startUpdateWatcher(){
  const CHECK_INTERVAL_MS = 60*1000; // poll every minute
  setInterval(checkForNewBuild, CHECK_INTERVAL_MS);
  // Also check the moment a backgrounded tab becomes active again, so someone
  // switching back to a tab left open overnight gets the current version right
  // away instead of waiting up to a minute.
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkForNewBuild(); });
}
startUpdateWatcher();

if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').then(reg=>{
      // Actively re-check for a new service worker (not just on next full navigation)
      // so an already-open tab notices a deploy without needing to be closed/reopened.
      setInterval(()=>reg.update().catch(()=>{}), 60*1000);
      document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) reg.update().catch(()=>{}); });
    }).catch((e)=>console.warn('Service worker not registered:', e));
  });
  // Fires once the new service worker has actually taken control of this page
  // (after it calls skipWaiting()+clients.claim() — see sw.js). Reload so the
  // freshly-controlled page also picks up any cache changes the new worker makes,
  // respecting the same "not mid-edit" safety check as the version poll above.
  let swControllerChanged = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(swControllerChanged) return; // avoid a reload loop
    swControllerChanged = true;
    requestUpdateWhenSafe();
  });
}

/* ---------- Boot ---------- */
(async function(){
  try{ await loadAll(); render(); preloadHeavyLibsWhenIdle(); }
  catch(e){ showFatal(e.message); document.getElementById('app').innerHTML='<div style="padding:40px;">Could not start. See error above.</div>'; }
})();
</script>
