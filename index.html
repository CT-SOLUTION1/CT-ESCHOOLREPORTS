function csvEscape(v){
  const s = (v===null||v===undefined)?'':String(v);
  return /[",\r\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function parseCsvLine(line){
  const out=[]; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(inQ){
      if(c==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else inQ=false; }
      else cur+=c;
    } else {
      if(c==='"') inQ=true;
      else if(c===','){ out.push(cur); cur=''; }
      else cur+=c;
    }
  }
  out.push(cur);
  return out.map(x=>x.trim());
}
// Triggers a browser download from a Blob. IMPORTANT: revokeObjectURL is delayed
// (not called in the same tick as .click()) — on Android Chrome in particular, the
// actual download is handed off to the OS download manager asynchronously, and
// revoking the blob URL too early (especially for larger files, e.g. a backup with
// embedded student photos) silently aborts the download with no error shown at all.
// A short delay gives the browser time to actually start reading the blob first.
function triggerBlobDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function downloadCsv(filename, rows){
  const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  triggerBlobDownload(blob, filename);
}

/* ---------- Class Analysis (admin): student & subject performance ---------- */
function classSubjectsFor(cls){
  // Union of every subject any student currently in the class is taking.
  const set = new Set();
  DB.students.filter(s=>s.classId===cls.id).forEach(s=> studentSubjects(s, cls).forEach(su=>set.add(su)));
  return [...set];
}
function subjectClassStats(cls, subject, term, year){
  const students = DB.students.filter(s=>s.classId===cls.id && studentSubjects(s,cls).includes(subject));
  const scored = students.map(s=>({student:s, avg: subjectAverage(s.id, subject, term, year)})).filter(x=>x.avg!==null);
  const grades = {A:0,B:0,C:0,D:0,E:0,O:0,F:0};
  let sum=0, max=null, min=null;
  scored.forEach(x=>{
    const g = gradeFor(subject, x.avg, cls.level);
    grades[g] = (grades[g]||0)+1;
    sum += x.avg;
    if(max===null || x.avg>max) max=x.avg;
    if(min===null || x.avg<min) min=x.avg;
  });
  const avg = scored.length ? sum/scored.length : null;
  return {enrolled: students.length, sat: scored.length, avg, max, min, grades};
}
function classStudentStats(cls, term, year){
  const students = DB.students.filter(s=>s.classId===cls.id);
  const isA = cls.level==='A';
  return students.map(s=>{
    const {rows, totalPoints, avgPct} = computeSubjectRows(s, cls, term, year);
    const {position, size} = classPosition(s, cls, term, year);
    const maxP = isA ? maxPointsFor(s, cls) : 100;
    const metric = isA ? totalPoints : avgPct;
    const overallGrade = overallGradeFor(cls, avgPct);
    return {student:s, metric, maxP, position, size, overallGrade, sat: rows.filter(r=>r.avg!==null).length, total: rows.length};
  }).sort((a,b)=>a.position-b.position);
}
function classAnalysisView(){
  const isAdmin = CUR.role==='admin';
  const visibleClasses = isAdmin ? DB.classes : classTeacherClasses();
  if(!visibleClasses.length) return `<h2>Class Analysis</h2><div class="card"><p>${isAdmin?'No classes yet — add a class first.':"You aren't currently set as the Class Teacher for any class."}</p></div>`;
  const sel = VIEW.params;
  const classId = (sel.classId && visibleClasses.some(c=>c.id===sel.classId)) ? sel.classId : visibleClasses[0].id;
  const cls = visibleClasses.find(c=>c.id===classId) || visibleClasses[0];
  const term = sel.term || DB.info.currentTerm;
  const year = sel.year || DB.info.currentYear;
  const isA = cls.level==='A';

  const studentStats = classStudentStats(cls, term, year);
  const subjectStats = classSubjectsFor(cls).map(subj=>({subject:subj, ...subjectClassStats(cls, subj, term, year)}))
    .sort((a,b)=> (b.avg??-1) - (a.avg??-1));

  const studentRowsHtml = studentStats.map(r=>{
    const metricTxt = isA ? `${r.metric}/${r.maxP}` : `${r.metric.toFixed(1)}%`;
    const gradeTxt = isA ? '—' : (r.overallGrade || '—');
    return `<tr><td>${r.position}</td><td style="text-align:left;">${esc(r.student.name)}</td><td>${esc(r.student.admNo)}</td><td>${esc(comboLabel(r.student,cls))}</td><td>${r.sat}/${r.total}</td><td>${metricTxt}</td><td>${gradeTxt}</td></tr>`;
  }).join('');

  const gradeCols = gradeColsFor(cls.level);
  const subjectRowsHtml = subjectStats.map(r=>{
    const gradeCells = gradeCols.map(g=>`<td>${r.grades[g]||0}</td>`).join('');
    return `<tr><td style="text-align:left;">${esc(r.subject)}</td><td>${r.sat}/${r.enrolled}</td><td>${r.avg===null?'—':r.avg.toFixed(1)+'%'}</td><td>${r.max===null?'—':r.max.toFixed(1)}</td><td>${r.min===null?'—':r.min.toFixed(1)}</td>${gradeCells}</tr>`;
  }).join('');

  return `
  <h2>Class Analysis</h2>
  <div class="card">
    <div class="grid3">
      <div><label>Class</label><select onchange="setAnalysisParam('classId', this.value)">
        ${visibleClasses.map(c=>`<option value="${c.id}" ${c.id===cls.id?'selected':''}>${esc(c.name)}</option>`).join('')}
      </select></div>
      <div><label>Term</label><select onchange="setAnalysisParam('term', this.value)">
        ${['Term 1','Term 2','Term 3'].map(t=>`<option ${t===term?'selected':''}>${t}</option>`).join('')}
      </select></div>
      <div><label>Year</label><input value="${esc(String(year||''))}" onchange="setAnalysisParam('year', this.value)"></div>
    </div>
    <div class="flex" style="margin-top:14px;">
      <button class="btn-outline" data-action="dlClassAnalysisPdf:${cls.id}:${encodeURIComponent(term)}:${year}"><b>Download as PDF</b></button>
      <button class="btn" onclick="printLandscape()">Print / Save as PDF</button>
    </div>
  </div>
  <div id="printArea">
  <div class="card" style="overflow:auto;">
    <h3>${esc(cls.name)} — Student Performance — ${esc(term)}, ${esc(String(year))}</h3>
    <p class="small">How each student did overall this term, ranked by class position.</p>
    <table class="data-table"><tr><th>Pos</th><th>Name</th><th>Adm No</th><th>${isA?'Combination':'Subjects'}</th><th>Subjects Sat</th><th>${isA?'Points':'Average'}</th><th>${isA?'—':'Grade'}</th></tr>
    ${studentRowsHtml || `<tr><td colspan="7">No students in this class yet.</td></tr>`}
    </table>
  </div>
  <div class="card" style="overflow:auto;">
    <h3>Subject Performance</h3>
    <p class="small">How each subject was done across the whole class this term — average, spread, and grade distribution.</p>
    <table class="data-table"><tr><th>Subject</th><th>Sat / Enrolled</th><th>Class Average</th><th>Highest</th><th>Lowest</th>${gradeCols.map(g=>`<th>${g}</th>`).join('')}</tr>
    ${subjectRowsHtml || `<tr><td colspan="${5+gradeCols.length}">No subjects on record for this class yet.</td></tr>`}
    </table>
  </div>
  </div>`;
}
function setAnalysisParam(key, value){ VIEW.params = {...VIEW.params, [key]: value}; render(); }

/* ---------- Master Mark Sheet (admin): every student x every subject, one class ----------
   One wide table for a whole class/term/year: every subject the class takes as its own
   column group (with a sub-column per paper for subjects that have more than one paper,
   e.g. Physics Paper 1 / Paper 2), plus each subject's combined Average and Grade, and a
   final Total/Overall/Position summary per student. Deliberately wide — meant to be
   downloaded or printed on LANDSCAPE paper (see printLandscape() and the PDF export
   below, which both force landscape regardless of what orientation the rest of the app
   prints in). */
function masterMarkSheetView(forExport){
  const isAdmin = CUR.role==='admin';
  const visibleClasses = isAdmin ? DB.classes : classTeacherClasses();
  if(!visibleClasses.length) return `<h2>Master Mark Sheet</h2><div class="card"><p>${isAdmin?'No classes yet — add a class first.':"You aren't currently set as the Class Teacher for any class."}</p></div>`;
  const sel = VIEW.params;
  const classId = (sel.mmClassId && visibleClasses.some(c=>c.id===sel.mmClassId)) ? sel.mmClassId : visibleClasses[0].id;
  const cls = visibleClasses.find(c=>c.id===classId) || visibleClasses[0];
  const term = sel.mmTerm || DB.info.currentTerm;
  const year = sel.mmYear || DB.info.currentYear;
  // Two flavors of the same sheet, picked with the tabs below: 'scores' shows the raw
  // marks (per paper, per subject) with nothing graded, so it reads like a scanned exam
  // register; 'grades' shows only the letter/code each learner earned per subject, so it
  // reads like an official results sheet. Kept as one function (same underlying data,
  // same landscape layout) so the two never drift out of sync with each other.
  const mode = sel.mmMode==='grades' ? 'grades' : 'scores';
  const isA = cls.level==='A';
  const isP = cls.level==='P';
  const cfg = examConfig(cls.id);

  // One column-group per subject actually taken by someone in this class. In Scores mode
  // a multi-paper subject gets one sub-column per paper plus its combined Avg; a
  // single-paper subject gets one Score column. In Grades mode every subject — no matter
  // how many papers — collapses to a single Grade column, since a letter/code is awarded
  // for the subject as a whole, never for one paper alone (mirrors the report card).
  const subjectMeta = classSubjectsFor(cls).sort((a,b)=>a.localeCompare(b)).map(subj=>{
    const papers = subjectPapersFor(subj, cls);
    const multi = papers.length>=2;
    const colspan = mode==='grades' ? 1 : (multi ? papers.length+1 : 1);
    return {subject:subj, papers, multi, colspan};
  });

  const allStudents = DB.students.filter(s=>s.classId===cls.id).slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const pg = paginateMarksheet(allStudents, sel.mmPage, !!forExport);
  const students = pg.pageItems;

  const rowsData = students.map(s=>{
    const {totalPoints, avgPct} = computeSubjectRows(s, cls, term, year);
    const {position, size} = classPosition(s, cls, term, year);
    const maxP = isA ? maxPointsFor(s, cls) : 100;
    const overallGrade = isP ? null : gradeFor('', avgPct, cls.level);
    const pAggregate = isP ? primaryAggregate(s, cls, term, year) : null;
    const pDivision = isP ? primaryDivisionFor(pAggregate) : null;
    const perSubject = subjectMeta.map(sm=>{
      const bd = subjectBreakdown(s.id, sm.subject, term, year);
      const grade = bd.final===null ? '—' : gradeFor(sm.subject, bd.final, cls.level);
      let paperCells = [];
      if(sm.multi){
        const pb = subjectPaperBreakdown(s.id, sm.subject, cls, term, year);
        paperCells = sm.papers.map(p=>{
          const row = pb ? pb.papers.find(x=>String(x.paper)===String(p)) : null;
          if(!row || !row.hasAny) return '—';
          const val = combinePaper(row.aoiAvg, row.eotAvg, cfg);
          return val===null ? '—' : val.toFixed(1);
        });
      }
      return { paperCells, avg: bd.final===null?'—':bd.final.toFixed(1), grade };
    });
    return { student:s, perSubject, position, size, totalPoints, avgPct, maxP, overallGrade, pAggregate, pDivision };
  });

  const gradeTd = (g)=>`<td style="font-weight:800;${g&&g!=='—'?`color:${gradeColorFor(g)};`:''}">${g}</td>`;

  let headerRow1, headerRow2, bodyRows, colCount;

  if(mode==='scores'){
    // Raw marks only — no grading. Overall column is the plain Average % (Points and
    // Aggregate are themselves grade-derived, so they belong on the Grades sheet, not here).
    headerRow1 = `<th rowspan="2">#</th><th rowspan="2">Adm No</th><th rowspan="2">Student Name</th>` +
      subjectMeta.map(sm=>sm.colspan>1?`<th colspan="${sm.colspan}">${esc(sm.subject)}</th>`:`<th rowspan="2">${esc(sm.subject)}</th>`).join('') +
      `<th rowspan="2">Subjects</th><th rowspan="2">Average</th><th rowspan="2">Position</th>`;
    headerRow2 = subjectMeta.map(sm=> sm.multi ? sm.papers.map(p=>`<th>P${esc(String(p))}</th>`).join('') + `<th>Avg</th>` : '').join('');
    bodyRows = rowsData.map((r,i)=>{
      const subjectCells = r.perSubject.map(ps=>{
        const paperTds = ps.paperCells.map(v=>`<td>${v}</td>`).join('');
        return `${paperTds}<td>${ps.avg}</td>`;
      }).join('');
      return `<tr><td>${pg.startIndex+i+1}</td><td>${esc(r.student.admNo||'—')}</td><td style="text-align:left;">${esc(r.student.name)}</td>${subjectCells}<td>${subjectMeta.length}</td><td>${r.avgPct.toFixed(1)}%</td><td>${r.position}/${r.size}</td></tr>`;
    }).join('');
    colCount = 6 + subjectMeta.reduce((a,sm)=>a+(sm.multi?sm.papers.length+1:1),0);
  } else {
    // Letter/code grades only — one Grade column per subject, plus the official overall
    // Points/Average, Grade/Aggregate(+Division), and Position, exactly as they'd appear
    // on a results/release sheet.
    headerRow1 = `<th rowspan="2">#</th><th rowspan="2">Adm No</th><th rowspan="2">Student Name</th>` +
      subjectMeta.map(sm=>`<th rowspan="2">${esc(sm.subject)}</th>`).join('') +
      `<th rowspan="2">Subjects</th><th rowspan="2">${isA?'Points':'Average'}</th><th rowspan="2">${isP?'Aggregate':'Grade'}</th>${isP?'<th rowspan="2">Division</th>':''}<th rowspan="2">Position</th>`;
    headerRow2 = '';
    bodyRows = rowsData.map((r,i)=>{
      const subjectCells = r.perSubject.map(ps=>gradeTd(ps.grade)).join('');
      const overallCell = isA ? `${r.totalPoints}/${r.maxP}` : `${r.avgPct.toFixed(0)}%`;
      const gradeCell = isP ? (r.pAggregate!==null? String(r.pAggregate) : '—') : (r.overallGrade || '—');
      return `<tr><td>${pg.startIndex+i+1}</td><td>${esc(r.student.admNo||'—')}</td><td style="text-align:left;">${esc(r.student.name)}</td>${subjectCells}<td>${subjectMeta.length}</td><td>${overallCell}</td>${isP?`<td style="font-weight:800;">${gradeCell}</td>`:gradeTd(gradeCell)}${isP?`<td style="font-weight:800;">${r.pDivision||'—'}</td>`:''}<td>${r.position}/${r.size}</td></tr>`;
    }).join('');
    colCount = 6 + subjectMeta.length + (isP?1:0);
  }

  const tabBtn = (val,label)=>`<button class="${mode===val?'btn':'btn-outline'}" onclick="setMasterMarkSheetParam('mmMode','${val}')">${label}</button>`;

  return `
  <h2>Master Mark Sheet</h2>
  <div class="card">
    <div class="grid3">
      <div><label>Class</label><select onchange="setMasterMarkSheetParam('mmClassId', this.value)">
        ${visibleClasses.map(c=>`<option value="${c.id}" ${c.id===cls.id?'selected':''}>${esc(c.name)}</option>`).join('')}
      </select></div>
      <div><label>Term</label><select onchange="setMasterMarkSheetParam('mmTerm', this.value)">
        ${['Term 1','Term 2','Term 3'].map(t=>`<option ${t===term?'selected':''}>${t}</option>`).join('')}
      </select></div>
      <div><label>Year</label><input value="${esc(String(year||''))}" onchange="setMasterMarkSheetParam('mmYear', this.value)"></div>
    </div>
    <label style="margin-top:14px;">View</label>
    <div class="flex">${tabBtn('scores','Real Scores (marks per subject/paper)')}${tabBtn('grades','Letter Grades (per subject)')}</div>
    <div class="note" style="margin-top:12px;">${mode==='scores'
      ? 'This sheet lists every student\'s raw marks — no grading — with a sub-column per paper for subjects that have more than one. Switch to "Letter Grades" for the graded version.'
      : 'This sheet lists the letter/code grade each student earned in every subject, plus their overall Points/Average, Grade/Aggregate and Position. Switch to "Real Scores" to see the underlying marks.'
    } Either way, it\'s wide — download it as a PDF or print it, and choose <b>LANDSCAPE</b> paper for clarity.</div>
    <div class="flex" style="margin-top:12px;">
      <button class="btn-gold" data-action="dlMasterMarkSheetPdf:${cls.id}:${encodeURIComponent(term)}:${year}:${mode}"><b>Download as PDF (landscape)</b></button>
      <button class="btn" data-action="printMasterMarkSheet:${cls.id}:${encodeURIComponent(term)}:${year}:${mode}">Print (landscape)</button>
      <button class="btn-outline" data-action="nav:reports">Back to Report Cards</button>
    </div>
  </div>
  <div id="printArea">
  <div class="mm-page">
    <div class="mm-header">
      ${DB.info.logo?`<img src="${DB.info.logo}" class="mm-logo" alt="">`:''}<span class="mm-school">${esc(DB.info.schoolName||'')}</span>
      <div class="mm-title">Master Mark Sheet — ${mode==='scores'?'Real Scores':'Letter Grades'}</div>
      <div class="mm-meta">${esc(cls.name)}${cls.stream?(' '+esc(cls.stream)):''} &nbsp;•&nbsp; ${esc(term)}, ${esc(String(year))} &nbsp;•&nbsp; ${pg.total} student${pg.total===1?'':'s'}</div>
    </div>
    <div class="mm-tablewrap">
      <table class="mm-table">
        <thead>
          <tr>${headerRow1}</tr>
          ${headerRow2?`<tr>${headerRow2}</tr>`:''}
        </thead>
        <tbody>
          ${bodyRows || `<tr><td colspan="${colCount}">No students in this class yet.</td></tr>`}
        </tbody>
      </table>
    </div>
    ${mode==='grades' ? `<p class="small" style="margin-top:10px;">${isP
      ? 'Grading scale (Primary/PLE): D1, D2 = Distinction &nbsp; C3–C6 = Credit &nbsp; P7, P8 = Pass &nbsp; F9 = Fail. Aggregate = sum of grade-points for the compulsory subjects; Division is derived from that aggregate.'
      : `Grading scale (${isA?'A-Level':'O-Level'}): A = Excellent &nbsp; B = Very Good &nbsp; C = Good &nbsp; D = Fair &nbsp; E = Weak${isA?' &nbsp; O = Subsidiary Pass &nbsp; F = Fail':''}.`
    }</p>` : ''}
    <div class="mm-footer">
      <span>Generated ${esc(new Date().toLocaleDateString())}</span>
      ${DB.info.headteacher?`<span>Head Teacher: ${esc(DB.info.headteacher)}</span>`:''}
    </div>
  </div>
  </div>
  ${!forExport ? marksheetPaginationBar(pg.page, pg.totalPages, pg.total, pg.size, pg.startIndex, `mmPage`) : ''}`;
}
// Changing class/term/year/mode always jumps back to page 1 (the old page number
// likely no longer makes sense for a different roster) — except when the change
// IS the page number itself.
function setMasterMarkSheetParam(key, value){
  const params = {...VIEW.params, [key]: value};
  if(key!=='mmPage') params.mmPage = 1;
  VIEW.params = params;
  render();
}

function scoresEntryView(mine){
  const sel = VIEW.params;
  let studentRows = '';
  if(sel.assignId && sel.paper && sel.kind){
    const a = mine.find(x=>x.id===sel.assignId);
    if(!a) return `<p>That assignment is not available to you.</p><button class="btn-outline" data-action="nav:${VIEW.name}">Back to subject/class picker</button>`;
    const cls = DB.classes.find(c=>c.id===a.classId);
    // Every student already in the class is available to a subject teacher to tick —
    // admin registration never decides who takes a subject, so eligibility here is
    // simply "in this class", not "already recorded as taking this subject".
    const eligible = sortByName(DB.students.filter(s=>s.classId===a.classId));
    const rosterSet = Array.isArray(a.studentIds);
    const labelBit = encodeURIComponent(sel.label||'');
    if(!rosterSet || sel.editRoster){
      // Step: teacher ticks (once) which of these students actually take this subject
      // with them. Nothing is pre-ticked — only students the teacher actively ticks end
      // up on the roster and count as taking this subject.
      const chosen = new Set(rosterSet ? a.studentIds : []);
      const knownIds = new Set(a.studentIds||[]);
      const compulsory = isCompulsorySubjectFor(a.subject, cls);
      const allChosen = eligible.length>0 && eligible.every(s=>chosen.has(s.id));
      studentRows = `
      <div class="card">
        <h3>${esc(a.subject)} — ${esc(cls.name)} — Select your students</h3>
        <p class="small">${compulsory
          ? `${esc(a.subject)} is compulsory for every student in ${esc(cls.name)}, so tick <b>"Select all students"</b> below to add everyone in one go — or untick just the box for anyone who genuinely shouldn't be included. This is saved so you won't be asked again, but you can always come back and edit your list.`
          : `Every student in ${esc(cls.name)} is listed below. Tick only the ones who take ${esc(a.subject)} with you — only ticked students count as taking this subject and will appear for scoring. This is saved so you won't be asked again, but you can always come back and edit your list — for example if a student was missed, or a new one is registered by the admin.`}</p>
        <form data-form="saveRoster" data-assign="${a.id}" data-paper="${sel.paper}" data-kind="${sel.kind}" data-label="${esc(sel.label||'')}" data-max="${sel.maxScore||100}">
          ${compulsory && eligible.length ? `
          <label style="display:flex;gap:8px;align-items:center;padding:5px 2px 10px;font-weight:600;text-transform:none;">
            <input type="checkbox" data-select-all-students="1" style="width:auto;" ${allChosen?'checked':''}>
            Select all students
          </label>` : ''}
          <div style="max-height:360px;overflow:auto;border:1px solid #cfd9e3;border-radius:6px;padding:10px;">
          ${eligible.map(s=>`<label style="display:flex;gap:8px;align-items:center;padding:5px 2px;font-weight:400;text-transform:none;">
            <input type="checkbox" name="students" value="${s.id}" style="width:auto;" ${chosen.has(s.id)?'checked':''}>
            ${esc(s.name)} ${rosterSet && !knownIds.has(s.id) ? '<span class="pill" style="background:var(--gold);color:#3a2c00;">NEW</span>' : ''}
          </label>`).join('') || '<p class="small">No students in this class yet — ask the admin to upload the class list first.</p>'}
          </div>
          <button class="btn" style="margin-top:14px;">Submit — save my student list</button>
        </form>
      </div>
      <div class="card">
        <h3>Student new to the school / class</h3>
        ${CUR.role==='admin' ? `
        <p class="small">Not on the class list at all yet? Add them here with just their name, admission number and sex — they'll be created in ${esc(cls.name)} and included in your marking list for ${esc(a.subject)} right away. You'll still need to tick them into any other subject you'd like them included in.</p>
        <form data-form="quickAddStudent" data-assign="${a.id}" data-paper="${sel.paper}" data-kind="${sel.kind}" data-label="${esc(sel.label||'')}" data-max="${sel.maxScore||100}">
          <div class="grid3">
            <div><label>Full name</label><input name="name" required></div>
            <div><label>Admission number</label><input name="admNo" required></div>
            <div><label>Gender</label><select name="gender"><option>Male</option><option>Female</option></select></div>
          </div>
          <button class="btn" style="margin-top:10px;">Submit — add student & include in my list</button>
        </form>` : `
        <p class="small">Not on the class list at all yet? New students must be registered by an Admin first (name, admission number, sex, class). Once the Admin has added them to ${esc(cls.name)}, they'll appear in the "Select your students" list above for you to tick into your marking list — you don't need to create them yourself.</p>`}
      </div>`;
    } else {
      const students = DB.students.filter(s=>a.studentIds.includes(s.id));
      const newCount = eligible.filter(s=>!a.studentIds.includes(s.id)).length;
      const term = DB.info.currentTerm, year = DB.info.currentYear;
      // Every other test/exam already on record this term for this subject, so the
      // teacher can see the full picture for each learner (not just the one column
      // they're currently filling in) — reuses the same column logic as the
      // integrated mark sheet.
      const isP = cls.level==='P';
      const isCurrentCol = c => String(c.paper)===String(sel.paper) && c.kind===sel.kind && (c.kind!=='AOI' || c.label===(sel.label||''));
      const otherCols = marksheetColumns(students, a.subject).filter(c=>!isCurrentCol(c));
      // Primary has no concept of papers (a single implicit paper per subject), so the
      // "P1"/"Paper 1" prefix is omitted from every column label and heading here.
      const colLabel = c => (!isP && c.paper!=null && c.paper!=='' ? 'P'+esc(String(c.paper))+' ' : '') + (c.kind==='EOT' ? esc(examConfig(a.classId).eotLabel) : (esc(examConfig(a.classId).cwLabel)+(c.label?': '+esc(c.label):'')));
      const otherColHeaders = otherCols.map(c=>{
        // All scores in a column share the same max, so pull it off whichever student has
        // a mark recorded for this column already (every otherCol has at least one).
        let colMax = sel.maxScore||100;
        for(const s of students){ const r=scoreCellFor(s.id, a.subject, c, term, year); if(r){ colMax = r.max; break; } }
        return `<th class="small" style="font-weight:600;"><a href="#" data-action="switchScoreCol:${a.id}:${c.paper}:${c.kind}:${encodeURIComponent(c.label||'')}:${colMax}" title="Click to edit this test's scores">${colLabel(c)}</a></th>`;
      }).join('');
      const currentColLabel = (!isP && sel.paper?('P'+esc(String(sel.paper))+' '):'') + (sel.kind==='AOI'?(esc(examConfig(a.classId).cwLabel)+(sel.label?': '+esc(sel.label):'')):esc(examConfig(a.classId).eotLabel));
      const missKey = missingMarkersKey(a.id, sel.paper, sel.kind, sel.label||'');
      const missSet = MISSING_MARKERS[missKey] || new Set();
      const cfgHere = examConfig(a.classId);
      const scoresLocked = CUR.role!=='admin' && teacherLockedByDeadline(CUR.username, sel.kind);
      studentRows = `
      ${newCount? `<div class="note" style="margin-bottom:14px;">${newCount} new student${newCount>1?'s':''} in this class ${newCount>1?"aren't":"isn't"} on your list yet. <a href="#" data-action="editRoster:${a.id}:${sel.paper}:${sel.kind}:${labelBit}:${sel.maxScore||100}">Update my student list</a></div>` : ''}
      ${scoresLocked? `<div class="note" style="border-color:var(--danger);color:var(--danger);margin-bottom:14px;"><b>The ${esc(sel.kind==='AOI'?cfgHere.cwLabel:cfgHere.eotLabel)} submission deadline (${fmtDateTime(scoreDeadlineFor(sel.kind).deadline)}) has passed.</b> You can still see everything below, but scores can't be submitted, edited, or deleted until your admin reopens entry for you.</div>` : ''}
      <div class="card">
        <div class="flex" style="justify-content:space-between;align-items:center;">
          <h3 style="margin:0;">${esc(a.subject)}${isP?'':` — Paper ${esc(sel.paper)}`} — ${sel.kind==='AOI'?(esc(cfgHere.cwLabel)+': '+esc(sel.label||'')):esc(cfgHere.eotLabel)} — ${esc(cls.name)}</h3>
          <a href="#" class="small" data-action="editRoster:${a.id}:${sel.paper}:${sel.kind}:${labelBit}:${sel.maxScore||100}">Edit my student list</a>
        </div>
        <p class="small">You're entering <b>${currentColLabel}</b>, marked out of <b>${sel.maxScore||100}</b> — that's the highlighted column below. ${otherCols.length?`For context, every other ${esc(a.subject)} test or exam already recorded this term is also shown alongside it, so you can see each learner's full record so far before entering this one. <b>Click any of those column headings to switch straight into editing that test's scores instead.</b>`:''} The report card will automatically convert this test to ${sel.kind==='AOI'?`${esc(cfgHere.cwLabel)}'s /${cfgHere.cwPercent} scale`:`${esc(cfgHere.eotLabel)}'s /${cfgHere.eotPercent} scale`}. Click a box and type marks, then hit Submit below to save &amp; send. <b>You can leave a box empty for a student who was absent or missing</b> — it will simply be skipped, and everyone else's marks will still be saved. Already-submitted marks for the highlighted test are pre-filled below too, so editing and resubmitting a score is as simple as changing the number and hitting Submit again.</p>
        <form data-form="saveScores" data-assign="${a.id}" data-paper="${sel.paper}" data-subject="${a.subject}" data-kind="${sel.kind}" data-label="${esc(sel.label||'')}" data-max="${sel.maxScore||100}">
          <table class="data-table"><tr><th>Student</th>${otherColHeaders}<th style="background:#eaf3ff;">${currentColLabel}<br><span class="small" style="font-weight:400;">(entering now, /${sel.maxScore||100})</span></th><th>Actions</th></tr>
          ${students.map(s=>{
            let existing = '', existingRow = null;
            if(sel.kind==='EOT'){
              existingRow = DB.scores.find(sc=>sc.studentId===s.id && sc.subject===a.subject && sc.paper==sel.paper && sc.kind==='EOT' && sc.term===term && sc.year===year);
            } else {
              existingRow = DB.scores.find(sc=>sc.studentId===s.id && sc.subject===a.subject && sc.paper==sel.paper && sc.kind==='AOI' && sc.label===(sel.label||'') && sc.term===term && sc.year===year);
            }
            existing = existingRow ? existingRow.marks : '';
            const delScoreBtn = existingRow ? `<button type="button" class="btn-danger" style="padding:4px 10px;" data-action="deleteScore:${existingRow.id}" ${scoresLocked?'disabled':''}>Delete score</button>` : '';
            const otherCells = otherCols.map(c=>{
              const row = scoreCellFor(s.id, a.subject, c, term, year);
              return row ? `<td class="small">${esc(row.marks)}/${esc(row.max)}</td>` : `<td class="small" style="color:var(--muted);">—</td>`;
            }).join('');
            const isMissing = !existingRow && missSet.has(s.id);
            const clearMissingBtn = isMissing ? `<button type="button" class="btn-outline" style="padding:4px 10px;" title="The score wasn't actually missing — just clear the X flag" data-action="clearMissing:${a.id}:${sel.paper}:${sel.kind}:${encodeURIComponent(sel.label||'')}:${s.id}">Clear X</button>` : '';
            const conflict = SUBSIDIARIES.includes(a.subject) && hasSubsidiaryConflict(s, cls);
            const conflictBadge = conflict ? ` <span class="pill" style="background:var(--danger);color:#fff;" title="This student is ticked into BOTH Subsidiary Mathematics and Subsidiary Computer rosters — a student can only take one, so NEITHER shows on their report card right now, even though scores may be saved here. Remove them from whichever roster is wrong to fix this — nothing is auto-picked for you.">⚠ dual subsidiary — hidden from report card</span>` : '';
            return `<tr><td style="text-align:left;">${esc(s.name)}${conflictBadge}</td>${otherCells}<td style="background:#f6fbff;"><input name="m_${s.id}" data-student="${esc(s.name)}" type="number" min="0" max="${sel.maxScore||100}" step="0.01" value="${existing}" placeholder="${isMissing?'X':''}" class="${isMissing?'missing-mark':''}" style="width:80px;${isMissing?'border-color:var(--danger);':''}" ${scoresLocked?'disabled':''}></td><td class="flex" style="justify-content:center;">${delScoreBtn}${clearMissingBtn}<button type="button" class="btn-outline" style="padding:4px 10px;" data-action="removeFromRoster:${a.id}:${s.id}">Remove from list</button></td></tr>`;
          }).join('') || `<tr><td colspan="${otherCols.length+3}">No students on your list yet. Use "Edit my student list" above.</td></tr>`}
          </table>
          <p class="small">"Delete score" removes just this test's saved mark for a student (it disappears from the mark sheet and their report card immediately) without taking them off your marking list. "Remove from list" takes them off your list entirely but keeps any scores already saved.</p>
          <button class="btn" style="margin-top:14px;" ${scoresLocked?'disabled title="Deadline has passed — ask your admin to reopen entry for you"':''}>Submit — save & send scores</button>
          ${syncStatusBanner(scoreSyncKey(a.id, sel.paper, sel.kind, sel.label||''))}
        </form>
      </div>
      <div class="card">
        <h3>Mark sheet tools</h3>
        <p class="small">Prefer marking on paper? Download a blank mark sheet as a <b>PDF</b> to print. Prefer a spreadsheet? Download the CSV version, fill in the Marks column, and upload it back here — the CSV is only used for that fill-in-and-re-upload step. You can also view every test/exam recorded for this subject in one table.</p>
        <div class="flex">
          <button class="btn-outline" data-action="dlMarksheetPdf:${a.id}:${sel.paper}:${sel.kind}:${labelBit}:${sel.maxScore||100}"><b>Download blank mark sheet (PDF)</b></button>
          <button class="btn-outline" data-action="dlMarksheet:${a.id}:${sel.paper}:${sel.kind}:${labelBit}:${sel.maxScore||100}">Download for spreadsheet re-upload (CSV)</button>
          <button class="btn-outline" data-action="openMarksheet:${a.classId}:${encodeURIComponent(a.subject)}">View integrated mark sheet (all tests)</button>
        </div>
        <hr style="margin:16px 0;border:none;border-top:1px solid var(--line);">
        <form data-form="uploadMarksheet" data-assign="${a.id}" data-paper="${sel.paper}" data-subject="${esc(a.subject)}" data-kind="${sel.kind}" data-label="${esc(sel.label||'')}" data-max="${sel.maxScore||100}">
          <label>Upload a filled mark sheet (CSV)</label>
          <input type="file" name="marksheetFile" accept=".csv,text/csv" required>
          <p class="small">Keep the Admission No column unchanged; only the Marks column needs filling in. Rows that don't match a student on your list, or are left blank, are skipped.</p>
          <button class="btn" style="margin-top:10px;">Submit — import marks from this file</button>
        </form>
      </div>`;
    }
  }
  const pickerSubmitted = !!(sel.assignId && sel.paper && sel.kind);
  // Once Step 1 has been submitted, the picker card is replaced by a compact summary
  // + "Change" link instead of staying on-screen above the student list. On a small
  // phone screen, leaving both visible at once made it easy to miss that anything had
  // even happened — the new content just appeared further down, off-screen, so a
  // teacher would assume the Submit button hadn't worked. Showing only ONE of the two
  // at a time makes the step change unmistakable.
  const pickedAssign = pickerSubmitted ? mine.find(x=>x.id===sel.assignId) : null;
  const pickedCls = pickedAssign ? DB.classes.find(c=>c.id===pickedAssign.classId) : null;
  const pickerSummaryBar = pickerSubmitted ? `
  <div class="card" style="margin-top:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
    <div><b>${pickedAssign?esc(pickedAssign.subject):''}</b>${pickedCls?' — '+esc(pickedCls.name):''}${pickedCls&&pickedCls.level!=='P'?' — Paper '+esc(String(sel.paper)):''} — ${sel.kind==='AOI'?esc(sel.label||examConfig(pickedAssign?pickedAssign.classId:null).cwLabel):esc(examConfig(pickedAssign?pickedAssign.classId:null).eotLabel)} <span class="small" style="color:var(--muted);">(out of ${sel.maxScore})</span></div>
    <button type="button" class="btn-outline" data-action="nav:${VIEW.name}">Change subject / paper / test</button>
  </div>` : '';
  const pickerCard = pickerSubmitted ? '' : `
  <div class="card" style="margin-top:14px;">
    <form data-form="pickPaper">
      <div class="grid2">
        <div><label>Subject / class assignment</label>
          <select name="assignId" id="assignSel" required>
            <option value="">-- click here to choose what to mark --</option>
            ${mine.map(a=>{ const c=DB.classes.find(x=>x.id===a.classId);
              const teacherBit = CUR.role==='admin' ? ` — ${esc((DB.accounts.find(t=>t.username===a.teacherUsername)||{}).name||a.teacherUsername)}` : '';
              return `<option value="${a.id}">${esc(a.subject)} — ${c?esc(c.name):''}${teacherBit}</option>`; }).join('') || '<option value="">-- no subject assignments yet --</option>'}
          </select>
        </div>
        <div id="paperFieldWrap"><label>Paper</label><select name="paper" required id="paperSelect"></select></div>
      </div>
      <div class="grid2">
        <div><label>Assessment type</label><select name="kind" id="kindSel">
          <option value="AOI">${esc(examConfig().cwLabel)} (continuous assessment test)</option>
          <option value="EOT">${esc(examConfig().eotLabel)}</option>
        </select></div>
        <div id="labelWrap">${examConfig().cwTests.length ? `
          <label>${esc(examConfig().cwLabel)} test</label>
          <select name="label" id="cwTestSel">
            ${examConfig().cwTests.map(t=>`<option value="${esc(t.name)}" data-max="${t.max}">${esc(t.name)} (out of ${t.max})</option>`).join('')}
          </select>` : `
          <input type="hidden" name="label" value="${esc(examConfig().cwLabel)}">
          ${CUR.role==='admin' ? `<label>${esc(examConfig().cwLabel)}</label>
          <p class="small" style="margin-top:6px;">No named ${esc(examConfig().cwLabel)} tests yet — add one under Settings → Grading Setup if you want separate columns (e.g. Test 1, Test 2). Until then, scores are recorded under a single "${esc(examConfig().cwLabel)}" bucket.</p>` : ''}`}
        </div>
      </div>
      <label>What was this test/exam marked out of? <span style="color:var(--danger);">*compulsory</span></label>
      <input name="maxScore" id="maxScoreInput" type="number" min="1" step="1" value="" placeholder="Type the maximum mark here — required" required>
      <p class="small">You must type this in yourself every time, even if it looks like it matches a test the admin already set up — it isn't pre-filled. Enter students' raw marks below exactly as marked (e.g. out of 30, out of 50 — whatever this test's maximum was). Whatever maximum you set here, the system automatically converts the average onto the report card's uniform scale set by the admin: ${esc(examConfig().cwLabel)} out of ${examConfig().cwPercent}, ${esc(examConfig().eotLabel)} out of ${examConfig().eotPercent}.</p>
      <button class="btn" style="margin-top:14px;">Submit — load student list</button>
    </form>
  </div>`;
  return `
  <h2>${CUR.role==='admin'?'Enter / Download Scores':'Enter Scores'}</h2>
  <div class="note">${CUR.role==='admin'?'As Admin, you can select <b>any</b> subject/class assignment below — for any teacher — and enter or edit scores directly on their behalf. The dropdown shows the teacher\'s name next to each assignment. ':''}Step 1: choose the subject/class ${CUR.role==='admin'?'and teacher':'you\'re assigned'}, the paper, and whether this is an AOI test or the End of Term score. Step 2: click below to load the students and type marks. Step 3: click <b>Save &amp; send</b>.</div>
  ${pickerCard}${pickerSummaryBar}
  ${studentRows}`;
}

/* ============================================================
   10. REPORT CARD (fits one page)
   ============================================================ */
function reportCardHTML(studentId, embedded, viewTerm, viewYear){
  const s = DB.students.find(x=>x.id===studentId);
  if(!s) return '<p>Student not found.</p>';
  const cls = DB.classes.find(c=>c.id===s.classId);
  if(!cls) return '<p>This student has no class assigned.</p>';
  const term = viewTerm || DB.info.currentTerm;
  const year = viewYear || DB.info.currentYear;
  const isCurrentPeriod = term===DB.info.currentTerm && Number(year)===Number(DB.info.currentYear);
  const periods = availableTermYears(studentId);
  const { rows, totalPoints, avgPct } = computeSubjectRows(s, cls, term, year);
  const { position, size } = classPosition(s, cls, term, year);
  const isA = cls.level==='A';
  const isP = cls.level==='P';
  // Previous Position (Primary only): the student's rank in the term immediately
  // before the one being viewed, following the school calendar's own rotation —
  // Term 1 looks back to Term 3 of the PRIOR year, Term 2 looks back to Term 1 of
  // the same year, and Term 3 looks back to Term 2 of the same year. This is
  // computed from the calendar, not just "the next entry in this student's score
  // history", so a gap (e.g. no Term 2 scores on file) doesn't accidentally pull in
  // the wrong term. It only shows a value if this student actually has scores on
  // file for that specific prior term.
  let prevPeriod = null, prevPosition = null;
  if(isP){
    function prevTermYearFor(t, y){
      if(t==='Term 1') return {term:'Term 3', year:Number(y)-1};
      if(t==='Term 2') return {term:'Term 1', year:Number(y)};
      if(t==='Term 3') return {term:'Term 2', year:Number(y)};
      return null;
    }
    const prevTY = prevTermYearFor(term, year);
    prevPeriod = prevTY ? (periods.find(p=>p.term===prevTY.term && Number(p.year)===Number(prevTY.year)) || null) : null;
    prevPosition = prevPeriod ? classPosition(s, cls, prevPeriod.term, prevPeriod.year) : null;
  }
  // Weak Subject(s) (O-Level and A-Level only): whichever subject(s) this learner
  // scored lowest in this term — their own lowest Final Average among subjects
  // that actually have a mark on file. Ties (more than one subject sharing the
  // exact lowest average) are all listed, since picking just one arbitrarily
  // would be misleading.
  let weakSubjects = null;
  if(!isP){
    const graded = rows.filter(r=>r.avg!==null);
    if(graded.length){
      const minAvg = Math.min(...graded.map(r=>r.avg));
      weakSubjects = graded.filter(r=>Math.abs(r.avg-minAvg)<0.05).map(r=>r.subject);
    }
  }
  const maxP = isA ? maxPointsFor(s, cls) : 100;
  const metric = isA ? totalPoints : avgPct;
  const pct = maxP ? metric/maxP : 0;

  // Overall grade / descriptor: A-Level → shown as points; O-Level → A-E grade off the
  // final average; Primary → Division off the aggregate of the 4 PLE-core subjects.
  const overallGrade = gradeFor('', avgPct, cls.level);
  const commentMap = isP ? PLE_GRADE_COMMENT : GRADE_COMMENT;
  const overallDesc = commentMap[overallGrade] || '—';
  const pAggregate = isP ? primaryAggregate(s, cls, term, year) : null;
  const pDivision = isP ? primaryDivisionFor(pAggregate) : null;

  // Which exam-type columns appear on the report card is entirely the admin's call
  // (Settings → Grading Setup → Assessment weighting). A component that the admin
  // hasn't switched on yet simply doesn't get a column, and grading falls back to
  // whatever component(s) are actually in use — see subjectBreakdown().
  const cfg = examConfig(cls && cls.id);
  const showCW = cfg.cwEnabled;
  const showEOT = cfg.eotEnabled;
  const cwTests = cfg.cwTests || [];
  const useCwTestCols = showCW && cwTests.length>0; // admin has set up named Course Work tests
  const breakdowns = rows.map(r=>subjectBreakdown(s.id, r.subject, term, year));

  // ---- Inline editing (Open Report) ----
  // Inline editing directly on the report card has been switched off entirely — marks
  // are now only ever entered via the dedicated Enter/Download Scores and Mark Sheet
  // screens (which still work exactly as before). This just stops the report card
  // itself from rendering editable <input> boxes for anyone, admin included; canEditScore
  // below still short-circuits to false for every call since it all flows through this.
  const editableNow = false;
  function assignmentFor(subject, paper){
    const asns = DB.assignments.filter(a=>a.subject===subject && a.classId===cls.id);
    if(!asns.length) return null;
    if(paper==null) return asns[0];
    return asns.find(a=>Array.isArray(a.papers) && a.papers.some(p=>String(p)===String(paper))) || asns[0];
  }
  function canEditScore(subject, paper, kind){
    if(!editableNow) return false;
    if(CUR.role==='admin') return true;
    const asn = assignmentFor(subject, paper);
    if(!asn || asn.teacherUsername!==CUR.username) return false;
    if(teacherLockedByDeadline(CUR.username, kind)) return false;
    return true;
  }
  // Initials of whichever teacher is actually assigned to this subject/paper (per the
  // Assignments list), regardless of who entered the marks. Paper-aware via
  // assignmentFor, so it still varies correctly when a subject has one teacher per
  // paper — this is the fallback used when the marks were entered by an admin rather
  // than by a teacher (see paperTeacherInit).
  function assignedTeacherInit(subject, paper){
    const asn = assignmentFor(subject, paper);
    if(!asn) return null;
    const acc = DB.accounts.find(a=>a.username===asn.teacherUsername);
    return acc ? initials(acc.name) : null;
  }
  function scoreInputHtml(subject, paper, kind, label, max, current, width){
    return `<input type="number" min="0" max="${max}" step="0.5" value="${current===null||current===undefined?'':esc(current)}" `+
      `style="width:${width||54}px;padding:3px 4px;font-size:12px;text-align:center;" `+
      `data-student="${esc(s.id)}" data-subject="${esc(subject)}" data-paper="${paper==null?'':esc(String(paper))}" `+
      `data-kind="${esc(kind)}" data-label="${esc(label||'')}" data-max="${esc(max)}" `+
      `onchange="inlineSaveReportScore(this)" title="Leave blank to mark as absent (X)">`;
  }

  // Builds the Course Work cell(s) for one physical row (either the whole subject, when
  // it has a single paper, or one paper's sub-row): the raw mark for each admin-defined
  // test plus, in the last sub-column, the scaled average actually used for grading.
  function cwCellsFor(paper, avgVal){
    if(!showCW) return '';
    const avgTxt = (avgVal===null || avgVal===undefined) ? '-' : avgVal.toFixed(1);
    if(!useCwTestCols) return `<td>${avgTxt}</td>`;
    const testTds = cwTests.map(t=>{
      const row = cwTestScore(s.id, r_subject, t.name, paper, term, year);
      if(canEditScore(r_subject, paper, 'AOI')){
        return `<td>${scoreInputHtml(r_subject, paper, 'AOI', t.name, t.max, row?row.marks:null)}</td>`;
      }
      return `<td>${row? esc(row.marks) : '—'}</td>`;
    }).join('');
    return testTds + `<td>${avgTxt}</td>`;
  }
  let r_subject = ''; // set per-iteration below so cwCellsFor can see the current subject
  // Every physical row's own "Paper Avg" value gets collected here as it's built, so
  // the TOTAL row's Paper Avg column can show the real average of everything that
  // column contains on the card — instead of a hardcoded dash — and so that number
  // is the same figure the TOTAL row's Final Average is in turn built from, exactly
  // mirroring how each subject's own Final Average is the average of its Paper Avg
  // cell(s) above it.
  const allPaperFinals = [];

  const rowsHtml = rows.map((r,i)=>{
    r_subject = r.subject;
    const bd = breakdowns[i];
    const descriptor = r.avg===null ? '—' : (commentMap[r.grade] || '—');
    // Multi-paper subject (e.g. Paper 1 & Paper 2 of the same subject): show a row per
    // paper, but only for papers that actually have a score entered so far — a paper
    // with nothing on record yet simply doesn't get a row at all. The subject name,
    // final average, grade, points and descriptor always come from the combined average
    // (never from a single paper), so those columns are merged (rowspan) down across
    // every sub-row — only the Papers, Course Work, End of Term, Paper Avg and Teacher
    // Initials columns carry a value on every physical row.
    const pb = subjectPaperBreakdown(s.id, r.subject, cls, term, year);
    const papersList = subjectPapersFor(r.subject, cls);
    const enteredPapers = pb ? pb.papers.filter(p=>p.hasAny) : [];
    // Only split into per-paper rows once at least one paper actually has a score on
    // record — until then (or for a single-paper subject) it stays one combined row.
    const useSubrows = enteredPapers.length>0;
    const paperRows = useSubrows ? enteredPapers : [{paper:null, aoiAvg:bd.aoiAvg, eotAvg:bd.eotAvg}];
    const spanCount = paperRows.length;

    return paperRows.map((p, idx)=>{
      const paperForLookup = useSubrows ? p.paper : (papersList.length===1 ? papersList[0] : null);
      const teacherInit = paperTeacherInit(s.id, r.subject, paperForLookup, term, year) || assignedTeacherInit(r.subject, paperForLookup) || r.teacherInit;
      const initTxt = (!teacherInit || teacherInit==='--') ? '&nbsp;' : esc(teacherInit);
      // Primary has no concept of papers (single, unlabeled paper per subject), so the
      // Papers column/cell is omitted entirely on Primary report cards — see isP checks
      // around this cell and in the header row.
      const papersTxt = useSubrows ? esc(String(p.paper)) : (papersList.length===1 ? esc(String(papersList[0])) : '—');
      const papersTd = isP ? '' : `<td>${papersTxt}</td>`;
      const cwHtml = cwCellsFor(paperForLookup, p.aoiAvg);
      let eotHtml = '';
      if(showEOT){
        if(canEditScore(r.subject, paperForLookup, 'EOT')){
          const eotRow = rawScores(s.id, r.subject, term, year).find(rr=>rr.kind==='EOT' && String(rr.paper)===String(paperForLookup) && !rr.label);
          // A fresh entry (no eotRow yet) must default its max to the admin's configured
          // End of Term scale (cfg.eotPercent, e.g. 80) — the same number shown in the
          // column header "(/80)" — never a hardcoded 100. Falling back to 100 here used
          // to silently record the mark as "out of 100" and then rescale it down (e.g.
          // 55 became 44 once scaled onto /80), throwing off Paper Avg and Final Average.
          eotHtml = `<td>${scoreInputHtml(r.subject, paperForLookup, 'EOT', '', (eotRow&&eotRow.max)?eotRow.max:cfg.eotPercent, eotRow?eotRow.marks:null)}</td>`;
        } else {
          eotHtml = `<td>${(p.eotAvg===null||p.eotAvg===undefined)?'-':p.eotAvg.toFixed(1)}</td>`;
        }
      }
      // This paper's own average out of 100 (Course Work + End of Term, or whichever one
      // is on record scaled up to 100 if the other is missing) via the single shared
      // combinePaper() helper — the exact same math used for the subject's overall Final
      // Average, so this column and Final Average always agree. Shown for single-paper
      // subjects too (paperRows has one entry in that case), not just multi-paper ones.
      const paperFinal = combinePaper(p.aoiAvg, p.eotAvg, cfg);
      if(paperFinal!==null) allPaperFinals.push(paperFinal);
      const paperFinalHtml = `<td>${paperFinal===null?'—':paperFinal.toFixed(1)}</td>`;
      // Cells that apply to the WHOLE subject (Subject name, Final Average, Grade,
      // Points, Descriptor) rather than one paper are visually merged down across every
      // paper sub-row. On screen and in the browser Print dialog that's just a normal
      // <td rowspan>. BUT for the copy of the card that html2canvas screenshots (embedded
      // === true, used by both the single and bulk PDF downloads), rowspan cells that
      // span rows of unequal height are exactly what triggers html2canvas's long-standing
      // text-doubling/smearing bug (the CSS spec itself leaves border-collapse+rowspan
      // undefined, and html2canvas's own row-by-row paint loop mishandles it) — switching
      // the table to border-collapse:separate alone wasn't enough, since the bug is in how
      // html2canvas positions the cell's TEXT across rows, not just its borders. So in
      // embedded mode we sidestep rowspan entirely: put the value in the first paper row
      // only, leave a plain blank cell (no rowspan) on the rows below it, and hide the
      // seam between them with a border/background trick (see .mrg-top/.mrg-bot below) so
      // it still reads as one merged cell — html2canvas then never has to paint a single
      // cell's text across more than one physical row, because there no longer is one.
      const mergedTd = (content)=>{
        if(spanCount===1) return `<td>${content}</td>`;
        if(!embedded) return idx===0 ? `<td rowspan="${spanCount}">${content}</td>` : '';
        if(idx===0) return `<td class="mrg-top">${content}</td>`;
        return `<td class="mrg-bot">&nbsp;</td>`;
      };
      if(idx===0){
        return `<tr>`+
          mergedTd(esc(r.subject))+
          `${papersTd}${cwHtml}${eotHtml}${paperFinalHtml}`+
          mergedTd(r.avg===null?'-':r.avg.toFixed(1))+
          mergedTd(r.grade? esc(gradeDisplay(r.subject, r.grade, cls.level)) : '-')+
          (isA?mergedTd(r.avg===null?0:r.pts):'')+
          mergedTd(esc(descriptor))+
          `<td>${initTxt}</td></tr>`;
      }
      return `<tr class="subrow">`+
        mergedTd(esc(r.subject))+
        `${papersTd}${cwHtml}${eotHtml}${paperFinalHtml}`+
        mergedTd(r.avg===null?'-':r.avg.toFixed(1))+
        mergedTd(r.grade? esc(gradeDisplay(r.subject, r.grade, cls.level)) : '-')+
        (isA?mergedTd(r.avg===null?0:r.pts):'')+
        mergedTd(esc(descriptor))+
        `<td>${initTxt}</td></tr>`;
    }).join('');
  }).join('');

  // TOTAL / OVERALL row: filled in fully from the actual marks/comments in each column
  // — the average Course Work mark, average End of Term mark, the class-wide final
  // average/points, an overall grade and descriptor derived from that average — for
  // every level, A-Level included. Only Teacher Initials is left blank (initials don't
  // aggregate across subjects). Individual test sub-columns don't sum across subjects,
  // so they're left blank in this row — only the overall Course Work average is shown.
  const cwVals = breakdowns.map(b=>b.aoiAvg).filter(v=>v!==null);
  const eotVals = breakdowns.map(b=>b.eotAvg).filter(v=>v!==null);
  const cwTotalTxt = cwVals.length ? (cwVals.reduce((a,b)=>a+b,0)/cwVals.length).toFixed(1) : '—';
  const eotTotalTxt = eotVals.length ? (eotVals.reduce((a,b)=>a+b,0)/eotVals.length).toFixed(1) : '—';
  // Paper Avg column, TOTAL row: the average of every Paper Avg value shown above it
  // on the card — the same underlying figures that each subject's own Final Average
  // is built from — so this cell is a real, traceable number rather than a dash, and
  // so "Paper Avg" here means exactly what "Paper Avg" means in every row above it.
  const totalPaperAvgTxt = allPaperFinals.length ? (allPaperFinals.reduce((a,b)=>a+b,0)/allPaperFinals.length).toFixed(1) : '—';
  const totalGrade = rows.length ? (gradeFor('', avgPct, cls.level) || '—') : '—';
  const totalDescriptor = rows.length ? (commentMap[totalGrade] || '—') : '—';
  // Final Average column, TOTAL row: this column is a percentage (see header "Final
  // Average (%)"), same as every subject row above it (r.avg.toFixed(1)) — it must NOT
  // repeat the Points total for A-Level, since Points already gets its own column right
  // next to this one. Uses avgPct (the average of every subject's own Final Average) so
  // it's the true average, not points-in-disguise. O-Level/Primary formatting (with the
  // trailing %) is unchanged.
  const totalFinalTxt = isA ? avgPct.toFixed(1) : avgPct.toFixed(0)+'%';
  const totalCwHtml = showCW ? (useCwTestCols ? cwTests.map(()=>'<td>—</td>').join('') + `<td>${cwTotalTxt}</td>` : `<td>${cwTotalTxt}</td>`) : '';

  const classTeacherAcc = DB.accounts.find(a=>a.username===cls.classTeacher);
  const ctName = classTeacherAcc? classTeacherAcc.name : '';
  const htName = DB.info.headteacher || '';

  const yearLbl = esc(String(year||''));
  const termLbl = esc(term||'—');

  const periodPicker = (!embedded && periods.length>0) ? `
  <div class="card" style="margin-bottom:10px;">
    <label style="margin-bottom:4px;display:block;">Viewing period</label>
    <select onchange="viewReportPeriod('${s.id}', this.value)">
      ${periods.map(p=>`<option value="${esc(p.term)}||${p.year}" ${(p.term===term && Number(p.year)===Number(year))?'selected':''}>${esc(p.term)}, ${p.year}${(p.term===DB.info.currentTerm && Number(p.year)===Number(DB.info.currentYear))?' (current)':''}</option>`).join('')}
    </select>
    ${!isCurrentPeriod?'<p class="small" style="color:var(--danger);margin-top:6px;">You are viewing an earlier term — not the current one.</p>':''}
  </div>` : '';

  const editNote = editableNow ? `
  <div class="note" style="margin-bottom:10px;">✏️ You can type marks straight into the table below — they save as soon as you tab or click out of the box. Leave a box blank and save to mark that student absent (X); an absent student is still averaged normally on their other subjects.</div>` : '';

  return `
  ${periodPicker}
  ${embedded? '' : `<div class="flex" style="margin-bottom:10px;">${CUR.role==='admin'?'<button class="btn" onclick="window.print()"><b>Print this report card</b></button>':''}
  <button class="btn-outline" data-action="nav:${CUR.role==='parent'?'pdash':(CUR.role==='teacher'?'treports':'reports')}">${CUR.role==='parent'?'Back to My Child':'Back to list'}</button></div>`}
  ${editNote}
  <div id="printArea"><div class="rc-card">
    ${DB.info.logo?`<img src="${DB.info.logo}" class="rc-watermark" alt="">`:''}
    <div class="rc-content">
    <div class="rc-topline"><span>${s.feesCode?`FEES CODE: ${esc(s.feesCode)}`:''}</span><span>Printed ${fmtDate(Date.now())}</span></div>

    <div class="rc-title-block">
      ${DB.info.logo?`<img src="${DB.info.logo}" class="rc-logo">`:''}
      <div class="rc-header-text">
        <div class="school">${esc(DB.info.schoolName)}</div>
        <div class="subtitle">Student Academic Report Card — ${isA?'A Level':(isP?'Primary':'O Level')}</div>
        <div class="meta">Academic Year: ${yearLbl}${DB.info.address?' &nbsp;|&nbsp; '+esc(DB.info.address):''}</div>
        ${(DB.info.phone||DB.info.email)?`<div class="meta">${[DB.info.phone?'Tel: '+esc(DB.info.phone):'', DB.info.email?'Email: '+esc(DB.info.email):''].filter(Boolean).join(' &nbsp;|&nbsp; ')}</div>`:''}
      </div>
    </div>

    <table class="rc-info-table">
      <tr>
        <td class="lbl">Name</td><td class="val">${esc(s.name)}</td>
        <td class="lbl">Class</td><td class="val">${esc(cls.name)}${cls.stream?(' '+esc(cls.stream)):''}</td>
        ${s.photo?`<td class="photo-cell" rowspan="3"><img src="${s.photo}" class="rc-bio-photo"></td>`:''}
      </tr>
      <tr>
        <td class="lbl">Term</td><td class="val">${termLbl}, ${yearLbl}</td>
        <td class="lbl">Sex</td><td class="val">${esc(s.gender||'—')}</td>
      </tr>
      <tr>
        <td class="lbl">${isA?'Combination':(isP?'Fees Pay Code':'Optional Subjects')}</td><td class="val">${isP?(s.feesCode?esc(s.feesCode):'—'):esc(comboLabel(s,cls))}</td>
        <td class="lbl">Admission No</td><td class="val">${esc(s.admNo||'—')}</td>
      </tr>
    </table>

    <div class="rc-section-title">Academic Performance Analysis</div>
    <div class="rc-perf-wrap">
    <table class="rc-perf">
      ${useCwTestCols ? `
      <tr>
        <th rowspan="2">Subjects</th>${isP?'':'<th rowspan="2">Papers</th>'}
        <th colspan="${cwTests.length+1}">${esc(cfg.cwLabel)}</th>
        ${showEOT?`<th rowspan="2">${esc(cfg.eotLabel)} (/${cfg.eotPercent})</th>`:''}
        <th rowspan="2">Paper Avg (%)</th>
        <th rowspan="2">Final Average (%)</th><th rowspan="2">Grade</th>${isA?'<th rowspan="2">Points</th>':''}<th rowspan="2">Descriptor</th><th rowspan="2">Teacher Initials</th>
      </tr>
      <tr>${cwTests.map(t=>`<th>${esc(t.name)} (/${t.max})</th>`).join('')}<th>Avg (/${cfg.cwPercent})</th></tr>` : `
      <tr><th>Subjects</th>${isP?'':'<th>Papers</th>'}${showCW?`<th>${esc(cfg.cwLabel)} (/${cfg.cwPercent})</th>`:''}${showEOT?`<th>${esc(cfg.eotLabel)} (/${cfg.eotPercent})</th>`:''}<th>Paper Avg (%)</th><th>Final Average (%)</th><th>Grade</th>${isA?'<th>Points</th>':''}<th>Descriptor</th><th>Teacher Initials</th></tr>`}
      ${rowsHtml}
      <tr class="total"><td colspan="${isP?1:2}">TOTAL / OVERALL</td>${totalCwHtml}${showEOT?`<td>${eotTotalTxt}</td>`:''}<td>${totalPaperAvgTxt}</td><td>${totalFinalTxt}</td><td>${totalGrade}</td>${isA?`<td>${totalPoints}</td>`:''}<td>${totalDescriptor}</td><td>—</td></tr>
    </table>
    </div>

    <div class="rc-section-title">Performance Summary</div>
    <table class="rc-summary-table">
      <tr>
        <td class="lbl">Total Subjects</td><td class="val">${rows.length}</td>
        <td class="lbl">${isA?'Total Points':'Total Final Average'}</td><td class="val">${isA?`${totalPoints}/${maxP}`:avgPct.toFixed(0)+'%'}</td>
        <td class="lbl">${isP?'Total Aggregates':'Overall Grade'}</td><td class="val">${isP?(pAggregate!==null?pAggregate:'—'):(overallGrade||'—')}</td>
      </tr>
      <tr>
        <td class="lbl">${isP?'Division':'Level'}</td><td class="val">${isP?(pDivision||'—'):(overallDesc||'—')}</td>
        <td class="lbl">${termLbl} Position</td><td class="val">${position} / ${size}</td>
        ${isP
          ? `<td class="lbl">Previous Position</td><td class="val">${prevPosition?`${prevPosition.position} / ${prevPosition.size} (${esc(prevPeriod.term)}, ${esc(String(prevPeriod.year))})`:'—'}</td>`
          : `<td class="lbl">Weak Subject${weakSubjects && weakSubjects.length>1?'s':''}</td><td class="val">${weakSubjects && weakSubjects.length?esc(weakSubjects.join(', ')):'—'}</td>`}
      </tr>
    </table>

    <div class="rc-section-title">Comments</div>
    <table class="rc-comments-table">
      <tr><th>Class Teacher's Comment</th><th>Head Teacher's Comment</th></tr>
      <tr>
        <td>${isP ? esc(primaryRemark(pDivision,'class')) : esc(overallRemark(pct,'class'))}</td>
        <td>${isP ? esc(primaryRemark(pDivision,'head')) : esc(overallRemark(pct,'head'))}</td>
      </tr>
    </table>

    <div class="rc-sign-row">
      <span>Class Teacher: ${esc(ctName)}</span>
      <span>Signature:</span>
      <span>Head Teacher: ${esc(htName)}</span>
      <span>School Stamp:</span>
    </div>

    <div class="rc-termdates">Term ended on: ${fmtDate(DB.info.termEndDate)} &nbsp;|&nbsp; Next term begins on: ${fmtDate(DB.info.nextTermBeginDate)}</div>

    ${DB.info.motto?`<div class="rc-motto">"${esc(DB.info.motto)}"</div>`:''}

    <div class="legend-strip">
      <span>Fees balance: ${s.feesBalance!=null?('UGX '+Number(s.feesBalance).toLocaleString()):'—'} · Next term fees: ${s.nextTermFees!=null?('UGX '+Number(s.nextTermFees).toLocaleString()):'—'}</span>
    </div>
    <div class="rc-scoring-note">All assessments are first converted to a percentage before being averaged into the Paper Average and Final Average.</div>
    </div>
  </div></div>`;
}

// Saves one mark typed straight into an open report card (see editableNow/canEditScore
// inside reportCardHTML). Mirrors the same upsert logic as the regular mark-sheet
// "saveScores" submit — one score row per student+subject+paper+kind(+label) — so both
// entry points stay consistent. An emptied box deletes that row instead of writing a
// zero, which is what makes the student show as absent (X) and drop out of the average
// for that column while everything else about them still averages normally.
async function inlineSaveReportScore(el){
  const studentId = el.dataset.student, subject = el.dataset.subject, kind = el.dataset.kind, label = el.dataset.label||'';
  const paper = el.dataset.paper===''? null : el.dataset.paper;
  const max = Math.max(1, Number(el.dataset.max)||100);
  const term = DB.info.currentTerm, year = DB.info.currentYear;
  const valRaw = el.value.trim();
  try{
    const existing = DB.scores.find(sc=>sc.studentId===studentId && sc.subject===subject && String(sc.paper)===String(paper)
      && sc.kind===kind && (sc.label||'')===label && sc.term===term && sc.year===year);
    let savePromise = null;
    if(valRaw===''){
      if(existing){ savePromise = deleteScores([existing]); }
    } else {
      const num = Number(valRaw);
      if(!isFinite(num) || num<0 || num>max){
        alert(`That mark must be between 0 and ${max}.`);
        el.value = existing ? existing.marks : '';
        return;
      }
      const row = {id: existing?existing.id:uid('sc'), studentId, subject, paper, kind, label, term, year, marks:num, max, teacher:CUR.username};
      savePromise = upsertScores([row]);
    }
    // upsertScores/deleteScores update DB.scores synchronously before their
    // network write even starts, so the report card can be re-rendered right
    // now — no waiting on the network, no matter how many other teachers are
    // saving marks at the same moment. The write itself keeps going safely in
    // the background (see mergeScoreShard); we only need to hear back if it
    // ultimately fails, so nothing is silently lost.
    document.getElementById('app').innerHTML = renderShellWithContent(reportCardHTML(studentId,false));
    const root = document.getElementById('mainArea'); if(root) fitOnePage(root);
    if(savePromise){
      savePromise.catch(err=>{ console.error(err); alert('Could not save that mark — check your internet connection and try again.'); });
    }
  }catch(err){
    console.error(err); alert('Could not save that mark — please try again.');
  }
}

/* ============================================================
   11. ACTIONS
   ============================================================ */
document.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  e.preventDefault();
  const _raw = el.dataset.action;
  const _sep = _raw.indexOf(':');
  const action = _sep===-1 ? _raw : _raw.slice(0,_sep);
  const arg = _sep===-1 ? undefined : _raw.slice(_sep+1);
  // Every click invalidates any previous screen's pending background refresh
  // (see 'nav'/'viewReport' below) — whatever the user is looking at now wins.
  const myNavToken = ++NAV_TOKEN;
  // Backstop: these actions edit student/teacher bio data, accounts, subject
  // assignments, or grading config — Admin only, no matter how they're triggered.
  const ADMIN_ONLY_ACTIONS = new Set(['delAssign','delClass','delOSubject','delPSubject','delStudent','closeAcc','reopenAcc',
    'resetAccPw','approveAcc','rejectAcc','editTeacherProfile','editStudentProfile','editClass','delCwTest','delClassCwTest','delAcc','reopenScoreDeadline','lockScoreDeadline','reopenAllScoreDeadline','restoreAutoSnapshot',
    'markStudentLeft','restoreStudent','delOldStudentNow']);
  if(ADMIN_ONLY_ACTIONS.has(action) && (!CUR || CUR.role!=='admin')){
    alert('Only an Admin can do that.'); return;
  }
  switch(action){
    case 'gotoCreateSchool': AUTH_VIEW='createSchool'; render(); break;
    case 'gotoTeacherSignup': AUTH_VIEW='signupTeacher'; render(); break;
    case 'gotoParentSignup': AUTH_VIEW='signupParent'; render(); break;
    case 'gotoFounderLogin': AUTH_VIEW='founderLogin'; render(); break;
    case 'gotoFounderRecovery': AUTH_VIEW='founderRecovery'; render(); break;
    case 'gotoSchoolRecovery': AUTH_VIEW='schoolRecovery'; render(); break;
    case 'gotoLogin': AUTH_VIEW='login'; render(); break;
    case 'retryConnection': await loadAll(); render(); break;
    case 'setRole': loginRole = arg; render(); break;
    case 'logout': {
      const wasFounder = CUR && CUR.role==='founder';
      CUR=null; SCHOOL_ID=null; await setPersonal('session', null);
      // Burn the token so any other device/browser holding the old founder
      // session (or someone who copied it out of localStorage) is kicked out too.
      if(wasFounder && SYSTEM_OWNER){ SYSTEM_OWNER.sessionToken = genSessionToken(); await saveSystemOwner(); }
      render(); break;
    }
    case 'nav': {
      VIEW = {name:arg, params:{}};
      // Render immediately with whatever's already in memory — DB.scores is
      // kept fresh locally on every save via upsertScores/deleteScores, so
      // it's rarely more than a few minutes stale. Waiting on a network round
      // trip before showing the screen at all was the main cause of navigation
      // feeling slow. Instead, catch up on anything another teacher/tab saved
      // in the background and only re-render if the user is still on this
      // same screen when it lands (myNavToken guards against a stale refresh
      // overwriting a screen they've since navigated away from).
      render();
      if(['reports','treports','pdash','preport','marksheets','ascores','tscores','classanalysis','mastermarksheet'].includes(arg)){
        refreshScores().then(()=>{ if(NAV_TOKEN===myNavToken) render(); }).catch(e=>console.error(e));
      }
      break;
    }
    case 'editTeacherProfile': VIEW = {name:'teacherprofile', params:{username:arg}}; render(); break;
    case 'editStudentProfile': VIEW = {name:'studentprofile', params:{studentId:arg}}; render(); break;
    case 'editClass': VIEW = {name:'classedit', params:{classId:arg}}; render(); break;
    case 'viewReport': {
      if(CUR.role==='parent' && arg!==CUR.studentId){ alert("You can only view your own child's report card."); break; }
      document.getElementById('app').innerHTML = renderShellWithContent(reportCardHTML(arg,false));
      const root = document.getElementById('mainArea'); if(root) fitOnePage(root);
      refreshScores().then(()=>{
        if(NAV_TOKEN!==myNavToken) return; // user has since navigated elsewhere
        document.getElementById('app').innerHTML = renderShellWithContent(reportCardHTML(arg,false));
        const root2 = document.getElementById('mainArea'); if(root2) fitOnePage(root2);
      }).catch(e=>console.error(e));
      break;
    }
    case 'printReport': {
      if(CUR.role!=='admin'){ alert('Only an Admin can print report cards.'); break; }
      document.getElementById('app').innerHTML = renderShellWithContent(reportCardHTML(arg,false));
      const root2 = document.getElementById('mainArea'); if(root2) fitOnePage(root2);
      setTimeout(()=>window.print(), 150);
      break;
    }
    case 'singlePdf': {
      if(CUR.role!=='admin'){ alert('Only an Admin can download report cards.'); break; }
      // Instant visual feedback on the tap itself (and a guard against a second tap
      // firing a second, overlapping render while the first PDF is still being built).
      if(el.disabled) break;
      const _origLbl = el.innerHTML; el.disabled = true; el.innerHTML = '<b>Preparing…</b>';
      try{ await singleStudentPdf(arg); }
      finally{ el.disabled = false; el.innerHTML = _origLbl; }
      break;
    }
    case 'delClass': DB.classes = DB.classes.filter(c=>c.id!==arg); await saveClasses(); render(); break;
    case 'delStudent': {
      const s = DB.students.find(x=>x.id===arg);
      DB.students = DB.students.filter(x=>x.id!==arg);
      await saveStudents();
      if(s && s.photo) await deletePhotoFromStorage(s.photo); // remove their stored photo too — nothing left behind
      render(); break;
    }
    case 'markStudentLeft': {
      const s = DB.students.find(x=>x.id===arg);
      if(!s){ break; }
      if(!confirm(`Mark ${s.name} as left/completed? They'll move to Old Students and be kept there for two terms, after which their record is permanently deleted.`)) break;
      s.status = 'left';
      s.leftTerm = DB.info.currentTerm;
      s.leftYear = DB.info.currentYear;
      await saveStudents(); render(); break;
    }
    case 'restoreStudent': {
      const s = DB.students.find(x=>x.id===arg);
      if(!s){ break; }
      s.status = 'active';
      delete s.leftTerm; delete s.leftYear;
      await saveStudents(); render(); break;
    }
    case 'delOldStudentNow': {
      const s = DB.students.find(x=>x.id===arg);
      if(!s){ break; }
      if(!confirm(`Permanently delete ${s.name}'s record now, including their scores? This cannot be undone.`)) break;
      DB.students = DB.students.filter(x=>x.id!==arg);
      DB.scores = DB.scores.filter(sc=>sc.studentId!==arg);
      DB.accounts.forEach(a=>{ if(a.role==='parent' && a.studentId===arg) a.studentId=null; });
      await Promise.all([saveStudents(), saveScores(), saveAccounts()]);
      if(s.photo) await deletePhotoFromStorage(s.photo);
      render(); break;
    }
    case 'delAssign': DB.assignments = DB.assignments.filter(a=>a.id!==arg); await saveAssignments(); render(); break;
    case 'delOSubject': {
      const name = decodeURIComponent(arg);
      DB.info.oExtraSubjects = (DB.info.oExtraSubjects||[]).filter(s=>s!==name);
      if(Array.isArray(DB.info.oCompulsoryLower)) DB.info.oCompulsoryLower = DB.info.oCompulsoryLower.filter(s=>s!==name);
      if(Array.isArray(DB.info.oCompulsoryUpper)) DB.info.oCompulsoryUpper = DB.info.oCompulsoryUpper.filter(s=>s!==name);
      await saveInfo(); render(); break;
    }
    case 'delPSubject': {
      const name = decodeURIComponent(arg);
      DB.info.pExtraSubjects = (DB.info.pExtraSubjects||[]).filter(s=>s!==name);
      await saveInfo(); render(); break;
    }
    case 'delASubject': {
      const name = decodeURIComponent(arg);
      DB.info.aExtraSubjects = (DB.info.aExtraSubjects||[]).filter(s=>s!==name);
      await saveInfo(); render(); break;
    }
    case 'reopenScoreDeadline': {
      const [kind, username] = arg.split(':');
      const sd = {...(DB.info.scoreDeadlines||{})};
      const cur = sd[kind] || {deadline:null, reopenedFor:[]};
      const list = new Set(cur.reopenedFor||[]);
      list.add(username);
      sd[kind] = {...cur, reopenedFor:[...list]};
      DB.info.scoreDeadlines = sd;
      await saveInfo(); showDeliveredToast('Reopened for this teacher'); render(); break;
    }
    case 'lockScoreDeadline': {
      const [kind, username] = arg.split(':');
      const sd = {...(DB.info.scoreDeadlines||{})};
      const cur = sd[kind] || {deadline:null, reopenedFor:[]};
      sd[kind] = {...cur, reopenedFor:(cur.reopenedFor||[]).filter(u=>u!==username)};
      DB.info.scoreDeadlines = sd;
      await saveInfo(); showDeliveredToast('Locked again'); render(); break;
    }
    case 'reopenAllScoreDeadline': {
      const kind = arg;
      const sd = {...(DB.info.scoreDeadlines||{})};
      const cur = sd[kind] || {deadline:null, reopenedFor:[]};
      const allUsernames = DB.accounts.filter(a=>a.role==='teacher').map(t=>t.username);
      sd[kind] = {...cur, reopenedFor: allUsernames};
      DB.info.scoreDeadlines = sd;
      await saveInfo(); showDeliveredToast('Reopened for all teachers'); render(); break;

/* ---------- Bulk students: read a Word (.docx) class list ---------- */
async function loadStudentListFromWord(input){
  const status = document.getElementById('bulkWordStatus');
  const ta = document.getElementById('bulkListArea');
  const file = input.files && input.files[0];
  if(!file) return;
  if(status) status.textContent = 'Reading document…';
  try{
    await loadMammothLib();
    const arrayBuffer = await file.arrayBuffer();
    const result = await mammoth.convertToHtml({arrayBuffer});
    const parsed = new DOMParser().parseFromString(result.value, 'text/html');
    let lines = [];
    const tables = parsed.querySelectorAll('table');
    if(tables.length){
      tables.forEach(table=>{
        table.querySelectorAll('tr').forEach(tr=>{
          const cells = Array.from(tr.querySelectorAll('td,th')).map(td=>td.textContent.replace(/\s+/g,' ').trim());
          if(!cells.length || cells.every(c=>c==='')) return;
          const joined = cells.join(' ').toLowerCase();
          if(joined.includes('name') && (joined.includes('sex') || joined.includes('gender') || joined.includes('admission'))) return; // header row
          lines.push(cells.join('\t'));
        });
      });
    } else {
      parsed.querySelectorAll('p, li').forEach(p=>{
        const t = p.textContent.replace(/\s+/g,' ').trim();
        if(t) lines.push(t);
      });
    }
    lines = lines.filter(l=> l && l.replace(/[\t,]/g,'').trim()!=='');
    if(!lines.length){
      if(status) status.textContent = 'No student rows were found in that document. Use a table (or one "Name, Sex" line per student) and try again.';
    } else {
      if(ta){
        const existing = ta.value.trim();
        ta.value = existing ? existing + '\n' + lines.join('\n') : lines.join('\n');
      }
      if(status) status.textContent = `Loaded ${lines.length} student row(s) from the document into the list below — check them, then click "Submit — add all students".`;
    }
  }catch(err){
    console.error(err);
    if(status) status.textContent = 'Could not read that Word document: ' + err.message;
  }finally{
    input.value = '';
  }
}

// Re-populates the "Assessment type" section of the score-entry picker form (AOI/EOT
// labels, the Course Work test dropdown, and the suggested max score) to match the
// exam config that actually applies to a given class — the school-wide default, or
// that class's own override if the admin has set one under Grading Setup.
function refreshAssessmentTypeUI(form, classId){
  const cfg = examConfig(classId);
  const kindSel = form.querySelector('#kindSel');
  if(kindSel && kindSel.options.length>=2){
    kindSel.options[0].textContent = `${cfg.cwLabel} (continuous assessment test)`;
    kindSel.options[1].textContent = cfg.eotLabel;
  }
  const labelWrap = form.querySelector('#labelWrap');
  if(labelWrap){
    labelWrap.innerHTML = cfg.cwTests.length ? `
      <label>${esc(cfg.cwLabel)} test</label>
      <select name="label" id="cwTestSel">
        ${cfg.cwTests.map(t=>`<option value="${esc(t.name)}" data-max="${t.max}">${esc(t.name)} (out of ${t.max})</option>`).join('')}
      </select>` : `
      <input type="hidden" name="label" value="${esc(cfg.cwLabel)}">
      ${CUR.role==='admin' ? `<label>${esc(cfg.cwLabel)}</label>
      <p class="small" style="margin-top:6px;">No named ${esc(cfg.cwLabel)} tests yet — add one under Settings → Grading Setup if you want separate columns (e.g. Test 1, Test 2). Until then, scores are recorded under a single "${esc(cfg.cwLabel)}" bucket.</p>` : ''}`;
    labelWrap.style.display = (kindSel && kindSel.value==='EOT') ? 'none' : 'block';
  }
  // The maximum-mark field is compulsory and must be typed in fresh by the teacher
  // every time — it is never pre-filled, even when the newly-selected class has a
  // named test with a known max, so it's cleared here rather than populated.
  const maxInput = form.querySelector('#maxScoreInput');
  if(maxInput) maxInput.value = '';
}
