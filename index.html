// Builds the same shape as a manual/founder backup file, for whichever school is
// currently loaded.
function currentSchoolBackupPayload(exportedBy){
  return {
    app:'CT-E SOLUTIONS backup', schemaVersion: BACKUP_SCHEMA_VERSION, schoolId: SCHOOL_ID,
    exportedAt: new Date().toISOString(), exportedBy: exportedBy||'auto-snapshot',
    info: DB.info, accounts: DB.accounts, classes: DB.classes, students: DB.students,
    assignments: DB.assignments, scores: DB.scores, bands: DB.bands, obands: DB.obands, pbands: DB.pbands
  };
}
// Actually takes a snapshot right now and stores it, trimming anything beyond
// AUTO_SNAPSHOT_KEEP (deleting the dropped snapshots' data too, not just the index entry).
async function takeAutoSnapshotNow(){
  if(!SCHOOL_ID || !DB.info) return null;
  const ts = Date.now();
  const data = currentSchoolBackupPayload('auto-snapshot');
  await setShared(`sch_${SCHOOL_ID}_autosnap_${ts}`, data);
  const priorIndex = await getShared(`sch_${SCHOOL_ID}_autosnaps_index`, []);
  const merged = [{ts, takenAt: data.exportedAt}, ...priorIndex];
  const kept = merged.slice(0, AUTO_SNAPSHOT_KEEP);
  const dropped = merged.slice(AUTO_SNAPSHOT_KEEP);
  await setShared(`sch_${SCHOOL_ID}_autosnaps_index`, kept);
  await Promise.all(dropped.map(e=>deleteShared(`sch_${SCHOOL_ID}_autosnap_${e.ts}`)));
  DB.autoSnapshots = kept;
  return ts;
}
// Called after a school's data loads. If it's been long enough since the last
// automatic snapshot (or none exists yet), takes one — silently, in the
// background. Marks lastAutoSnapshotAt optimistically before the snapshot
// finishes so two devices loading at the same moment don't both fire.
async function maybeTakeAutoSnapshot(){
  if(!SCHOOL_ID || !DB.info) return;
  const days = daysSince(DB.info.lastAutoSnapshotAt);
  if(DB.info.lastAutoSnapshotAt && days < AUTO_SNAPSHOT_MIN_GAP_DAYS) return;
  DB.info.lastAutoSnapshotAt = new Date().toISOString();
  try{
    await saveInfo();
    await takeAutoSnapshotNow();
    render(); // update the "Backup & Restore" card if it's on screen
  }catch(e){ console.error('Automatic snapshot failed', e); }
}
// Restores the school's current data from one of its own automatic snapshots.
async function restoreAutoSnapshot(ts){
  const raw = await getShared(`sch_${SCHOOL_ID}_autosnap_${ts}`, null);
  if(!raw){ alert('That snapshot could not be found — it may have already been cleaned up.'); return; }
  const data = migrateBackupData(raw);
  const sure = confirm(`This will REPLACE all current school data with the automatic snapshot from ${data.exportedAt?new Date(data.exportedAt).toLocaleString():'that time'}.\n\nStudents in snapshot: ${data.students.length}\nCurrent students: ${DB.students.length}\n\nThis cannot be undone. Continue?`);
  if(!sure) return;
  DB.info = data.info; DB.accounts = data.accounts; DB.classes = data.classes;
  DB.students = data.students; DB.assignments = data.assignments; DB.scores = data.scores;
  DB.bands = data.bands; DB.obands = data.obands; DB.pbands = data.pbands;
  await Promise.all([saveInfo(), saveAccounts(), saveClasses(), saveStudents(), saveAssignments(), saveScores(), saveBands(), saveOBands(), savePBands()]);
  alert('Restore complete.'); render();
}

/* ============================================================
   5. HELPERS
   ============================================================ */
function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9); }

// ---- Founder-account hardening helpers ----
// A real random, unguessable token (not Math.random-based uid()) used to prove
// a *live* login happened. Restoring a session now requires this token to
// match what's on the SYSTEM_OWNER record in the database, so pasting
// {scope:'founder'} into localStorage directly no longer signs anyone in —
// you'd also need the exact current token, which only exists after a real
// password check succeeded and only lives in the DB record + this device.
function genSessionToken(){
  const arr = new Uint8Array(32);
  crypto.getRandomValues(arr);
  return Array.from(arr, b=>b.toString(16).padStart(2,'0')).join('');
}
// Simple client-side brute-force throttle for the founder login form, keyed
// by username so a stolen/guessed username can't just be hammered with
// passwords. Not a substitute for server-side rate limiting (a determined
// attacker can clear localStorage or use another device), but it meaningfully
// slows down casual/scripted guessing in this client-only app, and should be
// paired with Firestore rules and, ideally, a real backend rate limiter.
const FOUNDER_LOCKOUT_KEY = 'cte_founder_login_attempts';
function getFounderLoginState(){
  try{ return JSON.parse(localStorage.getItem(FOUNDER_LOCKOUT_KEY)) || {fails:0, lockUntil:0}; }
  catch(e){ return {fails:0, lockUntil:0}; }
}
function setFounderLoginState(state){
  try{ localStorage.setItem(FOUNDER_LOCKOUT_KEY, JSON.stringify(state)); }catch(e){}
}
function founderLockoutRemainingMs(){
  const st = getFounderLoginState();
  return Math.max(0, st.lockUntil - Date.now());
}
function recordFounderLoginFailure(){
  const st = getFounderLoginState();
  st.fails = (st.fails||0) + 1;
  // Exponential backoff: 5s, 10s, 20s, 40s ... capped at 5 minutes, starting
  // after the 3rd consecutive failure so normal typos aren't punished.
  if(st.fails >= 3){
    const step = st.fails - 2;
    st.lockUntil = Date.now() + Math.min(5*60*1000, 5000*Math.pow(2, step-1));
  }
  setFounderLoginState(st);
}
function clearFounderLoginFailures(){ setFounderLoginState({fails:0, lockUntil:0}); }
function initials(name){ if(!name) return '--'; const parts=name.trim().split(/\s+/); return (parts[0][0]+(parts[1]?parts[1][0]:'')).toUpperCase(); }
function esc(s){ return (s===null||s===undefined?'':s).toString().replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// Shows a brief "delivered" confirmation the instant any Submit button is tapped —
// lives outside #app so it survives the re-render a submit usually triggers.
let _deliveredToastTimer = null;
function showDeliveredToast(text){
  let el = document.getElementById('deliveredToast');
  if(!el){
    el = document.createElement('div');
    el.id = 'deliveredToast';
    document.body.appendChild(el);
  }
  el.innerHTML = `<span class="tick">✓</span><span>${esc(text || 'Submitted — command delivered')}</span>`;
  el.classList.add('show');
  if(_deliveredToastTimer) clearTimeout(_deliveredToastTimer);
  _deliveredToastTimer = setTimeout(()=>{ el.classList.remove('show'); }, 1600);
}
function fmtDate(d){ if(!d) return '—'; try{ return new Date(d).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }catch(e){ return d; } }
function fmtDateTime(d){ if(!d) return '—'; try{ return new Date(d).toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(e){ return d; } }
// ---- Score submission deadline ----
// Admin sets one cutoff for Course Work submissions and a separate one for End of
// Term submissions (kind = 'AOI' or 'EOT') — a class doing CW tests all term but
// exams later needs different cutoffs for each. Either can be cleared any time by
// just leaving that field blank and resubmitting. Once a deadline passes, teachers
// can be reopened individually, or all at once with one click, at the admin's
// discretion. Admins themselves are never blocked by any of this.
function scoreDeadlineFor(kind){
  const sd = (DB.info && DB.info.scoreDeadlines) || {};
  return sd[kind] || {deadline:null, reopenedFor:[]};
}
function scoreDeadlinePassed(kind){
  const d = scoreDeadlineFor(kind).deadline;
  if(!d) return false;
  const t = new Date(d).getTime();
  if(isNaN(t)) return false;
  return Date.now() > t;
}
function teacherLockedByDeadline(username, kind){
  if(!scoreDeadlinePassed(kind)) return false;
  const reopened = scoreDeadlineFor(kind).reopenedFor || [];
  return !reopened.includes(username);
}

function combinationCode(principals){ return principals.map(p=>ABBR[p]||p.slice(0,3).toUpperCase()).join('/'); }

// Assigning subjects is entirely the responsibility of each subject teacher, never the
// admin. Admin registration only ever records a student's name, admission number, sex
// and class — nothing about which subjects they take. The moment a subject teacher opens
// their class for the first time, every student already in that class is available for
// them to tick; only the ones they tick are considered to take that subject, and that
// tick (assignment.studentIds) is the single source of truth used everywhere below.
function rosterSubjectsFor(st, cls){
  if(!cls) return [];
  const subs = new Set();
  DB.assignments.filter(a=>a.classId===cls.id && Array.isArray(a.studentIds) && a.studentIds.includes(st.id))
    .forEach(a=>subs.add(a.subject));
  return [...subs];
}
// Which of a student's ticked subjects count as one of their 3 A-Level principals (as
// opposed to General Paper / the subsidiary, which are compulsory add-ons, not ticked
// choices in the same sense).
function principalsFor(st, cls){
  if(!cls || cls.level!=='A') return [];
  const opts = new Set(aOptionalList());
  return rosterSubjectsFor(st, cls).filter(s=>opts.has(s));
}
function studentSubjects(st, cls){
  if(!cls) return [];
  if(cls.level==='O'){
    const compulsory = oCompulsoryFor(cls.form);
    const extra = rosterSubjectsFor(st, cls).filter(s=>!compulsory.includes(s));
    return [...new Set([...compulsory, ...extra])];
  }
  if(cls.level==='P'){
    const compulsory = pCompulsoryList();
    const extra = rosterSubjectsFor(st, cls).filter(s=>!compulsory.includes(s));
    return [...new Set([...compulsory, ...extra])];
  }
  // A-Level: principals are whichever principal-subject teachers have ticked this
  // student into their own class roster. General Paper is compulsory for every A-Level
  // student. The subsidiary (Maths or Computer) is whichever one a Subsidiary
  // Mathematics or Subsidiary Computer teacher has actually ticked this student into
  // their own roster — there is no automatic guess or automatic resolution of any
  // kind; the teacher decides who takes their subject, same as every other subject.
  // A student with no subsidiary tick yet simply has no subsidiary until a teacher
  // ticks them. A student can only ever do ONE subsidiary — if they end up ticked
  // into BOTH rosters by mistake, that's a genuine conflict (see
  // hasSubsidiaryConflict) and nothing is shown for their subsidiary at all until a
  // human unticks the wrong one; the code deliberately does not guess which one is
  // "right" on anyone's behalf. Admin-added extra compulsory subjects
  // (aCompulsoryExtra) are auto-included the same way, on top of whatever the
  // student's ticked principals already are.
  const principals = principalsFor(st, cls);
  if(!principals.length) return [];
  const roster = rosterSubjectsFor(st, cls);
  const tickedCandidates = SUBSIDIARIES.filter(s=>roster.includes(s));
  const tickedSubsidiary = tickedCandidates.length===1 ? tickedCandidates[0] : null;
  return [...new Set([...principals, 'GENERAL PAPER', ...aCompulsoryExtra(), ...(tickedSubsidiary?[tickedSubsidiary]:[])])];
}
// True only if a student has been ticked into BOTH subsidiary rosters by mistake — an
// admin data-entry conflict that needs manual resolution, since a student can only take
// one subsidiary. Surfaced in the admin UI so it doesn't silently pick one and hide the
// problem — see studentSubjects, which shows nothing for the subsidiary at all while
// this is true, rather than guessing.
function hasSubsidiaryConflict(st, cls){
  if(!cls || cls.level!=='A') return false;
  const roster = rosterSubjectsFor(st, cls);
  return SUBSIDIARIES.filter(s=>roster.includes(s)).length > 1;
}
function comboLabel(st, cls){
  if(!cls) return '—';
  if(cls.level==='O' || cls.level==='P'){
    const compulsory = cls.level==='O' ? oCompulsoryFor(cls.form) : pCompulsoryList();
    const extra = rosterSubjectsFor(st, cls).filter(s=>!compulsory.includes(s));
    return extra.length ? extra.map(s=>ABBR[s]||s.slice(0,4).toUpperCase()).join('/') : '—';
  }
  const principals = principalsFor(st, cls);
  return principals.length ? combinationCode(principals) : '—';
}
function classOf(st){ return DB.classes.find(c=>c.id===st.classId); }
// Every class where the currently signed-in teacher is the designated Class Teacher
// (cls.classTeacher === their username). Empty for admins/parents or a teacher who
// isn't set as any class's Class Teacher yet. Used to give a Class Teacher visibility
// into Mark Sheets, Class Analysis and the Master Mark Sheet for their WHOLE class —
// every subject, not just the ones they personally teach — without opening those up to
// every teacher in the school.
function classTeacherClasses(){
  if(!CUR || CUR.role!=='teacher') return [];
  return DB.classes.filter(c=>c.classTeacher===CUR.username);
}
function classTeacherClassIds(){ return classTeacherClasses().map(c=>c.id); }

function rawScores(studentId, subject, term, year){
  term = term || DB.info.currentTerm; year = year || DB.info.currentYear;
  return DB.scores.filter(s=>s.studentId===studentId && s.subject===subject && s.term===term && s.year===year);
}
// Returns every distinct term/year for which this student has at least one score on
// file, most recent first, limited to the MAX_TERMS_BEHIND retention window — used to
// populate the "view a past term" picker on the report card.
function availableTermYears(studentId){
  const seen = new Map();
  DB.scores.filter(s=>s.studentId===studentId).forEach(s=>{
    if(!s.term || !s.year) return;
    const dist = termsBehindCurrent(s.term, s.year);
    if(dist<0 || dist>MAX_TERMS_BEHIND) return;
    seen.set(`${s.term}||${s.year}`, {term:s.term, year:s.year});
  });
  const list = [...seen.values()];
  const termOrder = {'Term 1':1,'Term 2':2,'Term 3':3};
  list.sort((a,b)=> b.year-a.year || (termOrder[b.term]||0)-(termOrder[a.term]||0));
  return list;
}
// Every test/exam is entered against whatever maximum the teacher set for it (row.max).
// It's rescaled onto the fixed report-card scale before averaging: AOI tests scale onto
// /20, and End of Term papers scale onto /80. Older score rows saved before this feature
// existed have no .max on file, so they fall back to the historical assumption of /100.
function scaleRow(row, outOf){
  const max = Number(row.max)>0 ? Number(row.max) : 100;
  return (Number(row.marks)/max) * outOf;
}
// Combines one paper's Course Work average (entered on record already scaled to
// /cfg.cwPercent, e.g. /20) and End of Term average (already scaled to /cfg.eotPercent,
// e.g. /80) into that paper's average out of 100 — this IS the "Paper Average".
// Rule: scale Course Work up to its own 100% AND scale End of Term up to its own 100%,
// then divide by 2. cfg.cwPercent/cfg.eotPercent only control the scale marks are
// entered/displayed against (the "(/20)"/"(/80)" column headers) — they are NOT used as
// grading weights, so Course Work and End of Term always contribute equally (50/50) to
// the Paper Average no matter what split the admin has configured.
// If only ONE of the two is on record, the learner is not penalized with a zero for the
// missing half: that single score is scaled up to its own 100% and used as the paper
// average on its own.
// This is the one place this math happens, so the "Paper Avg" column and the "Final
// Average" used for grading always agree, and a subject's Final Average (for subjects
// with 2+ papers, see subjectBreakdown below) is simply the average of its papers'
// own Paper Averages.
function combinePaper(cwAvg, eotAvg, cfg){
  const hasCw = cwAvg!==null && cwAvg!==undefined;
  const hasEot = eotAvg!==null && eotAvg!==undefined;
  const cwPct = hasCw ? (cfg.cwPercent>0 ? (cwAvg/cfg.cwPercent)*100 : cwAvg) : null;
  const eotPct = hasEot ? (cfg.eotPercent>0 ? (eotAvg/cfg.eotPercent)*100 : eotAvg) : null;
  if(cwPct!==null && eotPct!==null) return (cwPct + eotPct) / 2;
  if(cwPct!==null) return cwPct;
  if(eotPct!==null) return eotPct;
  return null;
}
function subjectBreakdown(studentId, subject, term, year){
  const _st = DB.students.find(x=>x.id===studentId);
  const cls = _st ? classOf(_st) : null;
  const cfg = examConfig(_st && _st.classId);
  const rows = rawScores(studentId, subject, term, year);
  const aoiScaled = cfg.cwEnabled ? rows.filter(r=>r.kind==='AOI').map(r=>scaleRow(r, cfg.cwPercent)) : [];
  const eotScaled = cfg.eotEnabled ? rows.filter(r=>r.kind==='EOT').map(r=>scaleRow(r, cfg.eotPercent)) : [];
  const aoiAvg = aoiScaled.length ? aoiScaled.reduce((a,b)=>a+b,0)/aoiScaled.length : null;
  const eotAvg = eotScaled.length ? eotScaled.reduce((a,b)=>a+b,0)/eotScaled.length : null;
  if(aoiAvg===null && eotAvg===null) return {aoiAvg:null, eotAvg:null, final:null};
  // Final average rule: Course Work and End of Term always contribute equally (50/50),
  // regardless of the admin's configured cwPercent/eotPercent split — that split still
  // governs the scale marks are entered/displayed against (aoiAvg/eotAvg above, e.g.
  // "/20" and "/80" on the report table), but grading itself scales each component up
  // to its own 100% first, then averages the two. If only one component is on record
  // so far (e.g. the admin hasn't switched on / no scores exist yet for the other one),
  // grade off just that component scaled to 100 instead of waiting for both parts.
  function combine(cwAvg, eotAvg2){
    return combinePaper(cwAvg, eotAvg2, cfg);
  }
  // Subjects with two (or more) papers grade differently: each paper is graded on its
  // own — that paper's Course Work and End of Term marks combined via the same ÷2 rule
  // above — and the subject's final average is the average of the papers' own finals.
  // This is NOT the same as pooling every paper's raw scores into one combined CW
  // average and one combined EOT average and halving that (which is what aoiAvg/eotAvg
  // above still do, purely for display when no paper has been entered yet).
  const papers = subjectPapersFor(subject, cls);
  let final;
  if(papers.length >= 2){
    const paperFinals = papers.map(p=>{
      const pRows = rows.filter(r=>String(r.paper)===String(p));
      const pAoi = cfg.cwEnabled ? pRows.filter(r=>r.kind==='AOI').map(r=>scaleRow(r, cfg.cwPercent)) : [];
      const pEot = cfg.eotEnabled ? pRows.filter(r=>r.kind==='EOT').map(r=>scaleRow(r, cfg.eotPercent)) : [];
      const pAoiAvg = pAoi.length ? pAoi.reduce((a,b)=>a+b,0)/pAoi.length : null;
      const pEotAvg = pEot.length ? pEot.reduce((a,b)=>a+b,0)/pEot.length : null;
      if(pAoiAvg===null && pEotAvg===null) return null;
      return combine(pAoiAvg, pEotAvg);
    }).filter(f=>f!==null);
    // Only average across papers that actually have a score on record yet — a paper
    // with nothing entered simply doesn't drag the average down. If NO paper has
    // anything on record yet (shouldn't normally happen since aoiAvg/eotAvg above
    // would then also be null), fall back to the combined figures.
    final = paperFinals.length ? paperFinals.reduce((a,b)=>a+b,0)/paperFinals.length : combine(aoiAvg, eotAvg);
  } else {
    final = combine(aoiAvg, eotAvg);
  }
  return {aoiAvg, eotAvg, final};
}
function subjectAverage(studentId, subject, term, year){
  return subjectBreakdown(studentId, subject, term, year).final;
}
// A subject can have more than one paper (e.g. Physics Paper 1 & Paper 2), set by
// whoever the class/subject is assigned to. The report card grades the SUBJECT as one
// whole — off the combined average of every paper's marks — never a single paper alone.
// This just looks up which papers exist for a subject in a class.
function subjectPapersFor(subject, cls){
  if(!cls) return [];
  // Several teachers can each hold their own assignment row for the same subject+class
  // (one per paper) — e.g. Teacher A on Paper 1, Teacher B on Paper 2. Pull the paper
  // list from EVERY matching assignment, not just the first one found, or a second
  // teacher's paper never shows up and the report card can't split into sub-rows.
  const asns = DB.assignments.filter(x=>x.subject===subject && x.classId===cls.id);
  const papers = [];
  asns.forEach(a=>{
    if(Array.isArray(a.papers)) a.papers.forEach(p=>{ if(!papers.some(x=>String(x)===String(p))) papers.push(p); });
  });
  papers.sort((x,y)=>String(x).localeCompare(String(y), undefined, {numeric:true}));
  return papers;
}
// Per-paper breakdown for a multi-paper subject, so the report card can show each paper
// as its own sub-row (marks only — grading itself stays off the combined average, never
// a single paper). Returns null if the subject only has one paper on record, since then
// there's nothing to break out. allEntered is true only once the respective teacher has
// entered at least one score for EVERY paper on record for this subject — until then the
// report card just shows the subject as a single row, as before.
function subjectPaperBreakdown(studentId, subject, cls, term, year){
  const papers = subjectPapersFor(subject, cls);
  if(papers.length < 2) return null;
  const cfg = examConfig(cls && cls.id);
  const rows = rawScores(studentId, subject, term, year);
  const perPaper = papers.map(p=>{
    const pRows = rows.filter(r=>String(r.paper)===String(p));
    const hasAny = pRows.length>0;
    const aoiScaled = cfg.cwEnabled ? pRows.filter(r=>r.kind==='AOI').map(r=>scaleRow(r, cfg.cwPercent)) : [];
    const eotScaled = cfg.eotEnabled ? pRows.filter(r=>r.kind==='EOT').map(r=>scaleRow(r, cfg.eotPercent)) : [];
    const aoiAvg = aoiScaled.length ? aoiScaled.reduce((a,b)=>a+b,0)/aoiScaled.length : null;
    const eotAvg = eotScaled.length ? eotScaled.reduce((a,b)=>a+b,0)/eotScaled.length : null;
    return {paper:p, hasAny, aoiAvg, eotAvg};
  });
  const allEntered = perPaper.every(p=>p.hasAny);
  return {papers: perPaper, allEntered};
}
// Which teacher actually entered the scores for one paper of a subject (falls back to
// "any paper" when paper is null) — read straight off the score rows themselves (each
// carries the username of whoever saved it), so this stays accurate even when several
// teachers share a subject, one per paper.
function paperTeacherInit(studentId, subject, paper, term, year){
  let rows = DB.scores.filter(sc=>sc.studentId===studentId && sc.subject===subject && sc.term===term && sc.year===year && sc.teacher);
  if(paper!=null) rows = rows.filter(sc=>String(sc.paper)===String(paper));
  if(!rows.length) return null;
  // Only credit these initials to whoever entered the marks if that person is actually
  // a teacher. When an admin enters marks on a teacher's behalf, the entry is stamped
  // with the admin's username — that shouldn't put the admin's initials on the report
  // card, so admin-entered rows are skipped here and the caller falls back to whichever
  // teacher is actually assigned to this subject/paper instead.
  const enteredByTeacher = rows
    .map(r=>DB.accounts.find(a=>a.username===r.teacher))
    .find(acc=>acc && acc.role==='teacher');
  return enteredByTeacher ? initials(enteredByTeacher.name) : null;
}
// Raw mark for one admin-defined Course Work test (by name), for a subject/paper.
// paper===null matches any paper on record (used while a multi-paper subject hasn't
// had every paper broken out into its own report-card sub-row yet).
function cwTestScore(studentId, subject, testName, paper, term, year){
  return DB.scores.find(sc=>sc.studentId===studentId && sc.subject===subject && sc.kind==='AOI' && sc.label===testName
    && sc.term===term && sc.year===year && (paper==null || String(sc.paper)===String(paper)));
}
function gradeFor(subject, avg, level){
  if(level==='O'){
    const b = DB.obands || DEFAULT_O_BANDS;
    for(const g of ['A','B','C','D','E']) if(b[g] && avg>=b[g][0] && avg<=b[g][1]) return g;
    return 'E';
  }
  if(level==='P'){
    const b = DB.pbands || DEFAULT_P_BANDS;
    for(const g of PLE_GRADES) if(b[g] && avg>=b[g][0] && avg<=b[g][1]) return g;
    return 'F9';
  }
  // General Paper now follows the SAME pass/fail condition as the subsidiaries:
  // O (1 point) if the average is 50% and above, F (0 points) below 50%.
  if(subject==='GENERAL PAPER' || SUBSIDIARIES.includes(subject)) return avg>=PASS_MARK_SUBSIDIARY ? 'O':'F';
  const b = DB.bands || DEFAULT_A_BANDS;
  for(const g of ['A','B','C','D','E','O','F']) if(b[g] && avg>=b[g][0] && avg<=b[g][1]) return g;
  return 'F';
}
// A-Level subsidiaries (General Paper + Subsidiary Maths/Computer) are graded pass/fail
// internally as 'O'/'F' (so GRADE_POINTS, sorting, etc. still work unchanged), but on the
// report card the Grade column itself should read "Pass"/"Fail" rather than the bare
// letter — the Descriptor column already showed those words via GRADE_COMMENT, this just
// brings the Grade column into agreement for subsidiary subjects specifically.
// Color-codes a grade letter/code so it's unmistakable at a glance on wide tables like
// the Master Mark Sheet (bold text alone gets lost next to columns of plain numbers).
// Covers O/A-Level letters (A-F,O) and Primary PLE codes (D1-F9) in one lookup.
function gradeColorFor(grade){
  if(!grade || grade==='—') return '';
  if(['A','D1','D2'].includes(grade)) return 'var(--good)';
  if(['F','F9'].includes(grade)) return 'var(--danger)';
  if(['E','O','P7','P8'].includes(grade)) return '#8a6d00';
  return 'var(--navy)'; // B, C, D, C3-C6
}
function gradeDisplay(subject, grade, level){
  if(level==='A' && (subject==='GENERAL PAPER' || SUBSIDIARIES.includes(subject))){
    if(grade==='O') return 'Pass';
    if(grade==='F') return 'Fail';
  }
  return grade;
}
// Aggregate (sum of grade-points) of the school's Primary compulsory (core) subjects →
// Division, the Ugandan primary equivalent of an O/A-Level overall grade. Uses whatever
// the admin currently has set as compulsory (pCompulsoryList(), default: the 4 real
// PLE-core subjects) — see the note on pCompulsoryList() about Division accuracy if that
// set is changed from the standard 4.
function primaryAggregate(st, cls, term, year){
  if(!cls || cls.level!=='P') return null;
  const coreSubjects = pCompulsoryList();
  let sum=0, count=0;
  for(const subj of coreSubjects){
    const avg = subjectAverage(st.id, subj, term, year);
    if(avg===null) continue;
    const g = gradeFor(subj, avg, 'P');
    sum += PLE_GRADE_POINTS[g]; count++;
  }
  if(count < coreSubjects.length) return null; // Division needs every compulsory subject on record
  return sum;
}
function gradeColsFor(level){
  if(level==='A') return ['A','B','C','D','E','O','F'];
  if(level==='P') return PLE_GRADES;
  return ['A','B','C','D','E'];
}
function overallGradeFor(cls, avgPct){ return cls.level==='A' ? null : gradeFor('', avgPct, cls.level); }
function teacherForSubjectClass(subject, classId){
  const a = DB.assignments.find(a=>a.subject===subject && a.classId===classId);
  if(!a) return null;
  return DB.accounts.find(acc=>acc.username===a.teacherUsername) || null;
}
// maxPointsFor: every ticked principal is worth 5, GENERAL PAPER and the auto-derived
// subsidiary are each worth a flat 1 (their own pass/fail scale — see gradeFor), and any
// admin-added extra compulsory A-Level subjects (aCompulsoryExtra) are graded normally
// (A-E scale) so each is worth 5, same as a principal.
function maxPointsFor(st, cls){ return principalsFor(st, cls || classOf(st)).length*5 + 1 + 1 + aCompulsoryExtra().length*5; }

function computeSubjectRows(st, cls, term, year){
  const subs = studentSubjects(st, cls);
  let totalPoints=0, sumAvg=0, countAvg=0;
  const rows = subs.map(subj=>{
    const avg = subjectAverage(st.id, subj, term, year);
    const grade = avg===null ? null : gradeFor(subj, avg, cls.level);
    let pts=0;
    if(cls.level==='A' && grade) pts = GRADE_POINTS[grade];
    if(avg!==null){ sumAvg+=avg; countAvg++; totalPoints+=pts; }
    const t = teacherForSubjectClass(subj, cls.id);
    return {subject:subj, avg, grade, pts, teacherInit: t?initials(t.name):'--'};
  });
  return { rows, totalPoints, avgPct: countAvg? sumAvg/countAvg : 0 };
}
function metricFor(st, cls, term, year){ const d = computeSubjectRows(st, cls, term, year); return cls.level==='A' ? d.totalPoints : d.avgPct; }
// classPosition() is called once PER STUDENT from every whole-class view (Master Mark
// Sheet, Class Analysis, Report Cards) — so without caching, ranking a class of N
// students redid the full O(N) ranking pass N times (O(N^2) overall), redundantly
// recomputing every peer's subject/score totals on every single call. For a
// realistically sized class that's enough synchronous work on the main thread to make
// a single tap look "unresponsive" for several seconds before anything repaints. This
// cache computes the ranking once per (class, term, year, current scores) and reuses
// it for every student, cutting a full render down to O(N) total.
let _rankCache = {scoresRef:null, key:'', map:null};
function computeClassRankings(cls, term, year){
  const key = cls.id+'|'+term+'|'+year;
  if(_rankCache.scoresRef===DB.scores && _rankCache.key===key) return _rankCache.map;
  const peers = DB.students.filter(s=>s.classId===cls.id);
  const scored = peers.map(s=>({id:s.id, m:metricFor(s, cls, term, year)})).sort((a,b)=>b.m-a.m);
  const map = new Map();
  let position = scored.length;
  for(let i=0;i<scored.length;i++){
    if(i===0 || scored[i].m < scored[i-1].m) position = i+1;
    map.set(scored[i].id, {position, size:peers.length});
  }
  _rankCache = {scoresRef:DB.scores, key, map};
  return map;
}
function classPosition(student, cls, term, year){
  const map = computeClassRankings(cls, term, year);
  return map.get(student.id) || {position: DB.students.filter(s=>s.classId===cls.id).length || 1, size: DB.students.filter(s=>s.classId===cls.id).length};
}
function overallRemark(pct, who){
  if(who==='class'){
    if(pct>=0.75) return 'Excellent overall performance this term. Keep up the outstanding work.';
    if(pct>=0.5) return 'Good, steady performance. A little more effort will push results higher.';
    if(pct>=0.3) return 'Fair performance. Needs closer attention and more consistent study habits.';
    return 'Performance is below expectation. Requires serious improvement and support.';
  } else {
    if(pct>=0.75) return 'A commendable result — well done this term.';
    if(pct>=0.5) return 'A satisfactory result with clear room to grow.';
    if(pct>=0.3) return 'This result calls for renewed effort next term.';
    return 'This result is a serious concern and needs urgent action.';
  }
}

// Student/staff photos are shown at most ~90px wide on screen and in the
// report card's BioData box (see .rc-bio-photo), which is what sizes this —
// 190px source gives ~2x that for sharp printing without extra dead weight.
const PHOTO_MAX_DIM = 190;
const PHOTO_MAX_BYTES = 35*1024; // hard cap: no uploaded student/staff photo may exceed 35KB
// The school logo is shown larger (report card header), so it keeps its own,
// higher dimension/size targets.
const LOGO_MAX_DIM = 450;
const LOGO_MAX_BYTES = 300*1024;
// True only if this browser can actually encode canvas content as WebP (not
// just decode/display it) — checked once, reused by every compression below.
const SUPPORTS_WEBP_ENCODE = (()=>{
  try{
    const c = document.createElement('canvas'); c.width = c.height = 1;
    return c.toDataURL('image/webp').indexOf('data:image/webp') === 0;
  }catch(e){ return false; }
})();
const COMPRESS_MIME = SUPPORTS_WEBP_ENCODE ? 'image/webp' : 'image/jpeg';
// Resizes + re-compresses an image file, shrinking dimensions and quality
// step by step, until the result is at or under maxBytes. Uses WebP where the
// browser supports encoding it (meaningfully smaller than JPEG at the same
// visual quality), falling back to JPEG otherwise. Returns a Blob, which
// uploadPhotoToStorage then turns into the base64 string actually saved.
async function compressImage(file, maxDim, maxBytes){
  maxBytes = maxBytes || PHOTO_MAX_BYTES;
  const img = await new Promise((res, rej)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const im = new Image();
      im.onload = ()=>res(im);
      im.onerror = rej;
      im.src = e.target.result;
    };
    reader.onerror = rej;
    reader.readAsDataURL(file);
  });
  let dim = maxDim;
  let best = null; // smallest blob found so far, in case we never hit the target
  for(let attempt=0; attempt<6; attempt++){
    let {width,height} = img;
    if(width>height){ if(width>dim){ height*=dim/width; width=dim; } }
    else{ if(height>dim){ width*=dim/height; height=dim; } }
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1,Math.round(width));
    canvas.height = Math.max(1,Math.round(height));
    canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    for(const q of [0.8,0.6,0.45,0.3,0.18,0.1]){
      const blob = await new Promise(res=>canvas.toBlob(res,COMPRESS_MIME,q));
      if(!blob) continue;
      if(!best || blob.size<best.size) best = blob;
      if(blob.size<=maxBytes) return blob;
    }
    dim = Math.round(dim*0.7); // still too big — shrink dimensions and try again
  }
  return best; // closest we could get; still far smaller than the original
}
// Converts a compressed photo Blob straight into a base64 data URL and returns
// it — this string is saved directly on the student/school record in Firestore.
// Photos are pre-compressed to PHOTO_MAX_BYTES/LOGO_MAX_BYTES before this is
// ever called, so even after base64's ~33% size overhead they stay well under
// Firestore's 1MB-per-document limit.
// (Previously this uploaded to Firebase Storage instead, but Storage requires
// the project to be on Firebase's paid "Blaze" plan even for tiny amounts of
// data, which is why uploads were failing on the free "Spark" plan. Storing
// the image inline in Firestore sidesteps that entirely.)
async function uploadPhotoToStorage(blob, pathPrefix){
  if(!blob) return null;
  return await new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = e=>res(e.target.result);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}
// No-op now: photos live inline in the Firestore document as a base64 data
// URL, so there's no separate file in a bucket to clean up. Kept as a function
// (rather than deleting every call site) so nothing else needs to change.

}
function fitOnePage(root){
  const inner = root.querySelector('.rc-card');
  if(!inner) return;
  inner.style.transform=''; inner.style.width='';
  const target = 1040;
  const h = inner.scrollHeight;
  // Scales the card to exactly fill the one-A4-page budget either way: shrinks a
  // report card that's too tall (many subjects) so it still lands on one page,
  // and — just as importantly — grows a report card that's short (few subjects,
  // e.g. a light Primary card) so it fills the page top-to-bottom instead of
  // sitting small with empty space below it. The lower bound (0.7x) keeps very
  // tall cards from shrinking to illegibly small text; the upper bound (1.8x) is
  // just a sanity ceiling for a near-empty card, not a deliberate "don't fill the
  // page" cap — most real cards land well under it and simply scale up to fill.
  let scale = target/h;
  scale = Math.max(0.7, Math.min(scale, 1.8));
  if(Math.abs(scale-1)>0.01){
    inner.style.transformOrigin='top left';
    inner.style.transform=`scale(${scale})`;
    inner.style.width=(100/scale)+'%';
  }
}

function render(){
  // Any full re-render replaces the on-screen forms wholesale — either because the
  // user navigated away (in which case whatever they'd typed is gone regardless of
  // what we do here) or because a save just succeeded and freshly-saved values were
  // re-rendered from DB.scores. Either way there is no longer any unsaved, at-risk
  // typing to protect, so it's safe to clear the flag that was holding pending
  // updates back.
  FORM_DIRTY = false;
  const app = document.getElementById('app');
  let banner = '';
  if(DEMO_MODE) banner = `<div class="warn-banner">⚠ Not connected to a shared database — running in single-device demo mode. See the setup comment at the top of this file to connect Firebase so all devices share the same data.</div>`;
  // A failed read leaves SYSTEM_OWNER null exactly like a genuine first-ever run
  // does, but the two must never be shown the same way: offering "claim founder
  // account" here would let anyone who catches the platform mid-outage register
  // themselves as founder. Show a plain "can't connect" notice instead.
  if(SYSTEM_OWNER===null && DATA_LOAD_FAILED){ app.innerHTML = banner + renderConnectionTrouble(); return; }
  if(SYSTEM_OWNER===null){ app.innerHTML = banner + renderFounderSetup(); return; }
  if(CUR && CUR.role==='founder'){ app.innerHTML = banner + renderFounderShell(); return; }
  if(SCHOOL_ID && CUR){ app.innerHTML = banner + renderShell(); return; }
  app.innerHTML = banner + renderPlatformAuth();
}

function formatBytes(n){
  if(n<1024) return n+' B';
  if(n<1024*1024) return (n/1024).toFixed(1)+' KB';
  if(n<1024*1024*1024) return (n/(1024*1024)).toFixed(1)+' MB';
  return (n/(1024*1024*1024)).toFixed(2)+' GB';
}
// Founder-dashboard-only card. Never rendered anywhere a school admin or
// teacher can see — see renderFounderView('fdash') above, the only caller.
function renderStorageEstimateCard(){
  if(!STORAGE_ESTIMATE){
    return `<div class="card" style="margin-top:16px;">
      <h3>Platform Storage Estimate</h3>
      <p class="small">No estimate has been calculated yet. This reads every school's data once to build a baseline, so it may take a moment on a platform with many schools.</p>
      <button class="btn-outline" data-action="foundRecalcStorage">Calculate now</button>
    </div>`;
  }
  const {totalBytes, perSchool, computedAt} = STORAGE_ESTIMATE;
  const pct = Math.min(999, (totalBytes/FIRESTORE_FREE_TIER_BYTES)*100);
  const totalStudents = perSchool.reduce((s,x)=>s+x.studentCount,0);
  const avgBytesPerStudent = totalStudents>0 ? totalBytes/totalStudents : null;
  // Headroom expressed the way the founder actually thinks about it: "how many
  // more 1,000-student schools can this take?" Falls back to a documented
  // assumption if there's no real data yet to average from.
  const ASSUMED_BYTES_PER_STUDENT_FALLBACK = 50*1024; // ~50KB/student incl. scores + compressed photo, used only until real data exists
  const perStudentEstimate = avgBytesPerStudent || ASSUMED_BYTES_PER_STUDENT_FALLBACK;
  const remainingBytes = Math.max(0, FIRESTORE_FREE_TIER_BYTES - totalBytes);
  const schoolsOf1000Remaining = Math.floor(remainingBytes / (perStudentEstimate*1000));
  const isWarning = pct/100 >= STORAGE_WARN_RATIO;
  const isCritical = pct >= 100;
  const bannerColor = isCritical ? 'var(--danger)' : (isWarning ? 'var(--gold)' : 'var(--good)');
  const bannerBg = isCritical ? '#fdecea' : (isWarning ? '#FFF7E0' : '#eafaf0');
  return `<div class="card" style="margin-top:16px;">
    <h3>Platform Storage Estimate <span class="small">(founder-only, approximate)</span></h3>
    <div style="background:${bannerBg};border:1px solid ${bannerColor};border-radius:8px;padding:12px 14px;margin-bottom:12px;">
      <b style="color:${bannerColor};">${isCritical? '⚠ Estimated over the free-tier budget.' : isWarning? '⚠ Getting close to the free-tier budget.' : 'Storage looks healthy.'}</b>
      <div class="small" style="margin-top:4px;">${formatBytes(totalBytes)} of an assumed ${formatBytes(FIRESTORE_FREE_TIER_BYTES)} budget (${pct.toFixed(1)}%). At the current average of ~${formatBytes(perStudentEstimate)}/student, there's roughly room for <b>${schoolsOf1000Remaining} more school${schoolsOf1000Remaining===1?'':'s'} of 1,000 students</b> before hitting that budget.</div>
    </div>
    <div class="grid3">
      <div><div class="small">TOTAL ESTIMATED</div><b>${formatBytes(totalBytes)}</b></div>
      <div><div class="small">SCHOOLS INCLUDED</div><b>${perSchool.length}</b></div>
      <div><div class="small">TOTAL STUDENTS</div><b>${totalStudents}</b></div>
    </div>
    <p class="small" style="margin-top:10px;">Last calculated ${fmtDateTime(computedAt)}. This is a rough estimate built from this app's own data (not real Firestore billing figures) and only updates when you press the button below — it does not run automatically.</p>
    <button class="btn-outline" data-action="foundRecalcStorage">Recalculate now</button>
    <details style="margin-top:10px;"><summary class="small" style="cursor:pointer;">Per-school breakdown</summary>
      <table class="data-table" style="margin-top:8px;"><tr><th>School</th><th>Students</th><th>Estimated size</th></tr>
      ${perSchool.slice().sort((a,b)=>b.bytes-a.bytes).map(s=>`<tr><td>${esc(s.name)}</td><td>${s.studentCount}</td><td>${formatBytes(s.bytes)}</td></tr>`).join('')}
      </table>
    </details>
  </div>`;
}

// Views that touch student/teacher bio data, account credentials, subject assignment,
// or grading configuration are admin-only. This guard is a hard backstop — the sidebar
// already hides these links from non-admins, but this makes it impossible to reach them
// by any other route (e.g. a stray VIEW.name) regardless of who is signed in.
const ADMIN_ONLY_VIEWS = new Set(['dashboard','schoolinfo','classes','classedit','accounts','students','oldstudents','assignsubjects','olevel','grading','promote','teacherprofile','studentprofile','restoreitems']);
// Class Analysis and the Master Mark Sheet are whole-class views (every subject, every
// student) — open to Admin always, and to a Teacher only for a class where they're the
// designated Class Teacher (see classTeacherClasses()). A teacher who isn't a Class
// Teacher anywhere sees a friendly permission message instead, same pattern as the
// admin-only backstop above.
const CLASS_TEACHER_VIEWS = new Set(['classanalysis','mastermarksheet']);
// Detail pages reached from a row action (not part of the sidebar nav) — kept on
// screen instead of bouncing back to the dashboard when the shell re-renders.
const DETAIL_VIEWS = new Set(['teacherprofile','studentprofile','classedit','restoreitems','integratedmarksheet']);
function renderView(view){
  try{
    if(ADMIN_ONLY_VIEWS.has(view) && (!CUR || CUR.role!=='admin')){
      return '<p>You don\'t have permission to view this page. Only an Admin can manage this.</p>';
    }
    if(CLASS_TEACHER_VIEWS.has(view) && (!CUR || (CUR.role!=='admin' && !(CUR.role==='teacher' && classTeacherClasses().length)))){
      return '<p>You don\'t have permission to view this page. Only an Admin, or a Teacher designated as a Class Teacher, can view this.</p>';
    }
    switch(view){
      case 'dashboard': return adminDashboard();
      case 'schoolinfo': return schoolInfoView();
      case 'classes': return classesView();
      case 'classedit': return classEditView(VIEW.params.classId);
      case 'accounts': return accountsView();
      case 'students': return studentsView();
      case 'oldstudents': return oldStudentsView();
      case 'assignsubjects': return assignSubjectsView();
      case 'teacherprofile': return teacherProfileView(VIEW.params.username);
      case 'studentprofile': return studentProfileView(VIEW.params.studentId);
      case 'olevel': return oLevelSubjectsView();
      case 'restoreitems': return restoreItemsView();
      case 'grading': return gradingView(VIEW.params.gcClassId);
      case 'promote': return promoteView();
      case 'reports': return reportsListView();
      case 'password': return passwordView();
      case 'ascores': return CUR.role==='admin' ? scoresEntryView(DB.assignments) : '<p>You don\'t have permission to view this page.</p>';
      case 'marksheets': return marksheetsListView();
      case 'integratedmarksheet': return integratedMarksheetView(VIEW.params.classId, VIEW.params.subject, VIEW.params.imsPage||1, false);
      case 'classanalysis': return classAnalysisView();
      case 'mastermarksheet': return masterMarkSheetView();
      case 'tdash': return teacherDashboard();
      case 'tscores': return scoresEntryView(DB.assignments.filter(a=>a.teacherUsername===CUR.username));
      case 'treports': return reportsListView();
      case 'pdash': return parentDashboard();
      case 'preport': return parentReportView();
      default: return '<p>Not found.</p>';
    }
  }catch(e){ console.error(e); return '<p>Something went wrong rendering this page: '+esc(e.message)+'</p>'; }
}

    return `<h2>Restore Individual Items</h2><div class="card"><p class="small">No backup file loaded yet. Go to the Dashboard's "Backup & Restore" card and choose a file to browse first.</p><button class="btn-outline" data-action="nav:dashboard">Back to Dashboard</button></div>`;

  const d = RESTORE_BROWSE.data;
  const curStudentIds = new Set(DB.students.map(s=>s.id));
  const curClassIds = new Set(DB.classes.map(c=>c.id));
  const curUsernames = new Set(DB.accounts.map(a=>a.username));
  const teacherAccounts = d.accounts.filter(a=>a.role==='teacher');
  const flag = (isNew)=> isNew
    ? '<span class="small" style="color:var(--danger);">— not in current data (deleted, or never existed)</span>'
    : '<span class="small" style="color:var(--muted);">— exists in current data, will be overwritten</span>';
  return `
  <h2>Restore Individual Items</h2>
  <div class="note">Browsing <b>${esc(RESTORE_BROWSE.fileName)}</b>${d.exportedAt?` — backed up ${fmtDate(d.exportedAt)}`:''}. Tick anything you want brought back exactly as it was in this file. Only ticked items are touched — everything else in your current data is left alone.</div>
  <form data-form="selectiveRestore">
    <div class="card">
      <h3>Students (${d.students.length})</h3>
      ${d.students.map(s=>{
        const cls = d.classes.find(c=>c.id===s.classId);
        return `<label class="flex" style="gap:8px;align-items:center;"><input type="checkbox" name="students" value="${esc(s.id)}" style="width:auto;"><span>${esc(s.name)} — ${esc(s.admNo||'—')}${cls?` (${esc(cls.name)})`:''} ${flag(!curStudentIds.has(s.id))}</span></label>`;
      }).join('') || '<p class="small">No students in this backup.</p>'}
      ${d.students.length ? `<label class="flex" style="gap:8px;margin-top:8px;"><input type="checkbox" name="includeScores" value="1" checked style="width:auto;"><span>Also restore recorded scores for any students ticked above</span></label>` : ''}
    </div>
    <div class="card">
      <h3>Classes (${d.classes.length})</h3>
      ${d.classes.map(c=>`<label class="flex" style="gap:8px;align-items:center;"><input type="checkbox" name="classes" value="${esc(c.id)}" style="width:auto;"><span>${esc(c.name)}${c.stream?' '+esc(c.stream):''} — ${esc(levelLabel(c))} ${flag(!curClassIds.has(c.id))}</span></label>`).join('') || '<p class="small">No classes in this backup.</p>'}
    </div>
    <div class="card">
      <h3>Staff Accounts (${teacherAccounts.length})</h3>
      ${teacherAccounts.map(a=>`<label class="flex" style="gap:8px;align-items:center;"><input type="checkbox" name="accounts" value="${esc(a.username)}" style="width:auto;"><span>${esc(a.name)} (${esc(a.username)}) ${flag(!curUsernames.has(a.username))}</span></label>`).join('') || '<p class="small">No staff accounts in this backup.</p>'}
    </div>
    <div class="card">
      <h3>School Settings</h3>
      <p class="small">Bundles school name/logo/term dates, grading bands, exam setup, and compulsory-subject choices from this file. Replaces your CURRENT settings — doesn't touch students, classes, or accounts.</p>
      <label class="flex" style="gap:8px;"><input type="checkbox" name="restoreSettings" value="1" style="width:auto;"><span>Restore school settings from this file</span></label>
    </div>
    <button class="btn" style="margin-top:6px;">Restore ticked items</button>
    <button type="button" class="btn-outline" style="margin-top:6px;" data-action="nav:dashboard">Cancel</button>
  </form>`;
}

function classesView(){

}

function renderStudentsTableHtml(){
  const classId = VIEW.params.stuClassFilter||'';
  const term = (VIEW.params.stuSearch||'').trim().toLowerCase();
  if(!classId && !term){
    return `<p class="small">Select a class above, or start typing a name in the search box, to see students here.</p>`;
  }
  let list = DB.students.filter(s=>s.status!=='left'); // students who've left live under Old Students instead
  if(classId) list = list.filter(s=>s.classId===classId);
  if(term) list = list.filter(s=>(s.name||'').toLowerCase().includes(term));
  list = sortByName(list);
  return `<table class="data-table"><tr><th>Photo</th><th>Name</th><th>Adm No</th><th>Class</th><th>Combination / Subjects</th><th>Action</th></tr>
    ${list.map(s=>{
      const cls = DB.classes.find(c=>c.id===s.classId);
      return `<tr><td>${s.photo?`<img src="${s.photo}" class="photo-thumb">`:'—'}</td><td>${esc(s.name)}</td><td>${esc(s.admNo)}${s.feesCode?` <span class="small" style="color:var(--muted);">(Fees Code: ${esc(s.feesCode)})</span>`:''}</td>
      <td>${cls?esc(cls.name):'—'}</td><td>${esc(comboLabel(s,cls))}</td>
      <td class="flex"><button class="btn-outline" data-action="editStudentProfile:${s.id}"><b>Edit profile</b></button> <button class="btn-outline" data-action="markStudentLeft:${s.id}">Mark as left</button> <button class="btn-danger" data-action="delStudent:${s.id}">Remove</button></td></tr>`;
    }).join('') || '<tr><td colspan="6">No students match.</td></tr>'}
    </table>`;
}
// The class-filter select and the search box each re-render only the table div
// (not the whole view via render()) so the search input never loses focus/cursor
// position while the admin is typing, and both filters combine (AND) together.
function filterStudentsByClass(v){
  VIEW.params.stuClassFilter = v||'';
  const wrap = document.getElementById('studentsTableWrap');
  if(wrap) wrap.innerHTML = renderStudentsTableHtml();
}
function filterStudentsBySearch(v){
  VIEW.params.stuSearch = v;
  const wrap = document.getElementById('studentsTableWrap');
  if(wrap) wrap.innerHTML = renderStudentsTableHtml();
}
// Live preview of the auto admission number a newly-selected class would assign
// next — purely cosmetic, doesn't touch the class's real counter (see
// peekNextAdmissionNumber). Falls back to a placeholder once no class is picked.
function updateAdmNoPreview(classId){
  const el = document.getElementById('admNoPreview');
  if(!el) return;
  const cls = DB.classes.find(c=>c.id===classId);
  el.value = cls ? peekNextAdmissionNumber(cls) : 'Select a class to see the next admission number';
}

/* ---------- Admin: A-Level, O-Level & Primary extra subjects ---------- */
function oLevelSubjectsView(){
  const extra = DB.info.oExtraSubjects || [];
  const pExtra = DB.info.pExtraSubjects || [];
  const aExtra = DB.info.aExtraSubjects || [];
  return `
  <h2>A-Level, O-Level & Primary Extra Subjects</h2>
  <div class="note">Base subjects for each level are fixed to the syllabus you specified. Add any additional subjects your school offers below.</div>
  <div class="card" style="margin-top:14px;">
    <h3>A-Level</h3>
    <form data-form="addASubject" class="flex">
      <div style="flex:2;"><label>New A-Level subject name</label><input name="subjectName" placeholder="e.g. TECHNICAL DRAWING" required></div>
      <div style="align-self:end;"><button class="btn">Submit — add</button></div>
    </form>
  </div>
  <div class="card">
    <h3>Compulsory</h3><p>${COMPULSORY.map(s=>`<span class="chip">${s}</span>`).join('')}</p>
    <p class="small">General Paper is fixed and can't be removed — it's graded on its own pass/fail scale and its point is built into every A-Level student's max-points total. You can add further subjects below that should also be auto-included for every A-Level student, no roster tick needed (these are graded normally, A-E, like any other principal subject).</p>
    <form data-form="saveACompulsoryExtra">
      <h4 style="margin:8px 0 4px;">Additional compulsory subjects (optional)</h4>
      <div class="flex" style="gap:6px 18px;flex-wrap:wrap;">
        ${aOptionalList().map(s=>`<label class="flex" style="gap:6px;width:auto;"><input type="checkbox" name="extraCompulsory" value="${esc(s)}" style="width:auto;" ${aCompulsoryExtra().includes(s)?'checked':''}> <span>${esc(s)}</span></label>`).join('')}
      </div>
      <div style="margin-top:10px;"><button class="btn">Save additional compulsory subjects</button></div>
    </form>
    <h3 style="margin-top:16px;">Subsidiaries (teacher-ticked, not auto-assigned)</h3><p>${SUBSIDIARIES.map(s=>`<span class="chip">${s}</span>`).join('')}</p>
    <p class="small">Every A-Level student is expected to take one of these, but which one is entirely up to the Subsidiary Mathematics or Subsidiary Computer teacher ticking that student into their own roster — nothing is guessed or assigned automatically. A student ticked into neither simply has no subsidiary on their report card yet; a student ticked into both by mistake is flagged as a conflict and shows neither until it's fixed.</p>
    <h3>Base principal subjects</h3><p>${A_OPTIONALS_BASE.map(s=>`<span class="chip">${s}</span>`).join('')}</p>
    <h3>Your added subjects</h3>
    <p>${aExtra.length? aExtra.map(s=>`<span class="chip">${esc(s)} <span data-action="delASubject:${encodeURIComponent(s)}" style="cursor:pointer;color:var(--danger);font-weight:800;">&times;</span></span>`).join('') : '<span class="small">None added yet.</span>'}</p>
  </div>
  <div class="card">
    <h3>O-Level</h3>
    <form data-form="addOSubject" class="flex">
      <div style="flex:2;"><label>New O-Level subject name</label><input name="subjectName" placeholder="e.g. TECHNICAL DRAWING" required></div>
      <div style="align-self:end;"><button class="btn">Submit — add</button></div>
    </form>
  </div>
  <div class="card">
    <h3>Compulsory subjects</h3>
    <p class="small">Ticked subjects are automatically included on every student's report card in that form band — no roster tick needed from the subject teacher. Anything left unticked is optional: only students a subject teacher ticks into their own class roster will show it. These start out matching the standard syllabus, but you can change them for your school at any time.</p>
    <form data-form="saveOCompulsory">
      <div class="flex" style="align-items:flex-start;gap:24px;">
        <div style="flex:1;min-width:200px;">
          <h4 style="margin:8px 0 4px;">S.1 & S.2</h4>
          ${oAllSubjectPool().map(s=>`<label class="flex" style="gap:6px;"><input type="checkbox" name="lowerSubjects" value="${esc(s)}" style="width:auto;" ${oCompulsoryFor('S.1').includes(s)?'checked':''}> <span>${esc(s)}</span></label>`).join('')}
        </div>
        <div style="flex:1;min-width:200px;">
          <h4 style="margin:8px 0 4px;">S.3 & S.4</h4>
          ${oAllSubjectPool().map(s=>`<label class="flex" style="gap:6px;"><input type="checkbox" name="upperSubjects" value="${esc(s)}" style="width:auto;" ${oCompulsoryFor('S.3').includes(s)?'checked':''}> <span>${esc(s)}</span></label>`).join('')}
        </div>
      </div>
      <div style="margin-top:10px;"><button class="btn">Save compulsory subjects</button></div>
    </form>
  </div>
  <div class="card">
    <h3>Base optional</h3><p>${O_OPTIONAL_BASE.map(s=>`<span class="chip">${s}</span>`).join('')}</p>
    <h3>Your added subjects</h3>
    <p>${extra.length? extra.map(s=>`<span class="chip">${esc(s)} <span data-action="delOSubject:${encodeURIComponent(s)}" style="cursor:pointer;color:var(--danger);font-weight:800;">&times;</span></span>`).join('') : '<span class="small">None added yet.</span>'}</p>
  </div>
  <div class="card">
    <h3>Compulsory (core) subjects</h3>
    <p class="small">Ticked subjects are automatically included on every Primary student's report card — no roster tick needed from the subject teacher. Anything left unticked is optional: only students a subject teacher ticks into their own class roster will show it. These start out matching the standard PLE core (English, Mathematics, Science, Social Studies), but you can change them for your school at any time.</p>
    <div class="note">Uganda's official PLE Division bands assume exactly 4 core subjects. If you change the number of compulsory subjects from 4, the Aggregate figure still totals correctly, but the Division label becomes approximate rather than an exact match to the UNEB standard.</div>
    <form data-form="savePCompulsory" style="margin-top:10px;">
      <div class="flex" style="gap:6px 18px;flex-wrap:wrap;">
        ${pAllSubjectPool().map(s=>`<label class="flex" style="gap:6px;width:auto;"><input type="checkbox" name="coreSubjects" value="${esc(s)}" style="width:auto;" ${pCompulsoryList().includes(s)?'checked':''}> <span>${esc(s)}</span></label>`).join('')}
      </div>
      <div style="margin-top:10px;"><button class="btn">Save compulsory subjects</button></div>
    </form>
  </div>
  <div class="card">
    <h3>Primary</h3>
    <form data-form="addPSubject" class="flex">
      <div style="flex:2;"><label>New Primary subject name</label><input name="subjectName" placeholder="e.g. COMPUTER STUDIES" required></div>
      <div style="align-self:end;"><button class="btn">Submit — add</button></div>
    </form>
  </div>
  <div class="card">
    <h3>PLE syllabus default</h3><p>${P_CORE_SUBJECTS.map(s=>`<span class="chip">${s}</span>`).join('')}</p>
    <h3>Base optional</h3><p>${P_OPTIONAL_BASE.map(s=>`<span class="chip">${s}</span>`).join('')}</p>
    <h3>Your added subjects</h3>
    <p>${pExtra.length? pExtra.map(s=>`<span class="chip">${esc(s)} <span data-action="delPSubject:${encodeURIComponent(s)}" style="cursor:pointer;color:var(--danger);font-weight:800;">&times;</span></span>`).join('') : '<span class="small">None added yet.</span>'}</p>
  </div>`;
}

/* ---------- Admin: Assign subjects ---------- */
function assignSubjectsView(){
  const firstCls = DB.classes[0];
  const firstIsPrimary = !!(firstCls && firstCls.level==='P');
  const firstLevel = firstCls ? firstCls.level : 'O';
  const subs = subjectsForLevel(firstLevel);
  const levelTeachers = teachersForLevel(firstLevel);
  return `
  <h2>Assign Subjects to Teachers</h2>
  <div class="note">A teacher can be assigned many subjects, many papers, and many classes. The Teacher and Subject lists below narrow down to whichever level the selected Class belongs to.</div>
  <div class="card" style="margin-top:14px;">
    <form data-form="assignSubject">
      <div class="grid2">
        <div><label>Teacher</label><select name="teacherUsername" id="assignTeacherSel" required>
          ${levelTeachers.map(t=>`<option value="${t.username}">${esc(t.name)}</option>`).join('') || '<option value="">-- add a teacher account first --</option>'}
        </select></div>
        <div><label>Class</label><select name="classId" id="assignClassSel" required>
          ${DB.classes.map(c=>`<option value="${c.id}" data-level="${esc(c.level)}">${esc(c.name)}</option>`).join('') || '<option value="">-- add a class first --</option>'}
        </select></div>
      </div>
      <div class="grid2">
        <div><label>Subject</label><select name="subject" id="assignSubjectSel" required>${subs.map(s=>`<option value="${s}">${s}</option>`).join('')}</select></div>
        <div id="papersWrap" style="${firstIsPrimary?'display:none;':''}"><label>Papers taught (e.g. 1,2)</label><input name="papers" id="papersInput" placeholder="1,2" value="${firstIsPrimary?'1':''}" ${firstIsPrimary?'':'required'}></div>
      </div>
      <button class="btn" style="margin-top:14px;">Submit — assign</button>
    </form>
  </div>
  <div class="card">
    <table class="data-table"><tr><th>Teacher</th><th>Class</th><th>Subject</th><th>Papers</th><th>Action</th></tr>
    ${DB.assignments.map(a=>{
      const t = DB.accounts.find(x=>x.username===a.teacherUsername); const c = DB.classes.find(x=>x.id===a.classId);
      const isP = c && c.level==='P';
      return `<tr><td>${t?esc(t.name):'—'}</td><td>${c?esc(c.name):'—'}</td><td>${esc(a.subject)}</td><td>${isP?'—':esc(a.papers.join(', '))}</td>
      <td><button class="btn-danger" data-action="delAssign:${a.id}">Remove</button></td></tr>`;
    }).join('') || '<tr><td colspan="5">No assignments yet.</td></tr>'}
    </table>
  </div>`;
}

/* ---------- Admin: Edit Teacher Profile (subjects / classes / papers) ---------- */
function teacherProfileView(username){
  const t = DB.accounts.find(a=>a.username===username && a.role==='teacher');
  if(!t) return `<h2>Edit Teacher Profile</h2><div class="card"><p>Teacher not found.</p><button class="btn-outline" data-action="nav:accounts">Back to Staff & Parent Accounts</button></div>`;
  const mine = DB.assignments.filter(a=>a.teacherUsername===username);
  const firstCls = DB.classes[0];
  const firstIsPrimary = !!(firstCls && firstCls.level==='P');
  const subs = subjectsForLevel(firstCls ? firstCls.level : 'O');
  return `
  <h2>Edit Teacher Profile</h2>
  <div class="note">Only an Admin can edit which classes, subjects, and papers a teacher is assigned to.</div>
  <div class="card" style="margin-top:14px;">
    <h3>Basic info</h3>
    <p class="small">Useful when a teacher leaves and a replacement is taking over their login — rename the account and set a new password rather than deleting it, so all of the outgoing teacher's existing assignments and previously entered scores carry over cleanly to the new name/username.</p>
    <form data-form="updateTeacherProfile" data-username="${esc(username)}">
      <div class="grid2">
        <div><label>Full name</label><input name="name" value="${esc(t.name)}" required></div>
        <div><label>Username</label><input name="username" value="${esc(t.username)}" required></div>
      </div>
      <label>New password (optional)</label>
      <input name="password" placeholder="Leave blank to keep the current password" autocomplete="new-password">
      <p class="small" style="margin-top:4px;">Changing the username or password here requires your owner code and will not sign this teacher out of any device already logged in — let them know the new details directly.</p>
      <button class="btn" style="margin-top:14px;">Submit — save changes</button>
    </form>
  </div>
  <div class="card">
    <h3>Assign a new class + subject</h3>
    <form data-form="assignSubject">
      <input type="hidden" name="teacherUsername" value="${esc(username)}">
      <div class="grid2">
        <div><label>Class</label><select name="classId" id="assignClassSel" required>
          ${DB.classes.map(c=>`<option value="${c.id}" data-level="${esc(c.level)}">${esc(c.name)}</option>`).join('') || '<option value="">-- add a class first --</option>'}
        </select></div>
        <div><label>Subject</label><select name="subject" id="assignSubjectSel" required>${subs.map(s=>`<option value="${s}">${s}</option>`).join('')}</select></div>
      </div>
      <div id="papersWrap" style="${firstIsPrimary?'display:none;':''}"><label>Papers taught (e.g. 1,2)</label><input name="papers" id="papersInput" placeholder="1,2" value="${firstIsPrimary?'1':''}" ${firstIsPrimary?'':'required'}></div>
      <button class="btn" style="margin-top:14px;">Submit — assign</button>
    </form>
  </div>
  <div class="card">
    <h3>Current classes, subjects & papers for ${esc(t.name)}</h3>
    <table class="data-table"><tr><th>Class</th><th>Subject</th><th>Papers</th><th>Remove</th></tr>
    ${mine.map(a=>{
      const c = DB.classes.find(x=>x.id===a.classId);
      const isP = c && c.level==='P';
      return `<tr><td>${c?esc(c.name):'—'}</td><td>${esc(a.subject)}</td>
      <td>${isP ? '—' : `<form data-form="editAssignPapers" data-id="${a.id}" style="display:flex;gap:6px;align-items:center;margin:0;">
        <input name="papers" value="${esc(a.papers.join(', '))}" style="width:110px;">
        <button class="btn-outline" type="submit" style="padding:6px 10px;">Save</button>
      </form>`}</td>
      <td><button class="btn-danger" data-action="delAssign:${a.id}">Remove</button></td></tr>`;
    }).join('') || '<tr><td colspan="4">No assignments yet for this teacher — add one above.</td></tr>'}
    </table>
  </div>
  <button class="btn-outline" data-action="nav:accounts">Back to Staff & Parent Accounts</button>`;
}

/* ---------- Admin: Edit Student Profile (subjects / sex / class / etc.) ---------- */
function studentProfileView(studentId){
  const s = DB.students.find(x=>x.id===studentId);
  if(!s) return `<h2>Edit Student Profile</h2><div class="card"><p>Student not found.</p><button class="btn-outline" data-action="nav:students">Back to Students</button></div>`;
  const cls = DB.classes.find(c=>c.id===s.classId);
  const currentSubjects = cls ? studentSubjects(s, cls) : [];
  return `
  <h2>Edit Student Profile</h2>
  <div class="note">An Admin can edit a student's class, sex, and other bio-data here. Subjects are never set by the Admin — they're entirely each subject teacher's call, ticked from their own class list the first time they open it (and editable by them at any time after).</div>
  <div class="card" style="margin-top:14px;">
    <form data-form="updateStudentProfile" data-id="${s.id}">
      <div class="flex">
        <div><label>Photo</label><input type="file" name="photo" accept="image/*"></div>
        ${s.photo?`<img src="${s.photo}" class="photo-thumb">`:''}
      </div>
      <div class="grid3">
        <div><label>Full name</label><input name="name" value="${esc(s.name)}" required></div>
        <div><label>Admission number</label><input value="${esc(s.admNo)}" disabled style="background:#eef2f6;"></div>
        <div><label>Sex</label><select name="gender">
          <option value="Male" ${s.gender==='Male'?'selected':''}>Male</option>
          <option value="Female" ${s.gender==='Female'?'selected':''}>Female</option>
        </select></div>
      </div>
      <label>Fees Code No. (optional)</label>
      <input name="feesCode" value="${esc(s.feesCode||'')}" placeholder="Leave blank if this school doesn't use fees codes">
      <p class="small" style="margin-top:4px;">Entirely optional — not every school uses one. Handy for a student uploaded in bulk that didn't get one at the time. When set, it shows right alongside the admission number wherever that's displayed (student list, report card, etc.); when left blank, nothing extra shows at all.</p>
      <p class="small" style="margin-top:-6px;">The admission number itself can't be edited — it's permanent for as long as this student is at the school, even across a class change below.</p>
      <label>Class</label>
      <select name="classId" id="editStuClassSel" required>
      ${DB.classes.map(c=>`<option value="${c.id}" data-level="${c.level}" data-form="${c.form||''}" ${c.id===s.classId?'selected':''}>${esc(c.name)} (${esc(levelLabel(c))})</option>`).join('')}
      </select>
      <p class="small" style="margin-top:6px;">Moving a student to a different class does not carry subjects over — each subject teacher in the new class ticks them in separately.</p>
      <div class="grid2">
        <div><label>Fees balance</label><input name="feesBalance" type="number" step="0.01" value="${s.feesBalance!=null?s.feesBalance:''}"></div>
        <div><label>Next term fees</label><input name="nextTermFees" type="number" step="0.01" value="${s.nextTermFees!=null?s.nextTermFees:''}"></div>
      </div>
      <button class="btn" style="margin-top:14px;">Submit — save student profile</button>
    </form>
  </div>
  <div class="card">
    <h3>Subjects currently on record</h3>
    <p class="small">Read-only — reflects whichever subject teachers have ticked this student into their class list so far.</p>
    ${currentSubjects.length ? `<div>${currentSubjects.map(su=>`<span class="chip">${esc(su)}</span>`).join('')}</div>` : '<p class="small">No subject teacher has ticked this student in yet.</p>'}
  </div>
  <button class="btn-outline" data-action="nav:students">Back to Students</button>`;
}

/* ---------- Admin: Grading setup ---------- */
function gradingView(gcClassId){
  const b = DB.bands||DEFAULT_A_BANDS, ob = DB.obands||DEFAULT_O_BANDS, pb = DB.pbands||DEFAULT_P_BANDS;
  return `
  <h2>Grading Setup</h2>
  <div class="note">A-Level points are fixed: A=5, B=4, C=3, D=2, E=1, F=0. General Paper is pass/fail (O=1 point, F=0) —
  <b>O if the average is 50% and above, F if below 50%</b> — the exact same condition used for Subsidiary Mathematics and Subsidiary Computer.
  O-Level has no points, only A–E descriptors. Primary uses Uganda's PLE-style scale (D1–F9 per subject, Division 1–U on the aggregate of the 4 PLE-core subjects).
  All banding tables below are editable.</div>
  <div class="card" style="margin-top:14px;">
    <h3>A-Level bands (%)</h3>
    <form data-form="saveBands">
      <div class="grid3">
      ${['A','B','C','D','E'].map(g=>`<div><label>${g} min–max</label><div class="flex"><input name="${g}min" value="${b[g][0]}"><input name="${g}max" value="${b[g][1]}"></div></div>`).join('')}
      </div>
      <button class="btn" style="margin-top:14px;">Submit — save A-Level bands</button>
    </form>
  </div>
  <div class="card">
    <h3>O-Level bands (%)</h3>
    <form data-form="saveOBands">
      <div class="grid3">
      ${['A','B','C','D','E'].map(g=>`<div><label>${g} min–max</label><div class="flex"><input name="${g}min" value="${ob[g][0]}"><input name="${g}max" value="${ob[g][1]}"></div></div>`).join('')}
      </div>
      <button class="btn" style="margin-top:14px;">Submit — save O-Level bands</button>
    </form>
  </div>
  <div class="card">
    <h3>Primary bands (%) — per subject (PLE scale)</h3>
    <p class="small">Each subject is graded D1–F9 off its final average. The 4 PLE-core subjects (English, Mathematics, Science, Social Studies) also feed the Division on the report card: Division 1 = aggregate 4–12, Division 2 = 13–23, Division 3 = 24–29, Division 4 = 30–34, Division U = 35–36.</p>
    <form data-form="savePBands">
      <div class="grid3">
      ${PLE_GRADES.map(g=>`<div><label>${g} min–max</label><div class="flex"><input name="${g}min" value="${pb[g][0]}"><input name="${g}max" value="${pb[g][1]}"></div></div>`).join('')}
      </div>
      <button class="btn" style="margin-top:14px;">Submit — save Primary bands</button>
    </form>
  </div>
  <div class="card">
    <h3>Assessment weighting — Exam Type Setup</h3>
    <p class="small">This is the only place the exam structure is set. Decide how much <b>Course Work</b> (continuous assessment / tests) and <b>End of Term</b> are each worth, and switch either off if it isn't in use yet. Teachers still just enter the raw mark out of whatever a test was actually marked out of — the system automatically rescales it onto whichever percentage you set here. If you switch a component off (or no teacher has entered marks for it yet), its column won't appear on report cards until it's on and has marks — the report card grades automatically off whatever is entered so far.</p>
    <form data-form="saveExamConfig">
      <div class="grid2">
        <div class="card" style="margin:0;">
          <label class="flex"><input type="checkbox" name="cwEnabled" style="width:auto;" ${examConfig().cwEnabled?'checked':''}> <span>Course Work component is in use</span></label>
          <label>Label (shown on report card)</label><input name="cwLabel" value="${esc(examConfig().cwLabel)}">
          <label>Percent of final mark</label><input name="cwPercent" type="number" min="0" max="100" step="1" value="${examConfig().cwPercent}">
        </div>
        <div class="card" style="margin:0;">
          <label class="flex"><input type="checkbox" name="eotEnabled" style="width:auto;" ${examConfig().eotEnabled?'checked':''}> <span>End of Term component is in use</span></label>
          <label>Label (shown on report card)</label><input name="eotLabel" value="${esc(examConfig().eotLabel)}">
          <label>Percent of final mark</label><input name="eotPercent" type="number" min="0" max="100" step="1" value="${examConfig().eotPercent}">
        </div>
      </div>
      <p class="small">The two percentages should add up to 100 when both components are switched on.</p>
      <button class="btn" style="margin-top:14px;">Submit — save exam type setup</button>
    </form>
  </div>
  <div class="card">
    <h3>Course Work Tests</h3>
    <p class="small">Define the individual tests that make up ${esc(examConfig().cwLabel)} — e.g. Test 1, Test 2, BOT — each with its own maximum. Once you add tests here, teachers pick from this list (instead of typing a label) when entering scores, and each test gets its own column on mark sheets and report cards, alongside the overall ${esc(examConfig().cwLabel)} average used for grading.</p>
    <table class="data-table"><tr><th>Test name</th><th>Max score</th><th>Remove</th></tr>
    ${examConfig().cwTests.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(String(t.max))}</td><td><button class="btn-danger" data-action="delCwTest:${t.id}">Delete</button></td></tr>`).join('') || `<tr><td colspan="3">No tests set up yet — teachers will use a free-text label until you add some here.</td></tr>`}
    </table>
    <form data-form="addCwTest" style="margin-top:12px;">
      <div class="grid2">
        <div><label>Test name</label><input name="name" placeholder="e.g. Test 1" required></div>
        <div><label>Max score</label><input name="max" type="number" min="1" step="1" value="20" required></div>
      </div>
      <button class="btn" style="margin-top:10px;">Submit — add test</button>
    </form>
  </div>
  <div class="card">
    <h3>Per-Class Assessment Type</h3>
    <p class="small">Every class follows the school-wide setup above by default. If one class needs a genuinely different assessment type — different components, labels, weighting, or its own named tests — turn on a custom setup for just that class here, so it's ready whenever that situation comes up (e.g. a class marked exams-only, or one with extra continuous assessment tests other classes don't have). Every other class keeps using the school-wide setup untouched.</p>
    <label>Class</label>
    <select onchange="setAnalysisParam('gcClassId', this.value)">
      <option value="">-- choose a class to view/set its assessment type --</option>
      ${DB.classes.map(c=>`<option value="${c.id}" ${c.id===gcClassId?'selected':''}>${esc(c.name)} (${esc(levelLabel(c))})</option>`).join('') || ''}
    </select>
    ${(()=>{
      if(!gcClassId) return '';
      const gcls = DB.classes.find(c=>c.id===gcClassId);
      if(!gcls) return '<p class="small" style="margin-top:10px;">Class not found.</p>';
      const cc = gcls.examConfig || {};
      const ccfg = examConfig(gcClassId); // resolved values (custom if on, otherwise the school default) — used to prefill the form either way
      const classCwTests = Array.isArray(cc.cwTests) ? cc.cwTests : [];
      return `
      <div class="card" style="margin-top:14px;background:var(--blue-light);">

// A big class (or a Master Mark Sheet with many subjects) can make for a very tall
// table on a phone or laptop screen — this splits the ON-SCREEN view into pages of
// MARKSHEET_PAGE_SIZE students at a time so it stays scrollable and readable.
// Downloads and prints NEVER use this: both are always generated from the FULL,
// unpaginated student list (see the forExport parameter on integratedMarksheetView
// and masterMarkSheetView, and the dlIntegratedPdf/dlMasterMarkSheetPdf/
// printIntegrated/printMasterMarkSheet action handlers), so a downloaded or printed
// mark sheet always contains every student regardless of which on-screen page is
// showing when the button is clicked.
const MARKSHEET_PAGE_SIZE = 25;
function paginateMarksheet(list, page, forExport, pageSize){
  const size = pageSize || MARKSHEET_PAGE_SIZE;
  const total = list.length;
  const totalPages = Math.max(1, Math.ceil(total/size));
  if(forExport) return { pageItems:list, page:1, totalPages:1, total, size, startIndex:0 };
  const p = Math.min(Math.max(1, Number(page)||1), totalPages);
  const startIndex = (p-1)*size;
  return { pageItems:list.slice(startIndex, startIndex+size), page:p, totalPages, total, size, startIndex };
}
function marksheetPaginationBar(page, totalPages, total, size, startIndex, pageAction){
  if(totalPages<=1) return '';
  const from = total? startIndex+1 : 0, to = Math.min(startIndex+size, total);
  return `
  <div class="flex" style="justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap;">
    <span class="small">Showing ${from}–${to} of ${total} students — page ${page} of ${totalPages}</span>
    <div class="flex">
      <button class="btn-outline" ${page<=1?'disabled':''} data-action="${pageAction}:${page-1}">‹ Prev</button>
      <button class="btn-outline" ${page>=totalPages?'disabled':''} data-action="${pageAction}:${page+1}">Next ›</button>
    </div>
  </div>
  <div class="note" style="margin-top:8px;">This page shows students ${from}–${to} on screen for readability. <b>Downloading or printing this mark sheet always includes all ${total} students</b>, no matter which page is shown here.</div>`;
}

// Every teacher assigned to a class+subject may keep their own roster (a.studentIds).
// The integrated view's roster is the union of all of those, plus anyone still
// eligible for the subject who hasn't been placed on a roster yet.
function marksheetRoster(classId, subject){
  const cls = DB.classes.find(c=>c.id===classId);
  const asns = DB.assignments.filter(a=>a.classId===classId && a.subject===subject);
  const rosterIds = new Set();
  let anyRosterSet = false;
  asns.forEach(a=>{ if(Array.isArray(a.studentIds)){ anyRosterSet=true; a.studentIds.forEach(id=>rosterIds.add(id)); } });
  const students = sortByName(anyRosterSet
    ? DB.students.filter(s=>s.classId===classId && (rosterIds.has(s.id) || studentSubjects(s,cls).includes(subject)))
    : DB.students.filter(s=>s.classId===classId && studentSubjects(s,cls).includes(subject)));
  return {cls, students};
}
function marksheetColumns(students, subject){
  const term = DB.info.currentTerm, year = DB.info.currentYear;
  const seen = new Map();
  students.forEach(s=>{
    DB.scores.filter(sc=>sc.studentId===s.id && sc.subject===subject && sc.term===term && sc.year===year).forEach(sc=>{
      const key = sc.paper+'||'+sc.kind+'||'+(sc.kind==='AOI'?sc.label:'');
      if(!seen.has(key)) seen.set(key, {paper:sc.paper, kind:sc.kind, label:sc.label||''});
    });
  });
  const cols = [...seen.values()];
  cols.sort((x,y)=>{
    if(String(x.paper)!==String(y.paper)) return String(x.paper).localeCompare(String(y.paper), undefined, {numeric:true});
    if(x.kind!==y.kind) return x.kind==='AOI' ? -1 : 1;
    return (x.label||'').localeCompare(y.label||'');
  });
  return cols;
}

}
