<!-- ======================================================================
  FIREBASE (real, shared, cross-device database).
  This app now stores its data in Firestore instead of the browser, so a
  phone, a laptop, and a different person all see the SAME data.

  TO ACTIVATE (one-time, ~5 minutes, free):
   1. Go to https://console.firebase.google.com → "Add project" (any name).
   2. In the project, open Build → Firestore Database → "Create database"
      → choose "Start in test mode" (you can lock it down later).
   3. Open Project settings (gear icon) → General → "Your apps" → click
      the web icon (</>) → register an app (any nickname, no hosting needed).
   4. Firebase shows you a firebaseConfig object. Copy it and paste it
      below, replacing the placeholder values.
   5. Save this file and reload — the yellow "not connected" banner will
      disappear once it's working.
  Until you do this, the app runs in DEMO MODE (data stays only on this
  device) so you can still click through everything.
======================================================================= -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<!-- firebase-storage-compat.js intentionally NOT loaded: photos are stored inline in
     Firestore as compressed base64 (see uploadPhotoToStorage), so Storage is unused —

     jsPDF, html2canvas and mammoth (.docx import) are loaded lazily on first use
     instead of blocking every page load — see loadPdfLibs()/loadMammothLib() below. -->

<style>
:root{
  --navy:#0A2A4A; --blue:#1D4E89; --blue-light:#E9F1FA; --gold:#C9A227;
  --ink:#132436; --paper:#FFFFFF; --muted:#5A7189; --danger:#B23A3A; --good:#1E7A46;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--blue-light);color:var(--ink);}
h1,h2,h3,.display{font-family:Georgia,'Playfair Display',serif;}
button{font-family:inherit;cursor:pointer;}
.btn{background:var(--blue);color:#fff;border:none;padding:10px 18px;border-radius:6px;font-weight:700;font-size:14px;}
.btn:hover{background:var(--navy);}
.btn-outline{background:#fff;color:var(--blue);border:2px solid var(--blue);padding:9px 16px;border-radius:6px;font-weight:700;}
.btn-danger{background:var(--danger);color:#fff;border:none;padding:8px 14px;border-radius:6px;font-weight:600;}
.btn-gold{background:var(--gold);color:#3a2c00;border:none;padding:10px 18px;border-radius:6px;font-weight:800;}
input,select,textarea{padding:9px 10px;border:1px solid #b9c9da;border-radius:5px;font-size:16px;width:100%;font-family:inherit;}
input.missing-mark::placeholder{color:var(--danger);font-weight:800;opacity:.85;}
label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.03em;}
.card{background:#fff;border-radius:10px;padding:22px;box-shadow:0 2px 10px rgba(10,42,74,.08);margin-bottom:18px;}
.topbar{background:var(--navy);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.topbar .brand{font-family:Georgia,serif;font-weight:800;font-size:22px;letter-spacing:.02em;}
.topbar .brand span{color:var(--gold);}
.layout{display:flex;min-height:calc(100vh - 60px);flex-wrap:wrap;}
.sidebar{width:230px;background:var(--navy);color:#dce8f5;padding:16px 0;}
.sidebar a{display:block;padding:12px 22px;color:#dce8f5;text-decoration:none;font-size:14px;font-weight:600;border-left:4px solid transparent;}
.sidebar a.active,.sidebar a:hover{background:rgba(255,255,255,.08);border-left:4px solid var(--gold);}
.main{flex:1;min-width:280px;padding:26px;max-width:1150px;}
table{border-collapse:collapse;width:100%;background:#fff;}
table.report-table, table.data-table{border:2px solid var(--blue);}
table.report-table th, table.report-table td, table.data-table th, table.data-table td{border:1px solid var(--blue);padding:7px 9px;font-size:13px;text-align:center;}
table.report-table th, table.data-table th{background:var(--blue);color:#fff;font-weight:900;text-transform:uppercase;font-size:11px;letter-spacing:.03em;}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--navy),var(--blue));padding:20px;}
.auth-box{background:#fff;padding:36px;border-radius:14px;width:420px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.auth-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.auth-tabs button{flex:1;min-width:90px;padding:9px;border:2px solid var(--blue);background:#fff;color:var(--blue);border-radius:6px;font-weight:700;font-size:13px;}
.auth-tabs button.active{background:var(--blue);color:#fff;}
.role-icons{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;}
.role-icon-btn{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:none;cursor:pointer;padding:4px;}
.role-icon-circle{width:56px;height:56px;border-radius:50%;border:2px solid var(--blue);display:flex;align-items:center;justify-content:center;font-size:24px;background:#fff;color:var(--blue);transition:background .15s,color .15s;}
.role-icon-btn.active .role-icon-circle{background:var(--blue);color:#fff;}
.role-icon-label{font-size:12px;font-weight:700;color:var(--muted);}
.role-icon-btn.active .role-icon-label{color:var(--blue);}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:var(--blue-light);color:var(--blue);}
.note{background:#FFF7E0;border:1px solid var(--gold);padding:12px 14px;border-radius:8px;font-size:13px;color:#5a4a00;}
.warn-banner{background:#7a1f1f;color:#fff;text-align:center;padding:8px 14px;font-size:13px;font-weight:600;}
.warn-banner a{color:#ffe9b0;}
.ok-banner{background:#0f5c33;color:#fff;text-align:center;padding:6px 14px;font-size:12px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.school-name-big{font-size:28px;font-weight:800;font-family:Georgia,serif;color:var(--navy);}
.photo-thumb{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--blue);}
.small{font-size:12px;color:var(--muted);}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.badge-role{background:var(--gold);color:#3a2c00;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:800;text-transform:uppercase;}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--blue-light);color:var(--blue);border-radius:14px;padding:3px 10px;font-size:12px;margin:2px;}

/* ---- Dashboard icon tiles: tap-to-open feature grid, sized to fit a phone screen ---- */
.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;margin:6px 0 22px;}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#fff;
  border:1px solid #cfd9e3;border-radius:12px;padding:14px 6px;box-shadow:0 1px 4px rgba(10,42,74,.06);
  text-align:center;font-family:inherit;transition:box-shadow .12s ease,border-color .12s ease,transform .12s ease;}
.tile:hover, .tile:active{border-color:var(--blue);box-shadow:0 3px 12px rgba(10,42,74,.14);transform:translateY(-1px);}
.tile-icon{font-size:26px;line-height:1;}
.tile-label{font-size:11.5px;font-weight:700;color:var(--navy);line-height:1.25;}

/* ---- Delivered-command toast: brief confirmation that a Submit tap went through ---- */
#deliveredToast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--good);color:#fff;
  padding:10px 20px;border-radius:24px;font-weight:700;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);
  display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:9999;}
#deliveredToast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#deliveredToast .tick{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.25);font-size:12px;line-height:1;}

/* ---- Report card (Sample School official layout) ---- */
.rc-card{background:#fff;padding:26px 30px 22px;border:1px solid #cfd9e3;width:100%;max-width:800px;margin:0 auto;font-family:Georgia,'Times New Roman',serif;color:var(--ink);position:relative;overflow:hidden;}
/* Faint background watermark of the school logo — purely decorative, sits behind every
   other element on the card via z-index. Centered and oversized (60% of the card width)
   at very low opacity so it never competes with the actual text/tables for legibility,
   and never printed/exported darker than intended since opacity is baked into the image
   itself via CSS (not something a printer driver can "brighten" back to full strength).
   pointer-events:none so it never intercepts clicks/taps on the editable score cells
   above it. This is separate from — and does not change — the sharp, full-opacity logo
   already shown in the header block (.rc-title-block .rc-logo below). */
.rc-watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:60%;max-width:480px;opacity:.06;z-index:0;pointer-events:none;user-select:none;}
.rc-content{position:relative;z-index:1;}
.rc-topline{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);margin-bottom:8px;font-family:monospace;letter-spacing:.02em;}
.rc-title-block{display:flex;align-items:stretch;gap:12px;text-align:center;border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:14px;}
/* Logo is sized to match the header text block's own height (via align-items:stretch
   + height:100% + aspect-ratio) instead of a fixed px value, so it always looks
   proportionate to the school name/subtitle/meta stack next to it. This is a
   display-only change — the underlying base64 image data is untouched, so it adds
   no extra network request and no re-encoding cost, meaning resolution and
   download/render speed are unaffected. object-fit:cover still crops any source
   image cleanly into that box. */
.rc-title-block .rc-logo{height:100%;width:auto;aspect-ratio:1/1;max-width:90px;object-fit:cover;border-radius:6px;flex-shrink:0;}
.rc-title-block .rc-header-text{flex:1;min-width:0;}
/* School name is the single boldest text on the report card. CSS font-weight tops out
   at 900 (the same weight now used by subject names, table titles, and column titles
   below), so a hairline text-stroke is layered on top of font-weight:900 here to push
   the school name visibly heavier than everything else without reducing their weight. */
.rc-title-block .school{font-size:26px;font-weight:900;-webkit-text-stroke:0.4px currentColor;text-transform:uppercase;letter-spacing:.03em;color:var(--navy);line-height:1.15;margin:2px 0;}
.rc-title-block .subtitle{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-top:3px;}
.rc-title-block .meta{font-size:11px;font-style:italic;color:var(--muted);margin-top:4px;}

/* The bio photo now lives INSIDE rc-info-table (as a rowspan cell) instead of
   sitting beside it in a flex row — that old layout shrank the table's own
   width by the photo's width+gap, so its right edge fell short of every other
   table on the card. As a plain cell in the same full-width table, the photo
   no longer affects the table's outer edges, so all tables now line up on
   identical left/right edges. */
.rc-bio-photo{width:64px;height:64px;object-fit:cover;border:1px solid var(--blue);border-radius:4px;}
table.rc-info-table{width:100%;border-collapse:collapse;margin-bottom:16px;}
table.rc-info-table td{border:1.4px solid var(--blue);padding:6px 10px;font-size:12px;}
table.rc-info-table td.lbl{background:var(--blue-light);font-weight:900;text-transform:uppercase;font-size:10px;letter-spacing:.03em;color:var(--navy);}
table.rc-info-table td.val{font-weight:700;}
table.rc-info-table td.photo-cell{width:74px;padding:5px;text-align:center;vertical-align:middle;background:#fff;}

.rc-section-title{font-size:12.5px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;color:var(--navy);border-bottom:2px solid var(--navy);padding-bottom:4px;margin:16px 0 8px;}

table.rc-perf{width:100%;border-collapse:collapse;margin-bottom:6px;}
table.rc-perf th{background:var(--blue-light);color:var(--navy);border:1.4px solid var(--blue);padding:6px 8px;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.02em;}
table.rc-perf td{border:1.4px solid var(--blue);padding:6px 8px;font-size:12px;text-align:center;}
table.rc-perf td:first-child{text-align:left;font-weight:900;}
table.rc-perf tbody tr:nth-child(even){background:#F7FAFD;}
table.rc-perf tr.total td{font-weight:800;background:var(--blue-light);border-top:2.4px solid var(--blue);}
table.rc-perf tr.subrow td{font-size:11px;color:var(--muted);background:#FBFDFF;}
table.rc-perf tr.subrow td:first-child{font-weight:400;font-style:italic;padding-left:22px;}

table.rc-summary-table{width:100%;border-collapse:collapse;margin:14px 0;}
table.rc-summary-table td{border:1.4px solid var(--blue);padding:8px 10px;font-size:12px;text-align:center;}
table.rc-summary-table td.lbl{background:var(--blue-light);font-weight:900;text-transform:uppercase;font-size:10px;letter-spacing:.02em;color:var(--navy);}
table.rc-summary-table td.val{font-weight:800;}

table.rc-comments-table{width:100%;border-collapse:collapse;margin-bottom:16px;}
table.rc-comments-table th{background:var(--blue-light);border:1.4px solid var(--blue);padding:6px 10px;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.02em;color:var(--navy);text-align:left;}
table.rc-comments-table td{border:1.4px solid var(--blue);padding:9px 10px;font-size:11.5px;vertical-align:top;width:50%;}

.rc-sign-row{display:flex;justify-content:space-between;font-size:11px;margin:18px 0 10px;flex-wrap:wrap;gap:14px 10px;}
.rc-sign-row span{border-bottom:1px solid var(--ink);padding-bottom:3px;min-width:120px;display:inline-block;}

.rc-termdates{text-align:center;font-size:11.5px;font-weight:700;margin:4px 0 10px;}
.rc-motto{text-align:center;font-style:italic;font-size:12.5px;color:var(--navy);margin-top:8px;}

.legend-strip{display:flex;gap:9px;flex-wrap:wrap;font-size:9.5px;margin-top:10px;color:var(--muted);align-items:center;justify-content:center;}
.legend-strip b{color:var(--ink);}

@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{position:absolute;top:0;left:0;width:100%;}
  table{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  @page{ size:A4; margin:10mm; }
}
@media (max-width:760px){
  .layout{flex-direction:column;}
  .sidebar{width:100%;display:flex;overflow-x:auto;padding:6px;}
  .sidebar a{white-space:nowrap;border-left:none;border-bottom:3px solid transparent;}
  .sidebar a.active{border-bottom:3px solid var(--gold);}
  .grid2,.grid3{grid-template-columns:1fr;}
  .main{padding:14px;}
  table.data-table, table.report-table, table.rc-info-table, table.rc-summary-table, table.rc-comments-table{
    display:block; overflow-x:auto; -webkit-overflow-scrolling:touch;
    white-space:nowrap; border:1px solid var(--blue);
  }
  table.data-table thead, table.data-table tbody, table.data-table tr,
  table.report-table thead, table.report-table tbody, table.report-table tr{ display:table; width:100%; table-layout:auto; }
  /* rc-perf (Academic Performance Analysis) uses rowspan/colspan to merge cells across
     a subject's paper rows and Course Work test columns — forcing its rows to
     display:table (like the other tables above) would break that merging, so instead
     it keeps native table layout and scrolls horizontally via its wrapper div (see
     .rc-perf-wrap) with a minimum width so columns don't get squeezed unreadably. */
  .rc-perf-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--blue); }
  table.rc-perf{ min-width:640px; border:none; }
  .card{padding:16px;}
  .auth-box{padding:26px;}
}
/* Boot splash — shown only until the very first render() call replaces #app's
   contents, so it never needs to be manually hidden or torn down. */
.boot-splash{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:var(--navy);
}
.boot-splash-icon{
  width:84px;height:84px;border-radius:20px;box-shadow:0 6px 24px rgba(0,0,0,.35);
  animation:boot-spin 1.1s cubic-bezier(.5,0,.5,1) infinite;
}
@keyframes boot-spin{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}
.boot-splash-brand{font-family:Georgia,'Playfair Display',serif;font-size:22px;font-weight:800;color:#fff;letter-spacing:.02em;}
.boot-splash-brand span{color:var(--gold);}
.boot-splash-sub{font-size:13px;color:#cfe0f2;letter-spacing:.04em;}
</style>

     render() overwrites #app's innerHTML on first successful boot, which
     naturally removes this — no extra code needed to dismiss it. -->

</div>

<script>
/* ============================================================
   1. FIREBASE CONFIG — replace with your own project's values
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyDAFHHDkBlcS2Kmllk8_H7Sc2PwvDyI7OQ",
  authDomain: "ct----reports.firebaseapp.com",
  projectId: "ct----reports",
  storageBucket: "ct----reports.firebasestorage.app",
  messagingSenderId: "898572380549",
  appId: "1:898572380549:web:9f1264646161aca9a23cec"
};
const FIREBASE_READY = firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf('YOUR_') !== 0;
let db = null, storage = null, DEMO_MODE = !FIREBASE_READY;
let AUTH_READY = null; // promise that resolves once signed in (real mode only)
if(FIREBASE_READY){
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    // Photos are stored as compressed base64 strings directly inside their
    // Firestore document (see uploadPhotoToStorage below) — Firebase Storage
    // is not used, since it requires the paid "Blaze" plan even for small
    // amounts of data.
    // Silent anonymous sign-in: gives Firestore security rules something to
    // check (request.auth != null) without showing the user any extra login
    // screen — the app's own username/password system is unaffected.
    AUTH_READY = new Promise((resolve, reject)=>{
      firebase.auth().onAuthStateChanged((user)=>{
        if(user) resolve(user);
      });
      firebase.auth().signInAnonymously().catch((e)=>{
        console.error('Anon auth failed:', e);
        reject(e);
      });
    });
  }
  catch(e){ console.error(e); DEMO_MODE = true; }
}
const COLLECTION = 'cte_solutions';

/* ============================================================
   1A. AUTOMATIC SNAPSHOTS
   ============================================================
   Separate from the manual "Download full backup" feature (which relies on
   someone remembering to click a button), the app also takes its own backup
   copies in the background — no download, no action required. Every time a
   school's data loads and it's been at least AUTO_SNAPSHOT_MIN_GAP_DAYS
   since the last one, a full snapshot of that school's data is written into
   Firestore itself, under its own keys (never overwriting live data). The
   last AUTO_SNAPSHOT_KEEP snapshots are kept; older ones are deleted
   automatically so storage doesn't grow forever. An Admin can restore any
   of these from the "Backup & Restore" card, the same way they'd restore
   from a downloaded file.
   ============================================================ */
const AUTO_SNAPSHOT_MIN_GAP_DAYS = 7;
const AUTO_SNAPSHOT_KEEP = 6; // ~6 weeks of history at the default weekly cadence

/* ============================================================
   1B. BACKUP SCHEMA VERSIONING & MIGRATION
   ============================================================
   Every backup file carries a schemaVersion number. migrateBackupData()
   normalizes ANY backup — old or new, from this version of the app or a
   future one — into the shape the CURRENTLY RUNNING code expects, filling in
   sensible defaults for fields that didn't exist yet when the backup was
   made. This is what lets a backup be restored correctly no matter how many
   updates/upgrades have happened to the app in between: as long as this
   function is updated whenever a new field is added elsewhere (a one-line
   addition), every past backup keeps working forever. Unknown fields (e.g.
   from a NEWER backup being restored into older code) are preserved via the
   initial spread rather than silently dropped, so nothing is lost on a
   later re-restore either.
   ============================================================ */
// Founder's contact line, shown under the "CT-E SOLUTIONS" brand on every screen that
// displays it (boot splash, all sign-in/sign-up screens, the main app topbar, and the
// Founder Panel topbar). Kept as one constant so all of them always stay in sync — change
// the number here once and it updates everywhere.
const FOUNDER_CONTACT = 'Tel: 0757132542 / 0786814513';
const BACKUP_SCHEMA_VERSION = 2;
function migrateBackupData(raw){
  const d = (raw && typeof raw==='object') ? raw : {};
  const info = {...(d.info||{})};
  info.oExtraSubjects = Array.isArray(info.oExtraSubjects) ? info.oExtraSubjects : [];
  info.pExtraSubjects = Array.isArray(info.pExtraSubjects) ? info.pExtraSubjects : [];
  info.aExtraSubjects = Array.isArray(info.aExtraSubjects) ? info.aExtraSubjects : [];
  info.examConfig = info.examConfig || {};
  // oCompulsoryLower/oCompulsoryUpper (and the newer pCompulsory/aCompulsoryExtra) are
  // deliberately left untouched if absent — their respective helper functions already
  // treat "not present" as "use the syllabus defaults".
  return {
    ...d, // keep any fields this version of the code doesn't know about yet
    schemaVersion: BACKUP_SCHEMA_VERSION,
    info,
    accounts: Array.isArray(d.accounts) ? d.accounts : [],
    classes: Array.isArray(d.classes) ? d.classes : [],
    students: Array.isArray(d.students) ? d.students : [],
    assignments: Array.isArray(d.assignments) ? d.assignments : [],
    scores: Array.isArray(d.scores) ? d.scores : [],
    bands: d.bands || DEFAULT_A_BANDS,
    obands: d.obands || DEFAULT_O_BANDS,

   that one SHOULD stay local, so each device can be logged in separately).

async function getShared(key, fallback){
  if(DEMO_MODE){ try{ const raw = localStorage.getItem('cte_demo_'+key); return raw!==null? JSON.parse(raw): fallback; }catch(e){ return fallback; } }
  try{
    if(AUTH_READY) await AUTH_READY;

    return snap.exists ? snap.data().value : fallback;

      showFatal('Sign-in to the database failed. In the Firebase console, go to Build → Authentication → Sign-in method, and enable "Anonymous".');
    } else {
      showFatal('Could not reach the database. Check your internet connection and Firestore setup.');
    }

  }
}

/* ------------------------------------------------------------
   SCORES ARE SHARDED, one small document per term+year, instead of one
   ever-growing document for a school's whole history. Firestore hard-caps
   every document at 1MiB; a single school's scores (every test, every
   subject, every term, forever) would eventually blow past that. Splitting
   by term+year keeps each document small no matter how many years of data
   pile up, while the app still reads/writes DB.scores as one in-memory
   array everywhere else — only the load/save layer changed.
------------------------------------------------------------- */
function scoreShardKey(term, year){ return `${year}_${term}`; }
// Converts a term/year into a single increasing number so "how far back is this
// term" is a simple subtraction — Term 1 2025 < Term 2 2025 < Term 1 2026, etc.
function termIndex(term, year){
  const n = {'Term 1':1,'Term 2':2,'Term 3':3}[term] || 0;
  return (Number(year)||0)*3 + n;
}
// Admins can look back at most this many terms from the school's current term —
// results/report cards for the current term plus the MAX_TERMS_BEHIND terms
// before it stay available; anything older is pruned to keep storage minimal.
const MAX_TERMS_BEHIND = 5;
function termsBehindCurrent(term, year){ return termIndex(DB.info.currentTerm, DB.info.currentYear) - termIndex(term, year); }
// Deletes any score shard older than the MAX_TERMS_BEHIND retention window. Called
// whenever the school's current term/year is advanced (see the "setTerm" form),
// which is the natural point at which older terms roll out of the window.
async function pruneOldScores(){
  if(!SCHOOL_ID || !DB.info) return;
  const keep = [], dropKeys = new Set();
  DB.scores.forEach(r=>{
    const dist = termsBehindCurrent(r.term, r.year);
    if(dist>=0 && dist<=MAX_TERMS_BEHIND) keep.push(r); else dropKeys.add(scoreShardKey(r.term, r.year));
  });
  if(!dropKeys.size) return;
  DB.scores = keep;
  await Promise.all([...dropKeys].map(k=>setShared(`sch_${SCHOOL_ID}_scores_${k}`, [])));
  const known = KNOWN_SCORE_SHARDS[SCHOOL_ID] || new Set();
  dropKeys.forEach(k=>known.delete(k));
  KNOWN_SCORE_SHARDS[SCHOOL_ID] = known;
}
async function loadAllScores(schoolId){
  const prefix = `sch_${schoolId}_scores_`;
  let rows = [];
  const shardKeys = new Set();
  if(DEMO_MODE){
    const localPrefix = 'cte_demo_'+prefix;
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(localPrefix)===0){
        shardKeys.add(k.slice(localPrefix.length));
        try{ rows = rows.concat(JSON.parse(localStorage.getItem(k))||[]); }catch(e){}
      }
    }
  } else {
    try{
      if(AUTH_READY) await AUTH_READY;
      const end = prefix + '\uf8ff';
      const snap = await db.collection(COLLECTION)
        .where(firebase.firestore.FieldPath.documentId(), '>=', prefix)
        .where(firebase.firestore.FieldPath.documentId(), '<=', end)
        .get();
      snap.forEach(doc=>{
        shardKeys.add(doc.id.slice(prefix.length));
        rows = rows.concat((doc.data().value)||[]);
      });
    }catch(e){
      console.error(e);
      showFatal('Could not reach the database. Check your internet connection and Firestore setup.');
    }
  }
  KNOWN_SCORE_SHARDS[schoolId] = shardKeys;
  // One-time migration: scores created before sharding all lived in one
  // sch_{id}_scores document. Fold any of those in, then saveScores() will
  // write them out into proper shards and this legacy doc gets cleaned up.
  const legacy = await getShared(`sch_${schoolId}_scores`, null);
  if(legacy && legacy.length){
    const seen = new Set(rows.map(r=>r.id));
    legacy.forEach(r=>{ if(!seen.has(r.id)) rows.push(r); });
  }
  return rows;
}
async function purgeScoreShards(schoolId){
  const prefix = `sch_${schoolId}_scores_`;
  if(DEMO_MODE){
    const localPrefix = 'cte_demo_'+prefix;
    const toRemove = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(localPrefix)===0) toRemove.push(k);
    }
    toRemove.forEach(k=>localStorage.removeItem(k));
    return;
  }
  try{
    if(AUTH_READY) await AUTH_READY;
    const end = prefix + '\uf8ff';
    const snap = await db.collection(COLLECTION)
      .where(firebase.firestore.FieldPath.documentId(), '>=', prefix)
      .where(firebase.firestore.FieldPath.documentId(), '<=', end)
      .get();
    await Promise.all(snap.docs.map(d=>d.ref.delete()));
  }catch(e){ console.error(e); }
}
async function saveScoresShardedFor(schoolId, scores){
  const groups = {};
  (scores||[]).forEach(r=>{ const k=scoreShardKey(r.term, r.year); (groups[k]=groups[k]||[]).push(r); });
  const keys = new Set(Object.keys(groups));
  const known = KNOWN_SCORE_SHARDS[schoolId] || new Set();
  const writes = [];
  keys.forEach(k=> writes.push(setShared(`sch_${schoolId}_scores_${k}`, groups[k])) );
  // A term/year that used to have scores but has none now (e.g. last row for
  // that term was deleted) — clear its shard instead of leaving stale data.
  known.forEach(k=>{ if(!keys.has(k)) writes.push(setShared(`sch_${schoolId}_scores_${k}`, [])); });
  await Promise.all(writes);
  await deleteShared(`sch_${schoolId}_scores`); // one-time cleanup of the old single-doc format
  KNOWN_SCORE_SHARDS[schoolId] = keys;
}

/* ------------------------------------------------------------
   CONCURRENT-SAFE, NO-WAIT SCORE WRITES.
   Two things matter when several teachers save marks at the same moment:
   (1) no teacher should ever sit and wait for the network just to see their
       own mark reflected, no matter how many others are saving right then,
       and (2) every mark any of them submits must end up permanently stored
       and visible on report cards — none silently dropped.

   INSTANT (no delay): upsertScores()/deleteScores() merge the change into
   the in-memory DB.scores array synchronously, before any network request
   even starts. Callers can render the updated screen immediately after
   calling them — the on-screen data is already correct by the time the
   function call returns, regardless of how long the actual save takes.

   GUARANTEED PERSISTENCE (no lost writes): the real save happens inside a
   Firestore transaction (mergeScoreShard below), not a plain "read, then
   write". A transaction reads the shard's current server state and writes
   the merged result back atomically; if a second teacher's transaction
   touched the same shard in between, Firestore detects that conflict itself
   and automatically re-runs the transaction against the new state — so two,
   ten, or fifty teachers saving marks in the exact same instant can never
   overwrite one another. Every submitted mark is retried until it's safely
   stored, entirely transparently, with no extra waiting on the teacher's end.

   Rows are matched by natural key (student+subject+paper+kind+label+term+
   year) as well as by id, so that if two tabs each generate a fresh id for
   what turns out to be the same logical mark, the merge still lands as one
   corrected value instead of two duplicate rows.
------------------------------------------------------------- */
function scoreNaturalKey(r){ return [r.studentId,r.subject,r.paper,r.kind,r.label||'',r.term,r.year].join('|'); }
function mergeRowIntoShard(fresh, row){
  let idx = fresh.findIndex(x=>x.id===row.id);
  if(idx<0){
    idx = fresh.findIndex(x=>scoreNaturalKey(x)===scoreNaturalKey(row));
    // Same logical mark already exists under a different id (a race between
    // two tabs creating it at once) — keep the existing id so we correct
    // that one row instead of adding a duplicate.
    if(idx>=0) row = Object.assign({}, row, {id: fresh[idx].id});
  }
  if(idx>=0) fresh[idx]=row; else fresh.push(row);
  return fresh;
}
async function mergeScoreShard(schoolId, term, year, mutate){
  const shardSuffix = scoreShardKey(term, year);
  const shardKey = `sch_${schoolId}_scores_${shardSuffix}`;
  let merged;
  if(DEMO_MODE){
    // Single device — no real concurrent writers, so a plain read-merge-write
    // (via localStorage) is safe and there's no transaction API to use here.
    const fresh = await getShared(shardKey, []);
    merged = mutate(fresh.slice());
    await setShared(shardKey, merged);
  } else {
    if(AUTH_READY) await AUTH_READY;
    merged = await db.runTransaction(async tx=>{
      const ref = db.collection(COLLECTION).doc(shardKey);
      const snap = await tx.get(ref);
      const fresh = snap.exists ? (snap.data().value||[]) : [];
      const result = mutate(fresh.slice());
      tx.set(ref, { value: result, updatedAt: Date.now() });
      return result;
    });
  }
  const known = KNOWN_SCORE_SHARDS[schoolId] = KNOWN_SCORE_SHARDS[schoolId] || new Set();
  known.add(shardSuffix);
  if(schoolId===SCHOOL_ID){
    // Reconcile with the authoritative, transaction-merged server truth —
    // this folds in anything another teacher saved to this same shard in
    // the meantime too, not just this tab's own change.
    DB.scores = DB.scores.filter(r=>scoreShardKey(r.term,r.year)!==shardSuffix).concat(merged);
  }
  return merged;
}
// Upsert one or more score rows. Updates DB.scores immediately (synchronously,
// before the returned promise's network write even begins) so the caller can
// render right away; the promise resolves once the change is safely and
// permanently persisted (or rejects if it ultimately couldn't be saved, e.g.
// no connection — callers should surface that to the teacher rather than
// assume success).
function upsertScores(rows){
  rows = Array.isArray(rows) ? rows : [rows];
  if(!rows.length) return Promise.resolve();
  rows.forEach(row=>{ mergeRowIntoShard(DB.scores, row); }); // optimistic local update
  const byShard = {};
  rows.forEach(r=>{
    const k = scoreShardKey(r.term, r.year);
    (byShard[k] = byShard[k] || {term:r.term, year:r.year, rows:[]}).rows.push(r);
  });
  return Promise.all(Object.values(byShard).map(({term,year,rows})=>
    mergeScoreShard(SCHOOL_ID, term, year, fresh=>{
      rows.forEach(row=>{ mergeRowIntoShard(fresh, row); });
      return fresh;
    })
  ));
}
// Delete one or more score rows. Pass the full row (not just an id) so the
// row's term/year is known and the right shard gets merged. Same instant
// local update + guaranteed-persistence pattern as upsertScores.
function deleteScores(rows){
  rows = Array.isArray(rows) ? rows : [rows];
  if(!rows.length) return Promise.resolve();
  const idsToRemove = new Set(rows.map(r=>r.id));
  DB.scores = DB.scores.filter(x=>!idsToRemove.has(x.id)); // optimistic local update
  const byShard = {};
  rows.forEach(r=>{
    const k = scoreShardKey(r.term, r.year);
    (byShard[k] = byShard[k] || {term:r.term, year:r.year, ids:new Set()}).ids.add(r.id);
  });
  return Promise.all(Object.values(byShard).map(({term,year,ids})=>
    mergeScoreShard(SCHOOL_ID, term, year, fresh=>fresh.filter(x=>!ids.has(x.id)))
  ));
}

/* ---- Global credential uniqueness (no two accounts anywhere may share a
   username, and no two accounts anywhere may share a password) ---- */
async function collectAllCredentials(){
  // Every school's accounts doc is independent — fetch them all together
  // instead of one school at a time (this ran on every signup/account-create,
  // so on a platform with many schools the old sequential loop was one of the
  // slower things a user could trigger).
  const perSchool = await Promise.all(REGISTRY.map(reg=>getShared(`sch_${reg.id}_accounts`, [])));
  const all = [];
  REGISTRY.forEach((reg,i)=>{
    perSchool[i].forEach(a=> all.push({username:a.username, password:a.password, schoolId:reg.id}));
  });
  if(SYSTEM_OWNER) all.push({username:SYSTEM_OWNER.username, password:SYSTEM_OWNER.password, schoolId:null});
  return all;
}
// opts: {excludeSchoolId, excludeUsername} lets an account being edited skip colliding with itself
// A new account is blocked only if BOTH its username and its password
// exactly match an existing account elsewhere (that pair would be truly
// ambiguous at login). Having just one of the two in common with someone
// else's account is fine and does not block account creation.
async function checkCredentialUniqueness(username, password, opts){
  opts = opts||{};
  const all = await collectAllCredentials();
  let exactMatch=false;
  for(const a of all){
    const isSelf = opts.excludeSchoolId!==undefined && a.schoolId===opts.excludeSchoolId && a.username===opts.excludeUsername;
    if(isSelf) continue;
    if(username && password && a.username && a.username.toLowerCase()===username.toLowerCase() && a.password===password){
      exactMatch = true; break;
    }
  }
  return {exactMatch};
}
/* ---- Per-school username uniqueness ----
   Usernames only need to be unique *within one school*: no two accounts at the
   same school (owner/admin, teacher, or parent) may share a username, but two
   different schools are free to each hand their own staff the same username —
   they're separate logins that just happen to look alike, and passwords may
   repeat anywhere (even system-wide). Always pass just the ONE school's own
   accounts array here, never every school's accounts, and, when editing an
   existing account, its current username so it doesn't collide with itself. */
function isUsernameTakenInSchool(username, accounts, excludeUsername){
  const uLower = (username||'').trim().toLowerCase();
  if(!uLower) return false;
  return (accounts||[]).some(a=>{
    if(!a.username) return false;
    if(excludeUsername && a.username.toLowerCase()===excludeUsername.trim().toLowerCase()) return false;
    return a.username.toLowerCase()===uLower;
  });
}

/* ---------- Automatic snapshots (see section 1A above) ---------- */
// Builds the same shape as a manual/founder backup file, for whichever school is
// currently loaded.
function currentSchoolBackupPayload(exportedBy){
  return {
    app:'CT-E SOLUTIONS backup', schemaVersion: BACKUP_SCHEMA_VERSION, schoolId: SCHOOL_ID,
    exportedAt: new Date().toISOString(), exportedBy: exportedBy||'auto-snapshot',
    info: DB.info, accounts: DB.accounts, classes: DB.classes, students: DB.students,
    assignments: DB.assignments, scores: DB.scores, bands: DB.bands, obands: DB.obands, pbands: DB.pbands
  };
}
// Actually takes a snapshot right now and stores it, trimming anything beyond
// AUTO_SNAPSHOT_KEEP (deleting the dropped snapshots' data too, not just the index entry).
async function takeAutoSnapshotNow(){
  if(!SCHOOL_ID || !DB.info) return null;
  const ts = Date.now();
  const data = currentSchoolBackupPayload('auto-snapshot');
  await setShared(`sch_${SCHOOL_ID}_autosnap_${ts}`, data);
  const priorIndex = await getShared(`sch_${SCHOOL_ID}_autosnaps_index`, []);
  const merged = [{ts, takenAt: data.exportedAt}, ...priorIndex];
  const kept = merged.slice(0, AUTO_SNAPSHOT_KEEP);
  const dropped = merged.slice(AUTO_SNAPSHOT_KEEP);
  await setShared(`sch_${SCHOOL_ID}_autosnaps_index`, kept);
  await Promise.all(dropped.map(e=>deleteShared(`sch_${SCHOOL_ID}_autosnap_${e.ts}`)));
  DB.autoSnapshots = kept;
  return ts;
}
// Called after a school's data loads. If it's been long enough since the last
// automatic snapshot (or none exists yet), takes one — silently, in the
// background. Marks lastAutoSnapshotAt optimistically before the snapshot
// finishes so two devices loading at the same moment don't both fire.
async function maybeTakeAutoSnapshot(){
  if(!SCHOOL_ID || !DB.info) return;
  const days = daysSince(DB.info.lastAutoSnapshotAt);
  if(DB.info.lastAutoSnapshotAt && days < AUTO_SNAPSHOT_MIN_GAP_DAYS) return;
  DB.info.lastAutoSnapshotAt = new Date().toISOString();
  try{
    await saveInfo();
    await takeAutoSnapshotNow();
    render(); // update the "Backup & Restore" card if it's on screen
  }catch(e){ console.error('Automatic snapshot failed', e); }
}
// Restores the school's current data from one of its own automatic snapshots.
async function restoreAutoSnapshot(ts){
  const raw = await getShared(`sch_${SCHOOL_ID}_autosnap_${ts}`, null);
  if(!raw){ alert('That snapshot could not be found — it may have already been cleaned up.'); return; }
  const data = migrateBackupData(raw);
  const sure = confirm(`This will REPLACE all current school data with the automatic snapshot from ${data.exportedAt?new Date(data.exportedAt).toLocaleString():'that time'}.\n\nStudents in snapshot: ${data.students.length}\nCurrent students: ${DB.students.length}\n\nThis cannot be undone. Continue?`);
  if(!sure) return;
  DB.info = data.info; DB.accounts = data.accounts; DB.classes = data.classes;
  DB.students = data.students; DB.assignments = data.assignments; DB.scores = data.scores;
  DB.bands = data.bands; DB.obands = data.obands; DB.pbands = data.pbands;
  await Promise.all([saveInfo(), saveAccounts(), saveClasses(), saveStudents(), saveAssignments(), saveScores(), saveBands(), saveOBands(), savePBands()]);
  alert('Restore complete.'); render();
}

// ---- Score submission deadline ----
// Admin sets one cutoff for Course Work submissions and a separate one for End of
// Term submissions (kind = 'AOI' or 'EOT') — a class doing CW tests all term but
// exams later needs different cutoffs for each. Either can be cleared any time by
// just leaving that field blank and resubmitting. Once a deadline passes, teachers
// can be reopened individually, or all at once with one click, at the admin's
// discretion. Admins themselves are never blocked by any of this.
function scoreDeadlineFor(kind){
  const sd = (DB.info && DB.info.scoreDeadlines) || {};
  return sd[kind] || {deadline:null, reopenedFor:[]};
}
function scoreDeadlinePassed(kind){
  const d = scoreDeadlineFor(kind).deadline;
  if(!d) return false;
  const t = new Date(d).getTime();
  if(isNaN(t)) return false;
  return Date.now() > t;
}
function teacherLockedByDeadline(username, kind){
  if(!scoreDeadlinePassed(kind)) return false;
  const reopened = scoreDeadlineFor(kind).reopenedFor || [];
  return !reopened.includes(username);
}

function autoSubsidiary(principals){
  const hasMath = principals.includes('MATHEMATICS');
  const inScienceGroup = principals.some(p=>SCIENCE_GROUP.includes(p));
  if(inScienceGroup && !hasMath) return 'SUBSIDIARY MATHEMATICS';
  return 'SUBSIDIARY COMPUTER';
}
function combinationCode(principals){ return principals.map(p=>ABBR[p]||p.slice(0,3).toUpperCase()).join('/'); }

// Assigning subjects is entirely the responsibility of each subject teacher, never the
// admin. Admin registration only ever records a student's name, admission number, sex
// and class — nothing about which subjects they take. The moment a subject teacher opens
// their class for the first time, every student already in that class is available for
// them to tick; only the ones they tick are considered to take that subject, and that
// tick (assignment.studentIds) is the single source of truth used everywhere below.
function rosterSubjectsFor(st, cls){
  if(!cls) return [];
  const subs = new Set();
  DB.assignments.filter(a=>a.classId===cls.id && Array.isArray(a.studentIds) && a.studentIds.includes(st.id))
    .forEach(a=>subs.add(a.subject));
  return [...subs];
}
// Which of a student's ticked subjects count as one of their 3 A-Level principals (as
// opposed to General Paper / the subsidiary, which are compulsory add-ons, not ticked
// choices in the same sense).
function principalsFor(st, cls){
  if(!cls || cls.level!=='A') return [];
  const opts = new Set(aOptionalList());
  return rosterSubjectsFor(st, cls).filter(s=>opts.has(s));
}
function studentSubjects(st, cls){
  if(!cls) return [];
  if(cls.level==='O'){
    const compulsory = oCompulsoryFor(cls.form);
    const extra = rosterSubjectsFor(st, cls).filter(s=>!compulsory.includes(s));
    return [...new Set([...compulsory, ...extra])];
  }
  if(cls.level==='P'){
    const compulsory = pCompulsoryList();
    const extra = rosterSubjectsFor(st, cls).filter(s=>!compulsory.includes(s));
    return [...new Set([...compulsory, ...extra])];
  }
  // A-Level: principals are whichever principal-subject teachers have ticked this
  // student into their own class roster. General Paper is compulsory for every A-Level
  // student, and the subsidiary (Maths or Computer) is derived automatically from the
  // science-group/Maths rule — neither needs a separate tick to exist on the report card,
  // though their own teachers still keep their own roster for marking purposes. Any
  // admin-added extra compulsory subjects (aCompulsoryExtra) are auto-included the same
  // way, on top of whatever the student's ticked principals already are.
  const principals = principalsFor(st, cls);
  if(!principals.length) return [];
  return [...new Set([...principals, 'GENERAL PAPER', ...aCompulsoryExtra(), autoSubsidiary(principals)])];
}
function comboLabel(st, cls){
  if(!cls) return '—';
  if(cls.level==='O' || cls.level==='P'){
    const compulsory = cls.level==='O' ? oCompulsoryFor(cls.form) : pCompulsoryList();
    const extra = rosterSubjectsFor(st, cls).filter(s=>!compulsory.includes(s));
    return extra.length ? extra.map(s=>ABBR[s]||s.slice(0,4).toUpperCase()).join('/') : '—';
  }
  const principals = principalsFor(st, cls);
  return principals.length ? combinationCode(principals) : '—';
}
function classOf(st){ return DB.classes.find(c=>c.id===st.classId); }
// Every class where the currently signed-in teacher is the designated Class Teacher
// (cls.classTeacher === their username). Empty for admins/parents or a teacher who
// isn't set as any class's Class Teacher yet. Used to give a Class Teacher visibility
// into Mark Sheets, Class Analysis and the Master Mark Sheet for their WHOLE class —
// every subject, not just the ones they personally teach — without opening those up to
// every teacher in the school.
function classTeacherClasses(){
  if(!CUR || CUR.role!=='teacher') return [];
  return DB.classes.filter(c=>c.classTeacher===CUR.username);
}
function classTeacherClassIds(){ return classTeacherClasses().map(c=>c.id); }

function rawScores(studentId, subject, term, year){
  term = term || DB.info.currentTerm; year = year || DB.info.currentYear;
  return DB.scores.filter(s=>s.studentId===studentId && s.subject===subject && s.term===term && s.year===year);
}
// Returns every distinct term/year for which this student has at least one score on
// file, most recent first, limited to the MAX_TERMS_BEHIND retention window — used to
// populate the "view a past term" picker on the report card.
function availableTermYears(studentId){
  const seen = new Map();
  DB.scores.filter(s=>s.studentId===studentId).forEach(s=>{
    if(!s.term || !s.year) return;
    const dist = termsBehindCurrent(s.term, s.year);
    if(dist<0 || dist>MAX_TERMS_BEHIND) return;
    seen.set(`${s.term}||${s.year}`, {term:s.term, year:s.year});
  });
  const list = [...seen.values()];
  const termOrder = {'Term 1':1,'Term 2':2,'Term 3':3};
  list.sort((a,b)=> b.year-a.year || (termOrder[b.term]||0)-(termOrder[a.term]||0));
  return list;
}
// Every test/exam is entered against whatever maximum the teacher set for it (row.max).
// It's rescaled onto the fixed report-card scale before averaging: AOI tests scale onto
// /20, and End of Term papers scale onto /80. Older score rows saved before this feature
// existed have no .max on file, so they fall back to the historical assumption of /100.
function scaleRow(row, outOf){
  const max = Number(row.max)>0 ? Number(row.max) : 100;
  return (Number(row.marks)/max) * outOf;
}
// Combines one paper's Course Work average (entered on record already scaled to
// /cfg.cwPercent, e.g. /20) and End of Term average (already scaled to /cfg.eotPercent,
// e.g. /80) into that paper's average out of 100 — this IS the "Paper Average".
// Rule: scale Course Work up to its own 100% AND scale End of Term up to its own 100%,
// then divide by 2. cfg.cwPercent/cfg.eotPercent only control the scale marks are
// entered/displayed against (the "(/20)"/"(/80)" column headers) — they are NOT used as
// grading weights, so Course Work and End of Term always contribute equally (50/50) to
// the Paper Average no matter what split the admin has configured.
// If only ONE of the two is on record, the learner is not penalized with a zero for the
// missing half: that single score is scaled up to its own 100% and used as the paper
// average on its own.
// This is the one place this math happens, so the "Paper Avg" column and the "Final
// Average" used for grading always agree, and a subject's Final Average (for subjects
// with 2+ papers, see subjectBreakdown below) is simply the average of its papers'
// own Paper Averages.
function combinePaper(cwAvg, eotAvg, cfg){
  const hasCw = cwAvg!==null && cwAvg!==undefined;
  const hasEot = eotAvg!==null && eotAvg!==undefined;
  const cwPct = hasCw ? (cfg.cwPercent>0 ? (cwAvg/cfg.cwPercent)*100 : cwAvg) : null;
  const eotPct = hasEot ? (cfg.eotPercent>0 ? (eotAvg/cfg.eotPercent)*100 : eotAvg) : null;
  if(cwPct!==null && eotPct!==null) return (cwPct + eotPct) / 2;
  if(cwPct!==null) return cwPct;
  if(eotPct!==null) return eotPct;
  return null;
}
function subjectBreakdown(studentId, subject, term, year){
  const _st = DB.students.find(x=>x.id===studentId);
  const cls = _st ? classOf(_st) : null;
  const cfg = examConfig(_st && _st.classId);
  const rows = rawScores(studentId, subject, term, year);
  const aoiScaled = cfg.cwEnabled ? rows.filter(r=>r.kind==='AOI').map(r=>scaleRow(r, cfg.cwPercent)) : [];
  const eotScaled = cfg.eotEnabled ? rows.filter(r=>r.kind==='EOT').map(r=>scaleRow(r, cfg.eotPercent)) : [];
  const aoiAvg = aoiScaled.length ? aoiScaled.reduce((a,b)=>a+b,0)/aoiScaled.length : null;
  const eotAvg = eotScaled.length ? eotScaled.reduce((a,b)=>a+b,0)/eotScaled.length : null;
  if(aoiAvg===null && eotAvg===null) return {aoiAvg:null, eotAvg:null, final:null};
  // Final average rule: Course Work and End of Term always contribute equally (50/50),
  // regardless of the admin's configured cwPercent/eotPercent split — that split still
  // governs the scale marks are entered/displayed against (aoiAvg/eotAvg above, e.g.
  // "/20" and "/80" on the report table), but grading itself scales each component up
  // to its own 100% first, then averages the two. If only one component is on record
  // so far (e.g. the admin hasn't switched on / no scores exist yet for the other one),
  // grade off just that component scaled to 100 instead of waiting for both parts.
  function combine(cwAvg, eotAvg2){
    return combinePaper(cwAvg, eotAvg2, cfg);
  }
  // Subjects with two (or more) papers grade differently: each paper is graded on its
  // own — that paper's Course Work and End of Term marks combined via the same ÷2 rule
  // above — and the subject's final average is the average of the papers' own finals.
  // This is NOT the same as pooling every paper's raw scores into one combined CW
  // average and one combined EOT average and halving that (which is what aoiAvg/eotAvg
  // above still do, purely for display when no paper has been entered yet).
  const papers = subjectPapersFor(subject, cls);
  let final;
  if(papers.length >= 2){
    const paperFinals = papers.map(p=>{
      const pRows = rows.filter(r=>String(r.paper)===String(p));
      const pAoi = cfg.cwEnabled ? pRows.filter(r=>r.kind==='AOI').map(r=>scaleRow(r, cfg.cwPercent)) : [];
      const pEot = cfg.eotEnabled ? pRows.filter(r=>r.kind==='EOT').map(r=>scaleRow(r, cfg.eotPercent)) : [];
      const pAoiAvg = pAoi.length ? pAoi.reduce((a,b)=>a+b,0)/pAoi.length : null;
      const pEotAvg = pEot.length ? pEot.reduce((a,b)=>a+b,0)/pEot.length : null;
      if(pAoiAvg===null && pEotAvg===null) return null;
      return combine(pAoiAvg, pEotAvg);
    }).filter(f=>f!==null);
    // Only average across papers that actually have a score on record yet — a paper
    // with nothing entered simply doesn't drag the average down. If NO paper has
    // anything on record yet (shouldn't normally happen since aoiAvg/eotAvg above
    // would then also be null), fall back to the combined figures.
    final = paperFinals.length ? paperFinals.reduce((a,b)=>a+b,0)/paperFinals.length : combine(aoiAvg, eotAvg);
  } else {
    final = combine(aoiAvg, eotAvg);
  }
  return {aoiAvg, eotAvg, final};
}
function subjectAverage(studentId, subject, term, year){
  return subjectBreakdown(studentId, subject, term, year).final;
}
// A subject can have more than one paper (e.g. Physics Paper 1 & Paper 2), set by
// whoever the class/subject is assigned to. The report card grades the SUBJECT as one
// whole — off the combined average of every paper's marks — never a single paper alone.
// This just looks up which papers exist for a subject in a class.
function subjectPapersFor(subject, cls){
  if(!cls) return [];
  // Several teachers can each hold their own assignment row for the same subject+class
  // (one per paper) — e.g. Teacher A on Paper 1, Teacher B on Paper 2. Pull the paper
  // list from EVERY matching assignment, not just the first one found, or a second
  // teacher's paper never shows up and the report card can't split into sub-rows.
  const asns = DB.assignments.filter(x=>x.subject===subject && x.classId===cls.id);
  const papers = [];
  asns.forEach(a=>{
    if(Array.isArray(a.papers)) a.papers.forEach(p=>{ if(!papers.some(x=>String(x)===String(p))) papers.push(p); });
  });
  papers.sort((x,y)=>String(x).localeCompare(String(y), undefined, {numeric:true}));
  return papers;
}
// Per-paper breakdown for a multi-paper subject, so the report card can show each paper
// as its own sub-row (marks only — grading itself stays off the combined average, never
// a single paper). Returns null if the subject only has one paper on record, since then
// there's nothing to break out. allEntered is true only once the respective teacher has
// entered at least one score for EVERY paper on record for this subject — until then the
// report card just shows the subject as a single row, as before.
function subjectPaperBreakdown(studentId, subject, cls, term, year){
  const papers = subjectPapersFor(subject, cls);
  if(papers.length < 2) return null;
  const cfg = examConfig(cls && cls.id);
  const rows = rawScores(studentId, subject, term, year);
  const perPaper = papers.map(p=>{
    const pRows = rows.filter(r=>String(r.paper)===String(p));
    const hasAny = pRows.length>0;
    const aoiScaled = cfg.cwEnabled ? pRows.filter(r=>r.kind==='AOI').map(r=>scaleRow(r, cfg.cwPercent)) : [];
    const eotScaled = cfg.eotEnabled ? pRows.filter(r=>r.kind==='EOT').map(r=>scaleRow(r, cfg.eotPercent)) : [];
    const aoiAvg = aoiScaled.length ? aoiScaled.reduce((a,b)=>a+b,0)/aoiScaled.length : null;
    const eotAvg = eotScaled.length ? eotScaled.reduce((a,b)=>a+b,0)/eotScaled.length : null;
    return {paper:p, hasAny, aoiAvg, eotAvg};
  });
  const allEntered = perPaper.every(p=>p.hasAny);
  return {papers: perPaper, allEntered};
}
// Which teacher actually entered the scores for one paper of a subject (falls back to
// "any paper" when paper is null) — read straight off the score rows themselves (each
// carries the username of whoever saved it), so this stays accurate even when several
// teachers share a subject, one per paper.
function paperTeacherInit(studentId, subject, paper, term, year){
  let rows = DB.scores.filter(sc=>sc.studentId===studentId && sc.subject===subject && sc.term===term && sc.year===year && sc.teacher);
  if(paper!=null) rows = rows.filter(sc=>String(sc.paper)===String(paper));
  if(!rows.length) return null;
  // Only credit these initials to whoever entered the marks if that person is actually
  // a teacher. When an admin enters marks on a teacher's behalf, the entry is stamped
  // with the admin's username — that shouldn't put the admin's initials on the report
  // card, so admin-entered rows are skipped here and the caller falls back to whichever
  // teacher is actually assigned to this subject/paper instead.
  const enteredByTeacher = rows
    .map(r=>DB.accounts.find(a=>a.username===r.teacher))
    .find(acc=>acc && acc.role==='teacher');
  return enteredByTeacher ? initials(enteredByTeacher.name) : null;
}
// Raw mark for one admin-defined Course Work test (by name), for a subject/paper.
// paper===null matches any paper on record (used while a multi-paper subject hasn't
// had every paper broken out into its own report-card sub-row yet).
function cwTestScore(studentId, subject, testName, paper, term, year){
  return DB.scores.find(sc=>sc.studentId===studentId && sc.subject===subject && sc.kind==='AOI' && sc.label===testName
    && sc.term===term && sc.year===year && (paper==null || String(sc.paper)===String(paper)));
}
function gradeFor(subject, avg, level){
  if(level==='O'){
    const b = DB.obands || DEFAULT_O_BANDS;
    for(const g of ['A','B','C','D','E']) if(b[g] && avg>=b[g][0] && avg<=b[g][1]) return g;
    return 'E';
  }
  if(level==='P'){
    const b = DB.pbands || DEFAULT_P_BANDS;
    for(const g of PLE_GRADES) if(b[g] && avg>=b[g][0] && avg<=b[g][1]) return g;
    return 'F9';
  }
  // General Paper now follows the SAME pass/fail condition as the subsidiaries:
  // O (1 point) if the average is 50% and above, F (0 points) below 50%.
  if(subject==='GENERAL PAPER' || SUBSIDIARIES.includes(subject)) return avg>=PASS_MARK_SUBSIDIARY ? 'O':'F';
  const b = DB.bands || DEFAULT_A_BANDS;
  for(const g of ['A','B','C','D','E','O','F']) if(b[g] && avg>=b[g][0] && avg<=b[g][1]) return g;
  return 'F';
}
// A-Level subsidiaries (General Paper + Subsidiary Maths/Computer) are graded pass/fail
// internally as 'O'/'F' (so GRADE_POINTS, sorting, etc. still work unchanged), but on the
// report card the Grade column itself should read "Pass"/"Fail" rather than the bare
// letter — the Descriptor column already showed those words via GRADE_COMMENT, this just
// brings the Grade column into agreement for subsidiary subjects specifically.
// Color-codes a grade letter/code so it's unmistakable at a glance on wide tables like
// the Master Mark Sheet (bold text alone gets lost next to columns of plain numbers).
// Covers O/A-Level letters (A-F,O) and Primary PLE codes (D1-F9) in one lookup.
function gradeColorFor(grade){
  if(!grade || grade==='—') return '';
  if(['A','D1','D2'].includes(grade)) return 'var(--good)';
  if(['F','F9'].includes(grade)) return 'var(--danger)';
  if(['E','O','P7','P8'].includes(grade)) return '#8a6d00';
  return 'var(--navy)'; // B, C, D, C3-C6
}
function gradeDisplay(subject, grade, level){
  if(level==='A' && (subject==='GENERAL PAPER' || SUBSIDIARIES.includes(subject))){
    if(grade==='O') return 'Pass';
    if(grade==='F') return 'Fail';
  }
  return grade;
}
// Aggregate (sum of grade-points) of the school's Primary compulsory (core) subjects →
// Division, the Ugandan primary equivalent of an O/A-Level overall grade. Uses whatever
// the admin currently has set as compulsory (pCompulsoryList(), default: the 4 real
// PLE-core subjects) — see the note on pCompulsoryList() about Division accuracy if that
// set is changed from the standard 4.
function primaryAggregate(st, cls, term, year){
  if(!cls || cls.level!=='P') return null;
  const coreSubjects = pCompulsoryList();
  let sum=0, count=0;
  for(const subj of coreSubjects){
    const avg = subjectAverage(st.id, subj, term, year);
    if(avg===null) continue;
    const g = gradeFor(subj, avg, 'P');
    sum += PLE_GRADE_POINTS[g]; count++;
  }
  if(count < coreSubjects.length) return null; // Division needs every compulsory subject on record
  return sum;
}
function gradeColsFor(level){
  if(level==='A') return ['A','B','C','D','E','O','F'];
  if(level==='P') return PLE_GRADES;
  return ['A','B','C','D','E'];
}
function overallGradeFor(cls, avgPct){ return cls.level==='A' ? null : gradeFor('', avgPct, cls.level); }
function teacherForSubjectClass(subject, classId){
  const a = DB.assignments.find(a=>a.subject===subject && a.classId===classId);
  if(!a) return null;
  return DB.accounts.find(acc=>acc.username===a.teacherUsername) || null;
}
// maxPointsFor: every ticked principal is worth 5, GENERAL PAPER and the auto-derived
// subsidiary are each worth a flat 1 (their own pass/fail scale — see gradeFor), and any
// admin-added extra compulsory A-Level subjects (aCompulsoryExtra) are graded normally
// (A-E scale) so each is worth 5, same as a principal.
function maxPointsFor(st, cls){ return principalsFor(st, cls || classOf(st)).length*5 + 1 + 1 + aCompulsoryExtra().length*5; }

function computeSubjectRows(st, cls, term, year){
  const subs = studentSubjects(st, cls);
  let totalPoints=0, sumAvg=0, countAvg=0;
  const rows = subs.map(subj=>{
    const avg = subjectAverage(st.id, subj, term, year);
    const grade = avg===null ? null : gradeFor(subj, avg, cls.level);
    let pts=0;
    if(cls.level==='A' && grade) pts = GRADE_POINTS[grade];
    if(avg!==null){ sumAvg+=avg; countAvg++; totalPoints+=pts; }
    const t = teacherForSubjectClass(subj, cls.id);
    return {subject:subj, avg, grade, pts, teacherInit: t?initials(t.name):'--'};
  });
  return { rows, totalPoints, avgPct: countAvg? sumAvg/countAvg : 0 };
}
function metricFor(st, cls, term, year){ const d = computeSubjectRows(st, cls, term, year); return cls.level==='A' ? d.totalPoints : d.avgPct; }
// classPosition() is called once PER STUDENT from every whole-class view (Master Mark
// Sheet, Class Analysis, Report Cards) — so without caching, ranking a class of N
// students redid the full O(N) ranking pass N times (O(N^2) overall), redundantly
// recomputing every peer's subject/score totals on every single call. For a
// realistically sized class that's enough synchronous work on the main thread to make
// a single tap look "unresponsive" for several seconds before anything repaints. This
// cache computes the ranking once per (class, term, year, current scores) and reuses
// it for every student, cutting a full render down to O(N) total.
let _rankCache = {scoresRef:null, key:'', map:null};
function computeClassRankings(cls, term, year){
  const key = cls.id+'|'+term+'|'+year;
  if(_rankCache.scoresRef===DB.scores && _rankCache.key===key) return _rankCache.map;
  const peers = DB.students.filter(s=>s.classId===cls.id);
  const scored = peers.map(s=>({id:s.id, m:metricFor(s, cls, term, year)})).sort((a,b)=>b.m-a.m);
  const map = new Map();
  let position = scored.length;
  for(let i=0;i<scored.length;i++){
    if(i===0 || scored[i].m < scored[i-1].m) position = i+1;
    map.set(scored[i].id, {position, size:peers.length});
  }
  _rankCache = {scoresRef:DB.scores, key, map};
  return map;
}
function classPosition(student, cls, term, year){
  const map = computeClassRankings(cls, term, year);
  return map.get(student.id) || {position: DB.students.filter(s=>s.classId===cls.id).length || 1, size: DB.students.filter(s=>s.classId===cls.id).length};
}
function overallRemark(pct, who){
  if(who==='class'){
    if(pct>=0.75) return 'Excellent overall performance this term. Keep up the outstanding work.';
    if(pct>=0.5) return 'Good, steady performance. A little more effort will push results higher.';
    if(pct>=0.3) return 'Fair performance. Needs closer attention and more consistent study habits.';
    return 'Performance is below expectation. Requires serious improvement and support.';
  } else {
    if(pct>=0.75) return 'A commendable result — well done this term.';
    if(pct>=0.5) return 'A satisfactory result with clear room to grow.';
    if(pct>=0.3) return 'This result calls for renewed effort next term.';
    return 'This result is a serious concern and needs urgent action.';
  }
}

// Student/staff photos are shown at most ~90px wide on screen and in the
// report card's BioData box (see .rc-bio-photo), which is what sizes this —
// 190px source gives ~2x that for sharp printing without extra dead weight.
const PHOTO_MAX_DIM = 190;
const PHOTO_MAX_BYTES = 35*1024; // hard cap: no uploaded student/staff photo may exceed 35KB
// The school logo is shown larger (report card header), so it keeps its own,
// higher dimension/size targets.
const LOGO_MAX_DIM = 450;
const LOGO_MAX_BYTES = 300*1024;
// True only if this browser can actually encode canvas content as WebP (not
// just decode/display it) — checked once, reused by every compression below.
const SUPPORTS_WEBP_ENCODE = (()=>{
  try{
    const c = document.createElement('canvas'); c.width = c.height = 1;
    return c.toDataURL('image/webp').indexOf('data:image/webp') === 0;
  }catch(e){ return false; }
})();
const COMPRESS_MIME = SUPPORTS_WEBP_ENCODE ? 'image/webp' : 'image/jpeg';
// Resizes + re-compresses an image file, shrinking dimensions and quality
// step by step, until the result is at or under maxBytes. Uses WebP where the
// browser supports encoding it (meaningfully smaller than JPEG at the same
// visual quality), falling back to JPEG otherwise. Returns a Blob, which
// uploadPhotoToStorage then turns into the base64 string actually saved.
async function compressImage(file, maxDim, maxBytes){
  maxBytes = maxBytes || PHOTO_MAX_BYTES;
  const img = await new Promise((res, rej)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const im = new Image();
      im.onload = ()=>res(im);
      im.onerror = rej;
      im.src = e.target.result;
    };
    reader.onerror = rej;
    reader.readAsDataURL(file);
  });
  let dim = maxDim;
  let best = null; // smallest blob found so far, in case we never hit the target
  for(let attempt=0; attempt<6; attempt++){
    let {width,height} = img;
    if(width>height){ if(width>dim){ height*=dim/width; width=dim; } }
    else{ if(height>dim){ width*=dim/height; height=dim; } }
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1,Math.round(width));
    canvas.height = Math.max(1,Math.round(height));
    canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    for(const q of [0.8,0.6,0.45,0.3,0.18,0.1]){
      const blob = await new Promise(res=>canvas.toBlob(res,COMPRESS_MIME,q));
      if(!blob) continue;
      if(!best || blob.size<best.size) best = blob;
      if(blob.size<=maxBytes) return blob;
    }
    dim = Math.round(dim*0.7); // still too big — shrink dimensions and try again
  }
  return best; // closest we could get; still far smaller than the original
}
// Converts a compressed photo Blob straight into a base64 data URL and returns
// it — this string is saved directly on the student/school record in Firestore.
// Photos are pre-compressed to PHOTO_MAX_BYTES/LOGO_MAX_BYTES before this is
// ever called, so even after base64's ~33% size overhead they stay well under
// Firestore's 1MB-per-document limit.
// (Previously this uploaded to Firebase Storage instead, but Storage requires
// the project to be on Firebase's paid "Blaze" plan even for tiny amounts of
// data, which is why uploads were failing on the free "Spark" plan. Storing
// the image inline in Firestore sidesteps that entirely.)
async function uploadPhotoToStorage(blob, pathPrefix){
  if(!blob) return null;
  return await new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = e=>res(e.target.result);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}
// No-op now: photos live inline in the Firestore document as a base64 data
// URL, so there's no separate file in a bucket to clean up. Kept as a function
// (rather than deleting every call site) so nothing else needs to change.
async function deletePhotoFromStorage(url){
  // Nothing to do — the old base64 string is simply overwritten/removed
  // wherever the caller updates the record.
}
function fitOnePage(root){
  const inner = root.querySelector('.rc-card');
  if(!inner) return;
  inner.style.transform=''; inner.style.width='';
  const target = 1040;
  const h = inner.scrollHeight;
  // Scales the card to exactly fill the one-A4-page budget either way: shrinks a
  // report card that's too tall (many subjects) so it still lands on one page,
  // and — just as importantly — grows a report card that's short (few subjects)
  // so it fills the page instead of sitting small with empty space below it.
  // Bounds keep either direction from looking absurd: never blown up past 1.25x
  // (a 2-3 subject card shouldn't look like a poster) and never shrunk below
  // 0.7x (past that, text stops being legibly printable).
  let scale = target/h;
  scale = Math.max(0.7, Math.min(scale, 1.25));
  if(Math.abs(scale-1)>0.01){
    inner.style.transformOrigin='top left';
    inner.style.transform=`scale(${scale})`;
    inner.style.width=(100/scale)+'%';
  }
}

// Shared nav config per role: [key, label, icon]. Used for both the sidebar
// links and the tap-to-open icon tiles shown on each role's dashboard.
const NAV_BY_ROLE = {
  admin: [
    ['dashboard','Dashboard','🏠'],['schoolinfo','School Info & Logo','🏫'],['classes','Classes','📚'],
    ['accounts','Staff & Parent Accounts','👥'],['students','Students','🎓'],['assignsubjects','Assign Subjects','📌'],
    ['olevel','A-Level, O-Level & Primary Extra Subjects','📖'],['grading','Grading Setup','⚙️'],['promote','Promote Students','⬆️'],
    ['ascores','Enter / Download Scores','✍️'],['marksheets','Mark Sheets','📋'],['classanalysis','Class Analysis','📈'],
    ['reports','Report Cards','📄'],['mastermarksheet','Master Mark Sheet','🗂️'],['password','Change Password','🔒']
  ],
  teacher: [
    ['tdash','Dashboard','🏠'],['tscores','Enter Scores','✍️'],['marksheets','Mark Sheets','📋'],
    ['classanalysis','Class Analysis','📈'],['mastermarksheet','Master Mark Sheet','🗂️'],
    ['treports','View Report Cards','📄'],['password','Change Password','🔒']
  ],
  parent: [
    ['pdash','My Child','🏠'],['preport','Report Card','📄'],['password','Change Password','🔒']
  ]
};
// A tap/click grid of icon tiles for a role's dashboard — one tile per feature,
// sized to fit comfortably on a phone screen. excludeKey leaves off the
// dashboard's own tile since the user is already there.
function featureTilesHTML(role, excludeKey){
  const items = (NAV_BY_ROLE[role]||[]).filter(([k])=>k!==excludeKey);
  if(!items.length) return '';
  return `<div class="tile-grid">${items.map(([k,l,icon])=>`
    <button type="button" class="tile" data-action="nav:${k}">
      <span class="tile-icon">${icon}</span>
      <span class="tile-label">${l}</span>
    </button>`).join('')}</div>`;
}
function renderShell(){
  const nav = NAV_BY_ROLE[CUR.role];
  const view = (VIEW.name==='boot' || (!nav.some(n=>n[0]===VIEW.name) && !DETAIL_VIEWS.has(VIEW.name))) ? nav[0][0] : VIEW.name;
  return `
  <div class="topbar">
    <div class="brand">CT-E <span>SOLUTIONS</span> <span class="small" style="color:#cfe0f2;font-weight:400;display:inline-flex;align-items:center;gap:8px;">— ${esc(DB.info.schoolName)}${DB.info.logo?`<img src="${DB.info.logo}" alt="" style="width:26px;height:26px;border-radius:5px;object-fit:cover;flex-shrink:0;">`:''}</span>
      <div class="small" style="color:#cfe0f2;font-weight:400;font-family:'Inter',system-ui,sans-serif;letter-spacing:0;">${esc(FOUNDER_CONTACT)}</div>
    </div>
    <div class="flex"><span class="badge-role">${CUR.role}</span><span>${esc(CUR.name)}</span>
    <button class="btn-outline" style="padding:6px 12px;" data-action="logout">Log out</button></div>
  </div>
  <div class="layout">
    <div class="sidebar">${nav.map(([k,l])=>`<a href="#" class="${view===k?'active':''}" data-action="nav:${k}">${l}</a>`).join('')}</div>
    <div class="main" id="mainArea">${renderView(view)}</div>
  </div>`;
}
// Views that touch student/teacher bio data, account credentials, subject assignment,
// or grading configuration are admin-only. This guard is a hard backstop — the sidebar
// already hides these links from non-admins, but this makes it impossible to reach them
// by any other route (e.g. a stray VIEW.name) regardless of who is signed in.
const ADMIN_ONLY_VIEWS = new Set(['dashboard','schoolinfo','classes','classedit','accounts','students','assignsubjects','olevel','grading','promote','teacherprofile','studentprofile','restoreitems']);
// Class Analysis and the Master Mark Sheet are whole-class views (every subject, every
// student) — open to Admin always, and to a Teacher only for a class where they're the
// designated Class Teacher (see classTeacherClasses()). A teacher who isn't a Class
// Teacher anywhere sees a friendly permission message instead, same pattern as the
// admin-only backstop above.
const CLASS_TEACHER_VIEWS = new Set(['classanalysis','mastermarksheet']);
// Detail pages reached from a row action (not part of the sidebar nav) — kept on
// screen instead of bouncing back to the dashboard when the shell re-renders.
const DETAIL_VIEWS = new Set(['teacherprofile','studentprofile','classedit','restoreitems']);
function renderView(view){
  try{
    if(ADMIN_ONLY_VIEWS.has(view) && (!CUR || CUR.role!=='admin')){
      return '<p>You don\'t have permission to view this page. Only an Admin can manage this.</p>';
    }
    if(CLASS_TEACHER_VIEWS.has(view) && (!CUR || (CUR.role!=='admin' && !(CUR.role==='teacher' && classTeacherClasses().length)))){
      return '<p>You don\'t have permission to view this page. Only an Admin, or a Teacher designated as a Class Teacher, can view this.</p>';
    }
    switch(view){
      case 'dashboard': return adminDashboard();
      case 'schoolinfo': return schoolInfoView();
      case 'classes': return classesView();
      case 'classedit': return classEditView(VIEW.params.classId);
      case 'accounts': return accountsView();
      case 'students': return studentsView();
      case 'assignsubjects': return assignSubjectsView();
      case 'teacherprofile': return teacherProfileView(VIEW.params.username);
      case 'studentprofile': return studentProfileView(VIEW.params.studentId);
      case 'olevel': return oLevelSubjectsView();
      case 'restoreitems': return restoreItemsView();
      case 'grading': return gradingView(VIEW.params.gcClassId);
      case 'promote': return promoteView();
      case 'reports': return reportsListView();
      case 'password': return passwordView();
      case 'ascores': return CUR.role==='admin' ? scoresEntryView(DB.assignments) : '<p>You don\'t have permission to view this page.</p>';
      case 'marksheets': return marksheetsListView();
      case 'classanalysis': return classAnalysisView();
      case 'mastermarksheet': return masterMarkSheetView();
      case 'tdash': return teacherDashboard();
      case 'tscores': return scoresEntryView(DB.assignments.filter(a=>a.teacherUsername===CUR.username));
      case 'treports': return reportsListView();
      case 'pdash': return parentDashboard();
      case 'preport': return parentReportView();
      default: return '<p>Not found.</p>';
    }
  }catch(e){ console.error(e); return '<p>Something went wrong rendering this page: '+esc(e.message)+'</p>'; }
}

/* ---------- Admin: Dashboard ---------- */
const BACKUP_REMINDER_DAYS = 7;
function daysSince(iso){ if(!iso) return null; const ms = Date.now() - new Date(iso).getTime(); return Math.floor(ms/86400000); }
function backupReminderBanner(){
  const days = daysSince(DB.info.lastBackupAt);
  if(days===null){
    return `<div class="note" style="border-color:var(--danger);color:var(--danger);margin-bottom:14px;"><b>You've never downloaded a backup.</b> Go to "Backup & Restore" below and download one now — it only takes a second.</div>`;
  }
  if(days>=BACKUP_REMINDER_DAYS){

  }
  return '';
}

    </table>` : `<p class="small">No automatic snapshot yet — one will be taken the next time this school's data loads.</p>`}
    <hr style="margin:18px 0;border:none;border-top:1px solid var(--line);">
    <h4 style="margin:0 0 6px;">Restore individual items from a backup</h4>
    <p class="small">Bring back one student, one class, a staff account, or your school settings, exactly as they were in an old backup file — without touching anything else currently in your data. Works with a backup from any past version of this app.</p>

      <input type="file" name="backupFile" accept="application/json,.json" required>
      <button class="btn" style="margin-top:10px;">Submit — restore from this file</button>

}

/* ---------- Admin: selectively restore individual items from a backup ---------- */
function restoreItemsView(){
  if(!RESTORE_BROWSE){
    return `<h2>Restore Individual Items</h2><div class="card"><p class="small">No backup file loaded yet. Go to the Dashboard's "Backup & Restore" card and choose a file to browse first.</p><button class="btn-outline" data-action="nav:dashboard">Back to Dashboard</button></div>`;
  }
  const d = RESTORE_BROWSE.data;
  const curStudentIds = new Set(DB.students.map(s=>s.id));
  const curClassIds = new Set(DB.classes.map(c=>c.id));
  const curUsernames = new Set(DB.accounts.map(a=>a.username));
  const teacherAccounts = d.accounts.filter(a=>a.role==='teacher');
  const flag = (isNew)=> isNew
    ? '<span class="small" style="color:var(--danger);">— not in current data (deleted, or never existed)</span>'
    : '<span class="small" style="color:var(--muted);">— exists in current data, will be overwritten</span>';
  return `
  <h2>Restore Individual Items</h2>
  <div class="note">Browsing <b>${esc(RESTORE_BROWSE.fileName)}</b>${d.exportedAt?` — backed up ${fmtDate(d.exportedAt)}`:''}. Tick anything you want brought back exactly as it was in this file. Only ticked items are touched — everything else in your current data is left alone.</div>
  <form data-form="selectiveRestore">
    <div class="card">
      <h3>Students (${d.students.length})</h3>
      ${d.students.map(s=>{
        const cls = d.classes.find(c=>c.id===s.classId);
        return `<label class="flex" style="gap:8px;align-items:center;"><input type="checkbox" name="students" value="${esc(s.id)}" style="width:auto;"><span>${esc(s.name)} — ${esc(s.admNo||'—')}${cls?` (${esc(cls.name)})`:''} ${flag(!curStudentIds.has(s.id))}</span></label>`;
      }).join('') || '<p class="small">No students in this backup.</p>'}
      ${d.students.length ? `<label class="flex" style="gap:8px;margin-top:8px;"><input type="checkbox" name="includeScores" value="1" checked style="width:auto;"><span>Also restore recorded scores for any students ticked above</span></label>` : ''}
    </div>
    <div class="card">
      <h3>Classes (${d.classes.length})</h3>
      ${d.classes.map(c=>`<label class="flex" style="gap:8px;align-items:center;"><input type="checkbox" name="classes" value="${esc(c.id)}" style="width:auto;"><span>${esc(c.name)}${c.stream?' '+esc(c.stream):''} — ${esc(levelLabel(c))} ${flag(!curClassIds.has(c.id))}</span></label>`).join('') || '<p class="small">No classes in this backup.</p>'}
    </div>
    <div class="card">
      <h3>Staff Accounts (${teacherAccounts.length})</h3>
      ${teacherAccounts.map(a=>`<label class="flex" style="gap:8px;align-items:center;"><input type="checkbox" name="accounts" value="${esc(a.username)}" style="width:auto;"><span>${esc(a.name)} (${esc(a.username)}) ${flag(!curUsernames.has(a.username))}</span></label>`).join('') || '<p class="small">No staff accounts in this backup.</p>'}
    </div>
    <div class="card">
      <h3>School Settings</h3>
      <p class="small">Bundles school name/logo/term dates, grading bands, exam setup, and compulsory-subject choices from this file. Replaces your CURRENT settings — doesn't touch students, classes, or accounts.</p>
      <label class="flex" style="gap:8px;"><input type="checkbox" name="restoreSettings" value="1" style="width:auto;"><span>Restore school settings from this file</span></label>
    </div>
    <button class="btn" style="margin-top:6px;">Restore ticked items</button>
    <button type="button" class="btn-outline" style="margin-top:6px;" data-action="nav:dashboard">Cancel</button>
  </form>`;
}

/* ---------- Admin: Edit Student Profile (subjects / sex / class / etc.) ---------- */

  return `
  <h2>Edit Student Profile</h2>
  <div class="note">An Admin can edit a student's class, sex, and other bio-data here. Subjects are never set by the Admin — they're entirely each subject teacher's call, ticked from their own class list the first time they open it (and editable by them at any time after).</div>

        <div><label>Admission number</label><input name="admNo" value="${esc(s.admNo)}" required></div>
        <div><label>Sex</label><select name="gender">

          <option value="Female" ${s.gender==='Female'?'selected':''}>Female</option>

      <label>Class</label>
      <select name="classId" id="editStuClassSel" required>
      ${DB.classes.map(c=>`<option value="${c.id}" data-level="${c.level}" data-form="${c.form||''}" ${c.id===s.classId?'selected':''}>${esc(c.name)} (${esc(levelLabel(c))})</option>`).join('')}
